function reAsk(){
  const k=ui.askId;
  if(typeof k==='string'&&k[0]==='c') showCert(+k.slice(1));
  else if(typeof k==='string'&&k[0]==='r') showReprice(+k.slice(1));
  else if(k!=null) showItem(k);
}

function bulkList(){
  return Object.keys(ui.sel).map(Number).filter(id=>S.inv[id]>0&&!isLocked(id)).map(id=>({id,n:ui.selKeep?S.inv[id]-1:S.inv[id]})).filter(x=>x.n>0);
}
function lockedPrompt(id,act,cb){
  const it=ITEMS[id];
  confirmBox('Mở khóa thẻ?',it.e+' <b>'+it.n+'</b> đang bị khoá nên không thể '+(act||'tham gia sự kiện trong tab Hoạt động')+'. Mở khoá để tiếp tục?','Mở khoá',()=>{
    delete S.locked[id];save();closeModal();refresh();toast('🔓 Đã mở khoá '+it.n);
    if(cb)cb();
  });
}
function qtyWarn(id){
  return (S.inv[id]||0)<=1?'<div class="warn">⚠️ Bạn chỉ còn <b>'+(S.inv[id]||0)+'</b> item này. Tham gia có thể làm bạn <b>mất item đó</b>! Hãy cân nhắc kỹ. Item quý hiếm nên được khoá để tránh dùng nhầm.</div>':'';
}
function showCertResult(c){
  const it=ITEMS[c.id],before=price(c.id),after=certPrice(c);
  sheet('<h2 style="text-align:center">Kết quả thẩm định</h2><div style="text-align:center;margin:10px 0"><div class="score">'+scoreTxt(c.score)+'<small style="font-size:22px;color:var(--ink2)">/10đ</small></div><div class="muted">Chỉ số hoàn hảo</div></div>'+
   '<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2 style="font-size:19px">'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+'</div></div></div>'+
   '<div class="kv"><span>Giá thị trường (chưa thẩm định)</span><b>'+fmt(before)+' ₫</b></div><div class="kv"><span>Hệ số tăng giá</span><b class="up">×'+c.mult.toFixed(2)+'</b></div><div class="kv"><span>Giá sau thẩm định</span><b class="up">'+fmt(after)+' ₫</b></div>'+
   '<button class="btn primary block" style="margin-top:12px" data-a="closeM">Tuyệt vời</button>');

function showBulk(){
  const L=bulkList(),pc=ui.bulkPct;
  let net=0,cst=0;
  L.forEach(({id,n})=>{const A=askInfo(id,pc);net+=A.net*n;cst+=A.cost*n;});
  const g=net-cst;
  sheet('<h2>Đăng bán hàng loạt</h2><div class="chips" style="margin:8px 0"><button class="chip'+(!ui.selKeep?' on':'')+'" data-a="selKeep" data-v="0">Đăng bán hết số lượng</button><button class="chip'+(ui.selKeep?' on':'')+'" data-a="selKeep" data-v="1">Giữ lại 1 mỗi loại</button></div>'+
   '<h4 style="margin:6px 0">Giá bán so với thị trường</h4><div class="chips" style="margin-bottom:8px">'+[-10,0,5,10,20,30].map(n=>'<button class="chip'+(pc===n?' on':'')+'" data-a="bulkPct" data-v="'+n+'">'+(n>0?'+':'')+n+'%</button>').join('')+'</div>'+
   (L.length?L.map(({id,n})=>{const A=askInfo(id,pc);return '<div class="kv"><span>'+ITEMS[id].e+' '+ITEMS[id].n+' ×'+n+'<small style="display:block">'+fmt(A.ask)+' ₫/cái · cơ hội '+chanceTxt(A.p)+'</small></span><b>'+fmt(A.net*n)+' ₫</b></div>';}).join(''):'<p class="muted">Không có item nào để đăng bán với lựa chọn này.</p>')+
   '<div class="kv" style="margin-top:6px"><span><b>Dự kiến thu về</b></span><b>'+fmt(net)+' ₫</b></div><div class="kv"><span>Lãi/lỗ dự kiến</span><b class="'+(g>=0?'up':'dn')+'">'+sgn(g)+' ₫</b></div>'+
   '<div class="btnrow"><button class="btn" data-a="closeM">Hủy</button><button class="btn primary" data-a="selSellOk"'+(L.length?'':' disabled')+'>Xác nhận đăng bán</button></div>');
}

function showHelp(){
  sheet('<div class="row"><h2>📖 Hướng dẫn chơi</h2><button class="chip" data-a="closeM" aria-label="Đóng hướng dẫn">Đóng</button></div><p class="muted">Điều hành cửa hàng: nhập box giá sỉ, bán túi mù và thẻ, phục vụ khách, kiếm lời và hoàn thành BST.</p>'+
    '<h3 class="guide-heading">Một ngày kinh doanh</h3><ol class="guide-steps">'+
    '<li><b>Nhập box</b><p>Vào Siêu thị, chọn BST và số box. Box được đưa vào Kho tồn. Box thường chứa 12 túi; box cao cấp của các BST hoạt hình chứa 8 túi và có xác suất từ Hiếm trở lên gấp đôi.</p></li>'+
    '<li><b>Mở box và chuẩn bị hàng</b><p>Trong Kho tồn, bấm box để nhận túi mù. Bấm túi để chọn đăng bán hoặc xé túi nhận thẻ. Thẻ mở được nằm ở Nhân vật → Túi.</p></li>'+
    '<li><b>Trưng bày túi mù và thẻ</b><p>Đăng bán túi từ Kho tồn, chọn số lượng và giá; bỏ trống giá thì mặc định thị trường +5%. Muốn bán thẻ, vào Nhân vật → Túi, chọn thẻ rồi đăng bán. Hàng xuất hiện tại Cửa hàng → Khu mua sắm. Quầy túi chứa tổng 36 túi, quầy thẻ chứa tổng 24 thẻ, không phân biệt loại hay BST. Mỗi lần tăng sức chứa thêm 12 tốn 150.000₫.</p></li>'+
    '<li><b>Mở cửa đón khách</b><p>Ngày mới là giai đoạn chuẩn bị, đồng hồ chưa chạy. Sắp hàng xong, bấm BẮT ĐẦU NGÀY X. Từ 08:00 đến 21:00 tương đương mặc định 6 phút thực (Admin có thể điều chỉnh). Có thể tạm đóng cửa để dừng khách mới; thời gian vẫn chạy và khách trong tiệm vẫn được phục vụ.</p></li>'+
    '<li><b>Thanh toán và livestream</b><p>Khách chọn hàng rồi xếp hàng ở quầy thanh toán. Bấm khách đứng đầu hàng, xem đơn và chọn Hoàn tất đơn hàng để nhận tiền. Khách hết kiên nhẫn sẽ bỏ đi, trả hàng về quầy và làm giảm 1 HOT.</p><p>Bật Tự livestream để một số khách mua túi đến nhờ nhân viên mở. Xét toàn bộ túi của khách: có ít nhất một thẻ từ Hiếm trở lên được +3–5 HOT; không có bị −1 HOT. Thẻ này thuộc về khách. Khách mua hàng và rời đi không livestream được +1–3 HOT. HOT không xuống dưới 0; HOT cao giúp thu hút khách và tăng khả năng mua hàng.</p></li>'+
    '<li><b>Kết toán và sang ngày mới</b><p>Đến 21:00, tiệm ngừng đón khách mới. Hoàn tất hàng chờ và livestream, rồi bấm HÃY KẾT THÚC NGÀY để xem thu chi, lời/lỗ và trả nợ nếu có. Chọn Sang ngày tiếp theo để trở lại Cửa hàng trong giai đoạn chuẩn bị.</p></li></ol>'+
    '<h3 class="guide-heading">VIP, trộm và camera</h3><p class="muted">Mỗi 3–5 ngày có khách VIP tên vàng, sức mua tối đa và được báo trước trong ngày. Mỗi 3–5 ngày cũng có thể có 1–3 kẻ giấu mặt lấy 3–10 túi mù rồi rời đi không thanh toán. Bấm kẻ trộm trước khi thoát để đánh đuổi, trả túi về quầy. Cuối ngày có báo cáo thất thoát.</p><p class="muted">Cấp 5 có thể mua Camera an ninh tại Siêu thị với 500.000₫, nâng cấp thêm 500.000₫ mỗi lần. Bật ở điều hành cửa hàng: cấp 1 đánh dấu tên trộm đỏ, cấp 2 cảnh báo tại Cửa hàng, cấp 3 tự đánh đuổi. Camera không tính phí nhân viên.</p>'+
    '<h3 class="guide-heading">Đấu thẻ và God-item</h3><p class="muted">Đấu trường cấp 40 có hai hạng Cực hiếm/Cực phẩm, thẻ có giá thị trường cao hơn thắng. Thách đấu Huyền thoại cấp 50 chỉ nhận thẻ đã thẩm định, điểm cao hơn thắng. Mỗi sự kiện tối đa 3 lượt/ngày: hai bên úp thẻ 5 giây rồi lật, thắng nhận thẻ đối phương, hòa trả lại thẻ; thẻ khóa và God-item không thể cược.</p><p class="muted">Mỗi BST có thêm 3 God-item bí ẩn ngoài 36 thẻ thường, xem trước dạng ?? tại BST. Túi cao cấp từ GOD-BOX có thể cho God-item; túi thường có 0,02%, túi cao cấp của GOD-BOX mặc định 3% (Admin chỉnh được), Hoàng kim và Kim cương có 2% mỗi túi. God-item chỉ sưu tầm và thẩm định.</p>'+
    '<h3 class="guide-heading">Các chế độ tự động</h3><p class="muted">Trong Cửa hàng, bật/tắt từng checkbox: Tự động thanh toán, Tự bổ sung túi mù, Tự bổ sung thẻ item và Tự livestream. Nút ⚙️ mở tùy chỉnh; cài đặt livestream chỉ dành cho người có Thẻ bài Admin. Mỗi chế độ dùng trong ngày tính riêng phí nhân viên theo doanh thu khi kết ngày: mặc định 1%, tăng 1 điểm % mỗi 10 cấp (LV10: 2%, LV20: 3%…). Admin có thể chỉnh phí cơ bản. Thiếu tiền sẽ gán nợ bằng thẻ như ngân hàng.</p><p class="muted">Tự bổ sung túi dùng hàng trong kho trước, rồi mới nhập box trong giới hạn ngân sách (mặc định 20% tiền đầu mỗi lượt). Thẻ chỉ tự bán ở các bậc đã cho phép; thẻ khóa luôn được giữ. Chỉ tắt livestream khi không còn khách đang đến, chờ mở, mở túi hoặc phản ứng.</p>'+
    '<h3 class="guide-heading">Sự kiện, cộng đồng và BST</h3><p class="muted">Người chơi có thể tham gia Giao dịch đen, Chợ đen, Đấu giá và Đu đỉnh khi đạt cấp yêu cầu và trong giờ cửa hàng hoạt động; một số sự kiện có khung giờ riêng. Chợ đen có 3 lượt/ngày (10:00, 12:40, 15:20), mỗi lượt 3–5 thẻ khác nhau; mỗi thẻ được săn 1 lần, có thể mua tất cả hoặc chờ lượt sau. Cộng đồng có Ngân hàng và Thẩm định, không bị ràng buộc bởi giờ mở cửa.</p><p class="muted">Xé túi của mình để nhận thẻ, XP và ghi nhận vào Kho tồn → BST. Mỗi BST có 36 thẻ với 6 độ hiếm. Khám phá đủ các thẻ để hoàn thành BST; bán hay dùng thẻ đã khám phá không xóa ghi nhận. Một số BST cần đủ cấp và trả phí mở khóa. Có 10 thẻ giống nhau thì có thể nâng thành một thẻ ngẫu nhiên ở bậc hiếm cao hơn trong cùng BST (trừ Huyền thoại).</p><p class="muted">Mỗi BST còn có một Thẻ rác giá 0₫, tỉ lệ 0,05% từ túi mù thường, xem trước tại BST; thẻ này chỉ sưu tầm và không tính vào 36 thẻ chính.</p><p class="muted">Game tự lưu trên trình duyệt. Dùng Hệ thống → Sao lưu để giữ mã tiến trình khi cần chuyển thiết bị.</p><button class="btn primary block" data-a="closeM">Đã hiểu</button>');
}

function enterGame(){
  ui.screen='game';$('#title').hidden=true;$('#app').hidden=false;
  S.admin=!!S.adminCard;applyBase();COLS.forEach(c=>grantGodRewards(c.id));planVisitors();recordAutomation();resolveDuel();ui.feedI=0;
  ensureEvents();auSync();
  if(S.au&&S.au.list) S.au.list.forEach((a,i)=>{if(a.status==='joined'&&a.holder==='you')auResolve(i);});
  ui.sig=marketSig();last=performance.now();
  refresh();
  if(S.bankrupt){showGameOver();return;}
  if(S.closed&&S.lastSum) showSummary(S.lastSum);
}
function startNew(name){
  S=newState(name);S.admin=!!S.adminCard;startDay(1);
  S.day$.startWorth=netWorth();
  ui.tab='shop';ui.sub={market:'bm',shop:'home',kho:'stock',bag:'bags',char:'bag',sys:'sys',adm:'lv',bmx:'tr'};ui.bstCol=null;
  save();enterGame();
}

  trashInfo(d){showTrashInfo(+d.ci);},

  balancePublish(){showPublishBalance();},

  cameraToggle(){if(!S.camera.level)return;S.camera.on=!S.camera.on;cameraSweep();after();},

  duelConfigSave(){if(!S.adminCard)return;const conf={};for(const k of ['arena','legend']){const n=Number($('#duel-'+k).value);if(!Number.isFinite(n)||n<0||n>100){toast('Tỉ lệ từ 0–100%.','bad');return;}conf[k]=n;}S.duels.npcWin=conf;save();showAdminCard();},

});
document.addEventListener('input',e=>{
  if(S&&(e.target.id==='loan-amount'||e.target.id==='loan-days')){if(!ui.loan)ui.loan={amt:500000,days:5};const value=Number(e.target.value);if(e.target.id==='loan-amount')ui.loan.amt=Math.round(clamp(value,500000,5000000)/50000)*50000;else ui.loan.days=Math.round(clamp(value,5,20));$('#loan-quote').innerHTML=bankQuoteHTML();}
  if(e.target.id==='bag-list-ask'&&ui.bagListing){ui.bagListing.ask=e.target.value.trim()===''?null:Number(e.target.value);ui.bagListing.pct=null;document.querySelectorAll('[data-a="bagListPrice"]').forEach(el=>el.classList.remove('on'));}

  if(e.target.id==='admin-search'&&S&&S.adminCard){
    ui.adminSearch=e.target.value;
    const results=$('#admin-search-results');
    if(results)results.innerHTML=adminItemResults(ADMIN_ITEMS.filter(x=>adminSearchKey(x.name).includes(adminSearchKey(ui.adminSearch))));
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='balance-source'){prepareBalanceDownload(el.files&&el.files[0]);return;}
  if(el.dataset&&el.dataset.a==='icol'){ui.icol=+el.value;renderView();}
  if(el.dataset&&el.dataset.a==='askSet'){ui.askPct=Math.round(clamp(parseFloat(el.value)||0,-60,300));reAsk();}
});
$('#modal').addEventListener('click',e=>{
  if(e.target===$('#modal')&&!$('#modal').classList.contains('reveal')&&!$('#modal').classList.contains('locked')) A.closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden&&!$('#modal').classList.contains('locked')) A.closeM();
  if(e.key==='Enter'&&ui.screen==='title'&&$('#nm')) A.start();
});

/* ============ ĐỒNG HỒ GAME ============ */
let last=performance.now();
function marketSig(){
  if(!S) return '';
  const bm=bmActive().map(o=>o.oid+':'+o.qty).join(',');
  const au=S.au&&S.au.list&&S.au.day===S.day?S.au.list.map(a=>a.status).join(','):'-';
  return (S.clock>=CFG.BM_OPEN?1:0)+'|'+(S.clock>=CFG.BM_CLOSE?1:0)+'|'+bm+'|'+au+'|'+(isOver()?1:0)+'|'+(S.trade&&S.trade.day===S.day?S.trade.idx+':'+tradeOpenN():'-');
}
function checkTimeEvents(){
  const before=ui.sig.split('|');
  auSync();
  const sig=marketSig();
  if(sig!==ui.sig){
    const p=sig.split('|');
    const ids=s=>(s||'').split(',').filter(Boolean).map(x=>x.split(':')[0]);
    const oldIds=ids(before[2]);
    if(ids(p[2]).some(x=>!oldIds.includes(x))) toast('🕶️ Chợ đen vừa có hàng mới!');
    const oa=(before[3]||'').split(','),na=(p[3]||'').split(',');
    if(na.some((s,i)=>s==='open'&&oa[i]==='wait')) toast('🔨 Có phiên đấu giá mới!');
    if(p[5]&&p[5]!=='-'){const a6=p[5].split(':'),b6=(before[5]||'').split(':');if(a6[0]!==b6[0]&&+a6[1]>0) toast('🤝 Có NPC đang chờ giao dịch với bạn!');}
    ui.sig=sig;renderNav();
    if((ui.tab==='market'||ui.tab==='community')&&$('#modal').hidden) renderView();
  }
  if(isOver()&&!S.overNote){S.overNote=true;renderTop();}
}
function tick(){
  const now=performance.now();let dt=(now-last)/1000;last=now;
  if(ui.screen==='game'&&S&&S.dd){
    const t=Date.now(),due=Math.min(DD_STEPS,Math.floor((t-S.dd.start)/250));
    while(S.dd.steps<due) ddStep();
    if(t>=S.dd.deadline||S.dd.steps>=DD_STEPS){
      ddResolve();save();refresh();
      const r=S.ddLast,it=ITEMS[r.id];
      toast(r.up?'📈 Thắng! +'+fmt(r.val)+' ₫':r.down?'📉 Thua, mất '+it.n:'Hòa, giữ lại item',r.up?'good':r.down?'bad':'');
      if($('#modal').hidden) sheet('<h2>'+(r.up?'📈 Giá tăng — bạn thắng!':r.down?'📉 Giá giảm — bạn thua':'Giá đi ngang — hòa')+'</h2><div class="hero-item r'+it.r+'" style="margin-top:8px"><div class="big">'+it.e+'</div><div><h2 style="font-size:19px">'+it.n+'</h2><div class="muted">'+fmt(r.p0)+' ₫ → '+fmt(r.end)+' ₫</div></div></div><p style="margin:0"><b>'+(r.up?'Nhận thưởng +'+fmt(r.val)+' ₫ và giữ lại item.':r.down?'Bạn đã mất item này.':'Bạn giữ lại item, không có thưởng.')+'</b></p><button class="btn primary block" style="margin-top:12px" data-a="closeM">Xong</button>');
    }else if(ui.tab==='market'&&ui.sub.market==='dd') updateDD();
  }
  if(ui.screen==='game'&&S){
    const result=resolveDuel();if(result){renderTop();if(ui.tab==='market')renderView();}
    document.querySelectorAll('[data-duel-countdown]').forEach(el=>{el.textContent=S.duels.active?Math.max(0,Math.ceil((S.duels.active.deadline-Date.now())/1000)):0;});
  }
  if(ui.screen!=='game'||!S||document.hidden) return;
  dt=Math.min(dt,1);
  recordAutomation();
  autoRestock();
  tickCustomers(dt);
  if(isStoreOpen()){
    const oldH=Math.floor(S.clock/60);
    S.clock=Math.min(CFG.DAY_END,S.clock+dt*gameSpeed());
    if(Math.floor(S.clock/60)!==oldH){fmHour();renderTop();renderNav();if($('#modal').hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT')&&(ui.tab==='shop'||ui.tab==='supply'||ui.tab==='kho'||ui.tab==='char'))renderView();}
    ui.dirty=true;
  }
  const ck=$('#ck');if(ck) ck.textContent=fmtClock();
  document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=fmtDur(+el.dataset.cd-S.clock);});
  checkTimeEvents();
  if(ui.dirty&&Date.now()-ui.lastSave>5000){ui.lastSave=Date.now();save();}
}
setInterval(tick,250);
let lpTimer=null,lpPos=null;
document.addEventListener('pointerdown',e=>{
  ui.suppress=false;
  const t=e.target.closest&&e.target.closest('.tile[data-inv]');
  if(!t||ui.tab!=='char'||ui.sub.char!=='bag'||ui.selMode) return;
  lpPos={x:e.clientX,y:e.clientY};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{
    lpTimer=null;ui.suppress=true;
    if(isLocked(+t.dataset.id)){lockedPrompt(+t.dataset.id,'bán');return;}
    ui.selMode=true;ui.sel={};ui.sel[+t.dataset.id]=1;
    try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
    renderView();
  },450);
});
document.addEventListener('pointermove',e=>{if(lpTimer&&lpPos&&Math.hypot(e.clientX-lpPos.x,e.clientY-lpPos.y)>10){clearTimeout(lpTimer);lpTimer=null;}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(lpTimer);lpTimer=null;if(ui.suppress)setTimeout(()=>{ui.suppress=false;},350);}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tile[data-inv]'))e.preventDefault();});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&S)save();});
window.addEventListener('pagehide',()=>{if(S&&ui.screen==='game')save();});

/* ============ KHỞI ĐỘNG ============ */
loadSettings();
renderTitle();
})();
</script>
