<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blink Box (Ver 3.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceffd; --surface:#ffffff; --surface2:#f2f3fd; --ink:#1b1940; --ink2:#5d5c85; --line:#dbdff4;
  --accent:#ff3d86; --accent-ink:#ffffff; --gold:#ffb800; --teal:#0fb5a3; --bad:#d93a40; --good:#14954f;
  --shadow:0 6px 22px rgba(40,30,110,.10); --overlay:rgba(18,12,48,.62);
  --r0:#8b90a8; --r1:#2fae67; --r2:#3a86ff; --r3:#9a5cff; --r4:#ff8420; --r5:#ffb800;
  --fd:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
    --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
    --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
    --r0:#9aa0bd; --r1:#43c47c; --r2:#5b9bff; --r3:#b087ff; --r4:#ff9a45; --r5:#ffc83a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
  --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
  --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
  --r0:#9aa0bd; --r1:#43c47c; --r2:#5b9bff; --r3:#b087ff; --r4:#ff9a45; --r5:#ffc83a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-family:var(--fd);line-height:1.15}
small{color:var(--ink2)}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.app[hidden],.title[hidden],.modal[hidden]{display:none}

/* header */
#top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px 10px;box-shadow:var(--shadow);z-index:5}
.top-r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-family:var(--fd);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.who{text-align:left;border-radius:14px;padding:2px 8px 2px 2px}
button.who:active{background:var(--surface2)}
.bdg{font-size:18px;line-height:1}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:16px;flex:none}
.clock{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-family:var(--fd);font-weight:700}
.clock .ck-d{font-size:13px;color:var(--ink2);font-weight:600}
.clock #ck{font-size:18px;font-variant-numeric:tabular-nums}
.clock.over{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.clock.over .ck-d{color:inherit}
.top-r2{display:flex;align-items:center;gap:12px;margin-top:8px}
.lv{flex:1;min-width:0}
.lv-n{font-family:var(--fd);font-weight:700;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:99px;transition:width .5s ease}
.luck{font-size:15px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.luck .off{color:var(--line)}
.cash{font-family:var(--fd);font-weight:800;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cash small{font-size:13px;margin-left:2px}
.banner{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid var(--accent);border-radius:12px;padding:8px 10px;font-size:13px}
.banner button{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-weight:700;white-space:nowrap}

/* main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.seg{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ev{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:evp 1.6s infinite}
@keyframes evp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
#nav button{position:relative}
.menu{display:flex;gap:8px;margin-bottom:10px}
.menu button{flex:1;padding:10px 8px;border-radius:14px;font-family:var(--fd);font-weight:700;font-size:16px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);transition:background .2s,color .2s}
.menu button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.score{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;color:var(--gold)}
#nav .ev{position:absolute;top:4px;left:calc(50% + 8px);margin:0}
.seg button .lk{font-size:11px;margin-left:3px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:8px}
.muted{color:var(--ink2);font-size:13px}
.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty b{display:block;font-family:var(--fd);font-size:18px;color:var(--ink);margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp{height:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;transition:transform .12s,background .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.block{display:flex;width:100%}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select.sel{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
input.txt{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.txt{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;width:100%;height:140px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}

/* bags */
.bag{position:relative;display:inline-block;width:var(--sz);height:calc(var(--sz)*1.2);flex:none}
.bag svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(30,20,90,.22))}
.bag-e{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);text-align:center;font-size:calc(var(--sz)*.34);line-height:1}
.bagcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .15s;position:relative;text-align:center}
.bagcard:active{transform:scale(.97)}
.bc-n{font-family:var(--fd);font-weight:700;font-size:15px;margin-top:4px;line-height:1.1}
.bc-p{font-weight:700;color:var(--accent);font-size:13.5px}
.bc-q{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.bagcard.lock{opacity:.55;filter:grayscale(.6);cursor:default}
.bagrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.bagrow .bi{flex:1;min-width:0}
.bagrow b{font-family:var(--fd);font-size:17px;display:block}
.qty{font-family:var(--fd);font-weight:800;font-size:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 11%,var(--surface));text-align:center;min-height:92px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.t-e{font-size:30px;line-height:1.1}
.t-n{font-size:11.5px;font-weight:600;line-height:1.2;word-break:break-word}
.t-q{position:absolute;top:4px;right:5px;font-size:11px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:99px;padding:0 6px}
.tile.unk{border-style:dashed;background:var(--surface2)}
.tile[data-inv]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.t-d{font-size:11.5px;font-weight:800;margin-top:auto;padding-top:2px;font-variant-numeric:tabular-nums}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.rin{width:92px;font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right}
.ibtns{display:flex;gap:8px;margin-left:auto;flex:none}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-color:var(--gold)}
.adq{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.adq button{padding:2px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.t-lk{position:absolute;top:4px;left:5px;font-size:13px;line-height:1}
.tile.dim .t-lk{opacity:1}
.t-ck{position:absolute;top:4px;left:5px;background:var(--accent);color:var(--accent-ink);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.selbar{position:sticky;bottom:-12px;margin:14px -14px -20px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(30,20,90,.12);padding:10px 14px 12px;z-index:4}
.selbar .btnrow{margin-top:8px}
.selbar small{display:block}
.tree{width:170px;margin:0 auto 4px}.tree svg{width:100%;height:auto;display:block}
.spark{width:100%;height:96px;display:block;margin:8px 0}
.npc{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.npc .face{width:54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:30px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pair h4{font-size:13px;color:var(--ink2);margin-bottom:6px}
.tile.static{min-height:104px}
.tile.unk .t-e{filter:grayscale(1);opacity:.45}
.tile.dim{opacity:.55}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.rtag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--rc);color:#fff;font-size:12px;font-weight:700}
.r5 .rtag,.rtag.r5{color:#3b2a00}
.rh{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:15px;color:var(--rc)}
.rh small{font-weight:500}
.col-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.col-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--surface2);flex:none}
.col-card .bar{margin-top:6px}
.col-card.lock{opacity:.55}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.delta{font-weight:700;font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}

/* sheets / modal */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet .x{position:absolute}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.rate span:first-child{width:76px;color:var(--rc);font-weight:700}
.rate .bar{flex:1;margin:0;height:6px}
.rate .bar i{background:var(--rc)}
.rate span:last-child{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.hero-item{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.hero-item .big{width:78px;height:78px;border-radius:20px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--surface));display:grid;place-items:center;font-size:42px;flex:none}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 14px}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease,tout .3s ease 2.3s forwards;max-width:92%;text-align:center}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}

/* nav */
#nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink2);font-size:11.5px;font-weight:600;transition:color .2s}
#nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#nav button.on{color:var(--accent)}
#nav button.on svg{transform:translateY(-2px) scale(1.08)}

/* reveal */
.reveal{align-items:center}
.rv{width:min(92vw,360px);margin:0 auto;text-align:center;position:relative}
.rv-stage{position:relative;height:300px;display:grid;place-items:center;cursor:pointer}
.rv-bag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.rv.shake .rv-bag{animation:shake .75s ease-in-out}
.rv.open .rv-bag{animation:bagout .35s ease-in forwards}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}15%{transform:translate(-54%,-50%) rotate(-8deg)}30%{transform:translate(-46%,-50%) rotate(8deg)}45%{transform:translate(-54%,-50%) rotate(-10deg)}60%{transform:translate(-46%,-50%) rotate(10deg)}80%{transform:translate(-50%,-50%) scale(1.12) rotate(0)}}
@keyframes bagout{to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.rv-card{width:230px;padding:18px 12px 16px;border-radius:24px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--surface));color:var(--ink);opacity:0;transform:rotateY(90deg) scale(.6);box-shadow:0 0 0 0 var(--rc)}
.rv.open .rv-card{animation:cardin .6s cubic-bezier(.2,.9,.3,1.25) forwards}
.rv.r5.open .rv-card{animation:cardin .6s cubic-bezier(.2,.9,.3,1.25) forwards,glow 1.6s ease-in-out .6s infinite}
@keyframes cardin{to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc) 55%,transparent)}50%{box-shadow:0 0 34px 8px color-mix(in srgb,var(--rc) 55%,transparent)}}
.rv-rar{display:inline-block;background:var(--rc);color:#fff;font-weight:800;font-size:13px;padding:2px 12px;border-radius:99px}
.rv.r5 .rv-rar{color:#3b2a00}
.rv-e{font-size:78px;line-height:1.15;margin:8px 0 2px}
.rv-n{font-family:var(--fd);font-size:22px;font-weight:700}
.rv-meta{font-size:13px;color:var(--ink2);margin-top:2px}
.rv-xp{font-weight:800;color:var(--teal);margin-top:6px}
.new{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:99px;font-size:11px}
.rv-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;opacity:0;pointer-events:none;transition:opacity .3s .35s}
.rv.open .rv-actions{opacity:1;pointer-events:auto}
.rv-hint{color:#fff;opacity:.8;font-size:13px;position:absolute;left:0;right:0;bottom:6px}
.rv.open .rv-hint{display:none}
.burst i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--rc);opacity:0}
.rv.open .burst i{animation:burst .95s ease-out .1s forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(30px)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
.rv .btn{width:100%}

/* title */
.title{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding:24px 18px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.title-in{width:100%;max-width:380px;text-align:center}
.title h1{font-size:54px;font-weight:800;letter-spacing:-.5px}
.title .sub{color:var(--ink2);margin:4px 0 22px}
.bags3{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-bottom:10px;height:136px}
.bags3 .bag{animation:bob 3.2s ease-in-out infinite}
.bags3 .bag:nth-child(2){animation-delay:-1.1s}.bags3 .bag:nth-child(3){animation-delay:-2.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.title .card{text-align:left}
.title .btn{margin-top:10px}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function pickW(w,off){let t=w.reduce((a,b)=>a+b,0),x=Math.random()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return i+off;}return w.length-1+off;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmtClock(m){m=Math.floor(m===undefined?S.clock:m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function fmtDur(m){m=Math.max(0,Math.ceil(m));return m>=60?Math.floor(m/60)+'g '+String(m%60).padStart(2,'0')+'p':m+'p';}
const xpNeed=L=>Math.round(30*Math.pow(L,1.35));
const bagPrice=ci=>Math.round(CFG.BAG_BASE*COLS[ci].mult/500)*500;

function newState(name){
  const s={v:1,name,lvl:1,xp:0,lp:20.3,forced:0,money:CFG.START_MONEY,day:1,clock:CFG.DAY_START,
    bags:{},inv:{},disc:{},market:{},pity:0,stats:{got:[0,0,0,0,0,0],bags:0,peak:CFG.START_MONEY},
    day$:null,bm:null,au:null,blind:null,trade:null,dd:null,ddCount:0,ddLast:null,cert:[],appr:[],uid:1,locked:{},rate:0.01,rateHist:[],ddWin:50,adRates:null,loans:[],tree:{pts:0,n:0},bankrupt:false,badges:{},showBadge:null,closed:false,log:[],lastSum:null,admin:false,overNote:false,savedAt:0};
  for(const it of ITEMS) s.market[it.id]=0.8+Math.random()*0.4;
  return s;
}
function migrate(o){
  const d=newState(o.name||'Người chơi');
  const s=Object.assign(d,o);
  s.stats=Object.assign(d.stats,o.stats||{});
  if(!Array.isArray(s.stats.got)||s.stats.got.length<6) s.stats.got=[0,0,0,0,0,0];
  s.market=Object.assign(d.market,o.market||{});
  if(s.inv) for(const k in s.inv) if(!(s.inv[k]>0)) delete s.inv[k];
  if(!s.locked) s.locked={};
  if(s.rate==null) s.rate=0.01;
  if(!Array.isArray(s.rateHist)||!s.rateHist.length) s.rateHist=[{day:s.day||1,rate:s.rate}];
  if(s.au&&!s.au.list) s.au=null;
  if(s.blind&&!s.blind.offers) s.blind=null;
  if(s.au&&s.au.list) s.au.list.forEach(a=>{a.busy=false;});
  if(!s.day$) s.day$={startWorth:s.money,spent:0,earned:0,bags:0,bestR:-1,bestId:null};
  return s;
}

/* ============ LOGIC GAME ============ */
const price=id=>Math.round(ITEMS[id].base*S.market[id]/10)*10;
const pct=id=>(S.market[id]-1)*100;
const sellNet=(id,n)=>Math.round(price(id)*n*(1-CFG.SELL_FEE));
const baseLP=()=>20+0.3*S.lvl;
const starsFromLP=lp=>lp<20?1:lp<40?2:lp<60?3:lp<80?4:5;
const stars=()=>S.forced||starsFromLP(S.lp);
const isLocked=id=>!!(S.locked&&S.locked[id]);
const LOCK_MSG='Item đang bị khoá. Hãy mở khoá trong Kho trước.';
const unlocked=ci=>S.lvl>=COLS[ci].unlock;
const unlockedCols=()=>COLS.filter(c=>unlocked(c.id)).map(c=>c.id);
const isOver=()=>S.clock>=CFG.DAY_END;

const debtTotal=()=>(S.loans||[]).reduce((s,l)=>s+l.remaining,0);
function netWorth(){
  let w=S.money-debtTotal();
  for(const k in S.inv) w+=S.inv[k]*price(+k);
  (S.cert||[]).forEach(c=>{w+=certPrice(c);});
  (S.appr||[]).forEach(a=>{w+=price(a.id);});
  for(const k in S.bags) w+=S.bags[k]*bagPrice(+k);
  return w;
}
function logTx(text,delta){
  S.log.unshift({t:'Ngày '+S.day+' · '+fmtClock(),x:text,d:delta});
  if(S.log.length>30) S.log.length=30;
}
function giveItem(id){
  const isNew=!S.disc[id];
  S.disc[id]=1; S.inv[id]=(S.inv[id]||0)+1;
  S.stats.got[ITEMS[id].r]++;
  return isNew;
}
function addXp(n){
  if(S.lvl>=CFG.MAX_LV) return 0;
  const old=S.lvl; S.xp+=n;
  while(S.lvl<CFG.MAX_LV && S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;}
  if(S.lvl>=CFG.MAX_LV) S.xp=0;
  const g=S.lvl-old;
  if(g>0){S.lp=Math.min(100,S.lp+0.3*g);onLevelUp(old,S.lvl);}
  return g;
}
function onLevelUp(a,b){
  toast('🎉 Lên cấp '+b+'!','good');
  COLS.forEach(c=>{if(c.unlock>a&&c.unlock<=b&&c.unlock>1)setTimeout(()=>toast('🔓 Mở khóa bộ '+c.name),500);});
  if(a<CFG.BM_LV&&b>=CFG.BM_LV){setTimeout(()=>toast('🕶️ Mở khóa Chợ đen'),900);ensureEvents();}
  if(a<CFG.AU_LV&&b>=CFG.AU_LV){setTimeout(()=>toast('🔨 Mở khóa Đấu giá'),1300);ensureEvents();}
  [[CFG.BLIND_LV,'🎁 Mở khóa Đấu giá mù'],[CFG.TRADE_LV,'🤝 Mở khóa Giao dịch'],[CFG.DD_LV,'📈 Mở khóa Đu đỉnh']].forEach(([lv,m],i)=>{
    if(a<lv&&b>=lv){setTimeout(()=>toast(m),1700+i*400);ensureEvents();}
  });
}
function rollRarity(){
  const w=rates(stars()).slice();
  if(S.pity>=CFG.PITY-1){w[0]=0;w[1]=0;}
  return pickW(w,0);
}
function openBag(ci){
  if(!(S.bags[ci]>0)) return null;
  S.bags[ci]--; if(S.bags[ci]<=0) delete S.bags[ci];
  const r=rollRarity();
  const id=pick(COLS[ci].byR[r]);
  S.pity=r>=2?0:S.pity+1;
  const isNew=giveItem(id);
  S.stats.bags++;
  S.lp=clamp(S.lp+LPD[r],0,100);
  const xp=XPR[r]*CFG.XP_SCALE;
  addXp(xp);
  const d=S.day$; d.bags++; if(r>d.bestR){d.bestR=r;d.bestId=id;}
  return {id,r,isNew,xp};
}
function buyBags(ci,q){
  const cost=bagPrice(ci)*q;
  if(S.money<cost) return false;
  S.money-=cost; S.bags[ci]=(S.bags[ci]||0)+q; S.day$.spent+=cost;
  logTx('Mua '+q+'× túi '+COLS[ci].name,-cost);
  return true;
}
function sellItems(id,n){
  if(isLocked(id)) return 0;
  n=Math.min(n,S.inv[id]||0); if(n<=0) return 0;
  const net=sellNet(id,n);
  S.inv[id]-=n; if(S.inv[id]<=0) delete S.inv[id];
  S.money+=net; S.day$.earned+=net;
  const gain=net-Math.round(ITEMS[id].base*n);
  logTx('Bán '+n+'× '+ITEMS[id].n+(gain>=0?' (lời '+fmt(gain)+')':' (lỗ '+fmt(-gain)+')'),net);
  return net;
}
function upgradeItem(id){
  if(isLocked(id)) return null;
  const it=ITEMS[id];
  if(it.r>=5||(S.inv[id]||0)<CFG.UPGRADE_N) return null;
  S.inv[id]-=CFG.UPGRADE_N; if(S.inv[id]<=0) delete S.inv[id];
  const nid=pick(COLS[it.ci].byR[it.r+1]);
  const isNew=giveItem(nid);
  logTx('Nâng cấp '+CFG.UPGRADE_N+'× '+it.n+' → '+ITEMS[nid].n,0);
  return {id:nid,isNew};
}

function marketTick(strong){
  const vol=strong?CFG.MK_VOL_DAY:CFG.MK_VOL_HOUR,rev=strong?CFG.MK_REV_DAY:CFG.MK_REV_HOUR;
  for(const it of ITEMS){
    let f=S.market[it.id];
    f+=(Math.random()-0.5)*vol+(1-f)*rev;
    S.market[it.id]=clamp(f,CFG.MK_MIN,CFG.MK_MAX);

}

/* --- chợ đen --- */
function genBM(){
  const un=unlockedCols(),offers=[];
  for(let k=0;k<6;k++){
    const ci=pick(un),r=pickW([60,28,10,2],2),id=pick(COLS[ci].byR[r]);
    const disc=0.10+Math.random()*0.20;
    const appear=CFG.BM_OPEN+Math.floor(Math.random()*300);
    const end=Math.min(CFG.BM_CLOSE,appear+90+Math.floor(Math.random()*150));
    offers.push({oid:S.day*100+k,id,price:Math.round(price(id)*(1-disc)/10)*10,qty:r>=5?1:1+Math.floor(Math.random()*3),appear,end});
  }
  offers.sort((a,b)=>a.appear-b.appear);
  S.bm={day:S.day,offers};
}
const bmActive=()=>S.bm&&S.bm.day===S.day&&S.lvl>=CFG.BM_LV&&S.clock>=CFG.BM_OPEN&&S.clock<CFG.BM_CLOSE?S.bm.offers.filter(o=>o.qty>0&&S.clock>=o.appear&&S.clock<o.end):[];
function bmBuy(oid){
  const o=S.bm.offers.find(x=>x.oid===oid);
  if(!o||o.qty<=0||S.clock<o.appear||S.clock>=o.end||S.clock>=CFG.BM_CLOSE) return {err:'Món này đã hết hạn hoặc hết hàng.'};
  if(S.money<o.price) return {err:'Không đủ tiền.'};
  S.money-=o.price; S.day$.spent+=o.price; o.qty--;
  const isNew=giveItem(o.id);
  logTx('Săn chợ đen: '+ITEMS[o.id].n,-o.price);
  return {id:o.id,isNew};
}

/* --- đấu giá --- */
const BOTS=[
  {n:'Cò Nhát',t:'Nhát gan, hay bỏ cuộc sớm',p:.35,agg:.1,lo:.85,hi:1.05},
  {n:'Cân Nhắc',t:'Tính toán, ra giá vừa phải',p:.55,agg:.25,lo:1.0,hi:1.25},
  {n:'Hung Hăng',t:'Liều lĩnh, hay đẩy giá mạnh',p:.75,agg:.5,lo:1.2,hi:1.6}
];
/* 3 gói giá của đấu giá mù: w = tỉ lệ rơi hiếm / cực hiếm / cực phẩm / huyền thoại */
const BLIND=[
  {n:'Gói Bạc',e:'🥈',w:[70,25,5,0],hint:'Chủ yếu là hiếm, đôi khi cực hiếm'},
  {n:'Gói Vàng',e:'🥇',w:[25,45,25,5],hint:'Cực hiếm là chính, có cơ hội cực phẩm'},
  {n:'Gói Kim cương',e:'💎',w:[0,30,45,25],hint:'Từ cực hiếm đến huyền thoại'}
];
function genAuctions(){
  const un=unlockedCols(),times=[];
  while(times.length<3){const t=540+Math.floor(Math.random()*480);if(times.every(x=>Math.abs(x-t)>=60))times.push(t);}
  times.sort((a,b)=>a-b);
  const list=times.map(appear=>{
    const ci=pick(un),r=pickW([50,30,15,5],2),id=pick(COLS[ci].byR[r]);
    const mk=price(id),start=Math.max(5000,Math.round(mk*(0.6+Math.random()*0.15)/500)*500);
    const step=Math.max(1000,Math.round(start*0.05/500)*500);
    const fee=Math.max(5000,Math.round((0.05*mk+100*S.lvl+0.002*S.money)/500)*500);
    return {id,status:'wait',start,step,cur:start,holder:null,lastJump:1,fee,appear,busy:false,log:[],
      bots:BOTS.map(b=>({n:b.n,p:b.p,agg:b.agg,max:Math.round(mk*(b.lo+Math.random()*(b.hi-b.lo))/500)*500}))};
  });
  S.au={day:S.day,list};
}
function genBlind(){
  const ci=pick(unlockedCols());
  const offers=BLIND.map(t=>{
    const mean=t.w.reduce((s,v,i)=>s+v/100*BASEV[i+2],0);
    return {price:Math.round(mean*COLS[ci].mult*1.05*(0.95+Math.random()*0.1)/500)*500};
  });
  S.blind={day:S.day,status:'wait',appear:600+Math.floor(Math.random()*420),ci,offers,res:null};
}
function ensureEvents(){
  if(S.lvl>=CFG.BM_LV&&(!S.bm||S.bm.day!==S.day)) genBM();
  if(S.lvl>=CFG.AU_LV&&(!S.au||!S.au.list||S.au.day!==S.day)) genAuctions();
  if(S.lvl>=CFG.BLIND_LV&&(!S.blind||S.blind.day!==S.day)) genBlind();
  if(S.lvl>=CFG.TRADE_LV&&(!S.trade||S.trade.day!==S.day)) genTrade();
}
function auSync(){
  if(S.au&&S.au.list&&S.au.day===S.day) S.au.list.forEach(a=>{
    if(a.status==='wait'&&S.clock>=a.appear) a.status='open';
    if(a.status==='open'&&isOver()) a.status='missed';
  });
  const b=S.blind;
  if(b&&b.day===S.day){
    if(b.status==='wait'&&S.clock>=b.appear) b.status='open';
    if(b.status==='open'&&isOver()) b.status='missed';
  }
  tradeSync();
}
const AU=i=>S.au&&S.au.list&&S.au.day===S.day?S.au.list[i]:null;
function auNext(a){return a.holder===null?a.start:a.cur+a.step;}
function auJoin(i){
  const a=AU(i);
  if(!a||a.status!=='open') return 'Phiên đấu giá chưa mở.';
  if(S.money<a.fee) return 'Không đủ tiền đóng phí tham gia.';
  S.money-=a.fee; S.day$.spent+=a.fee; a.status='joined';
  logTx('Phí tham gia đấu giá',-a.fee);
  return '';
}
function auBid(i,j){
  const a=AU(i); if(!a||a.status!=='joined'||a.busy) return 'Không thể ra giá lúc này.';
  const amt=auNext(a)+a.step*(j-1);
  if(S.money<amt) return 'Không đủ tiền để ra mức giá này.';
  a.cur=amt;a.holder='you';a.lastJump=j;
  a.log.unshift('Bạn ra giá '+fmt(amt)+' ₫');
  a.busy=true;
  return '';
}
function auResolve(i){
  const a=AU(i); if(!a) return;
  a.busy=false;
  if(a.status!=='joined'||a.holder!=='you') return;
  const pen=Math.pow(0.75,a.lastJump-1);
  for(const bi of shuffle([0,1,2])){
    const b=a.bots[bi],bid=a.cur+a.step*(Math.random()<b.agg?2:1);
    if(bid<=b.max&&Math.random()<b.p*pen){
      a.cur=bid;a.holder=bi;a.log.unshift(b.n+' ra giá '+fmt(bid)+' ₫');
      return {counter:b.n};
    }
  }
  S.money-=a.cur; S.day$.spent+=a.cur; a.status='won';
  const isNew=giveItem(a.id);
  logTx('Thắng đấu giá: '+ITEMS[a.id].n,-a.cur);
  a.log.unshift('Không ai theo giá — bạn thắng!');
  return {won:true,id:a.id,isNew};
}
function auLeave(i){
  const a=AU(i); if(!a||a.status!=='joined') return;
  a.status='lost'; a.log.unshift('Bạn bỏ cuộc. Phí tham gia không được hoàn lại.');
}
function blindBuy(t){
  const b=S.blind;
  if(!b||b.day!==S.day||b.status!=='open'||isOver()) return {err:'Phiên đấu giá mù chưa mở.'};
  const o=b.offers[t];
  if(S.money<o.price) return {err:'Không đủ tiền.'};
  const r=pickW(BLIND[t].w,2),id=pick(COLS[b.ci].byR[r]);
  S.money-=o.price; S.day$.spent+=o.price;
  const isNew=giveItem(id),val=price(id);
  b.status='done'; b.res={id,t,paid:o.price,val};
  logTx('Đấu giá mù ('+BLIND[t].n+'): '+ITEMS[id].n+' (giá trị '+fmt(val)+')',-o.price);
  return {id,isNew,pl:val-o.price};
}


/* --- giao dịch NPC (cấp 40) --- */
const NPCS=[{n:'Bà Tám đồ cũ',e:'👵'},{n:'Anh Ba nhà giàu',e:'🧑‍💼'},{n:'Cô Hai sưu tầm',e:'👩‍🎨'},{n:'Chú Tư thợ săn',e:'🧔'},{n:'Thầy Bảy đồ cổ',e:'👴'},{n:'Bé Na thích đổi',e:'👧'},{n:'Cậu Chín lái buôn',e:'🧑‍🌾'}];
function genTrade(){
  S.trade={day:S.day,slots:[540+Math.floor(Math.random()*180),720+Math.floor(Math.random()*240),960+Math.floor(Math.random()*240)],idx:-1,cur:null};
}
function genOffer(k){
  const owned=Object.keys(S.inv).map(Number).filter(id=>ITEMS[id].r>=2&&S.inv[id]>0&&!isLocked(id));
  const un=unlockedCols();
  let want=null,r;
  if(owned.length){want=pick(owned);r=ITEMS[want].r;}else r=pickW([60,28,10,2],2);
  let give,tries=0;
  do{give=pick(COLS[pick(un)].byR[r]);tries++;}while(give===want&&tries<10);
  if(want===null) want=pick(COLS[pick(un)].byR[r]);
  return {k,npc:pick(NPCS),give,want,status:'open'};
}
function tradeSync(){
  const t=S.trade; if(!t||t.day!==S.day) return;
  let moved=false;
  while(t.idx<2&&S.clock>=t.slots[t.idx+1]){t.idx++;moved=true;}
  if(moved) t.cur=genOffer(t.idx);
  if(t.cur&&t.cur.status==='open'&&isOver()) t.cur.status='expired';
}
function acceptTrade(){
  const o=S.trade&&S.trade.cur;
  if(!o||o.status!=='open') return {err:'Lượt đổi này đã kết thúc.'};
  if(!(S.inv[o.want]>0)) return {err:'Bạn không còn item này.'};
  if(isLocked(o.want)) return {err:LOCK_MSG};
  S.inv[o.want]--; if(S.inv[o.want]<=0) delete S.inv[o.want];
  const isNew=giveItem(o.give),pl=price(o.give)-price(o.want);
  o.status='done';
  logTx('Đổi '+ITEMS[o.want].n+' lấy '+ITEMS[o.give].n+' ('+(pl>=0?'lãi ':'lỗ ')+fmt(Math.abs(pl))+')',0);
  return {id:o.give,isNew,pl};
}

/* --- đu đỉnh (cấp 50): cược item cực hiếm trở lên, giá 6 giây tới tăng hay giảm --- */
const DD_STEPS=24,DD_MS=6000,DD_MAX=5;
function ddStart(id){
  if(S.dd||!(S.inv[id]>0)||ITEMS[id].r<2) return 'Không thể cược item này.';
  if(isLocked(id)) return LOCK_MSG;
  if((S.ddCount||0)>=DD_MAX) return 'Hôm nay bạn đã đu đỉnh đủ '+DD_MAX+' lần.';
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const p0=price(id);
  S.ddCount=(S.ddCount||0)+1;
  const win=Math.random()*100<(S.ddWin==null?50:S.ddWin);
  S.dd={id,p0,p:[p0],path:ddPath(p0,win),win,steps:0,start:Date.now(),deadline:Date.now()+DD_MS};
  S.ddLast=null;
  return '';
}
function ddPath(p0,win){
  const N=DD_STEPS,lw=[0];let w=0;
  for(let i=1;i<=N;i++){w+=(Math.random()-0.5)*0.014;lw.push(w);}
  const target=(win?1:-1)*(0.002+Math.random()*0.01);
  return lw.map((v,i)=>Math.max(10,p0*Math.exp(v+(target-lw[N])*(i/N))));
}
function ddStep(){
  const d=S.dd,cur=d.p[d.p.length-1];
  d.p.push(d.path&&d.path[d.p.length]!==undefined?d.path[d.p.length]:Math.max(10,cur*(1+(Math.random()-0.5)*0.014)));d.steps++;
}
function ddResolve(){
  const d=S.dd; while(d.steps<DD_STEPS) ddStep();
  const end=d.p[d.p.length-1],val=Math.round(d.p0/10)*10,up=end>d.p0,down=end<d.p0;
  if(!down) S.inv[d.id]=(S.inv[d.id]||0)+1;
  if(up){S.money+=val;S.day$.earned+=val;logTx('Đu đỉnh thắng: '+ITEMS[d.id].n,val);}
  else if(down) logTx('Đu đỉnh thua: mất '+ITEMS[d.id].n+' (giá trị '+fmt(val)+')',0);
  else logTx('Đu đỉnh hòa: giữ lại '+ITEMS[d.id].n,0);
  S.ddLast={id:d.id,val,up,down,p0:d.p0,end};
  S.dd=null;
}

/* --- ngân hàng (từ ngày 5) --- */
const LOANS=[{amt:500000,days:7},{amt:1000000,days:15}];
function rollRate(first){
  const prev=S.rate||0.01;
  let r=first?0.008+Math.random()*0.006:clamp(prev+(Math.random()-0.5)*0.009,0.005,0.02);
  r=Math.round(r*2000)/2000;
  S.rate=r;
  S.rateHist=(S.rateHist||[]).filter(x=>x.day!==S.day);
  S.rateHist.push({day:S.day,rate:r});
  while(S.rateHist.length>7) S.rateHist.shift();
}
const pp=r=>(r*100).toFixed(2).replace('.',',')+'%';
function loanCalc(t,rate){rate=rate==null?S.rate:rate;const total=Math.round(t.amt*(1+rate*t.days));return {total,daily:Math.ceil(total/t.days/100)*100};}
function takeLoan(k){
  if(S.day<CFG.BANK_DAY) return 'Ngân hàng chưa mở.';
  if(S.loans.some(l=>l.tier===k)) return 'Bạn đang có khoản vay này.';
  const t=LOANS[k],c=loanCalc(t);
  S.loans.push({tier:k,rate:S.rate,principal:t.amt,term:t.days,total:c.total,daily:c.daily,remaining:c.total,left:t.days});
  S.money+=t.amt;
  logTx('Vay ngân hàng '+fmt(t.amt)+' ₫ ('+t.days+' ngày, lãi '+pp(S.rate)+'/ngày)',t.amt);
  return '';
}
function repayLoan(k){
  const i=S.loans.findIndex(l=>l.tier===k); if(i<0) return 'Không có khoản vay.';
  const L=S.loans[i]; if(S.money<L.remaining) return 'Không đủ tiền để trả hết nợ.';
  S.money-=L.remaining; logTx('Trả hết nợ ngân hàng',-L.remaining); S.loans.splice(i,1);
  return '';
}
function collect(need){
  const out={seized:[],credit:0};
  const c=Math.min(S.money,need);S.money-=c;need-=c;
  if(need>0){
    const units=[];
    for(const k in S.inv) for(let i=0;i<S.inv[k];i++) units.push({t:'i',id:+k,v:price(+k),lk:isLocked(+k)});
    (S.cert||[]).forEach(x=>units.push({t:'c',uid:x.uid,id:x.id,v:certPrice(x),lk:false}));
    for(const lockedPass of [false,true]){
      const pool=units.filter(u=>u.lk===lockedPass);
      while(need>0&&pool.length){
        pool.sort((a,b)=>a.v-b.v);
        let idx=pool.findIndex(u=>u.v>=need); if(idx<0) idx=pool.length-1;
        const u=pool.splice(idx,1)[0];
        if(u.t==='i'){S.inv[u.id]--;if(S.inv[u.id]<=0)delete S.inv[u.id];}
        else S.cert=S.cert.filter(x=>x.uid!==u.uid);
        out.seized.push(u.id); need-=u.v;
        if(need<0){S.money+=-need;out.credit+=-need;need=0;}
      }
    }
  }
  out.short=need;
  return out;
}
function settleLoans(){
  const res={paid:0,seized:[]};
  if(!S.loans||!S.loans.length) return res;
  for(const L of S.loans.slice()){
    const pay=L.left<=1?L.remaining:Math.min(L.daily,L.remaining);
    const r=collect(pay);
    const applied=pay-r.short;
    L.remaining-=applied; L.left--; res.paid+=applied; res.seized.push(...r.seized);
    logTx('Trả nợ ngân hàng'+(r.seized.length?' (gán nợ '+r.seized.length+' item)':''),-applied);
    if(r.short>0){S.bankrupt=true;break;}
    if(L.remaining<=0||L.left<=0) S.loans.splice(S.loans.indexOf(L),1);
  }
  return res;
}

/* --- quyên góp (từ ngày 10) --- */
const TREE=[0,30,150,500],TREE_N=['Hạt giống','Mầm cây','Cây con','Cây trưởng thành'];
const DPTS=[1,2,5,10,25,50],DLP=[0.15,0.3,0.8,2,5,10];
const treeLv=()=>TREE.reduce((l,t,i)=>S.tree.pts>=t&&i>0?i:l,0);
function donate(id,q){
  q=Math.min(q,S.inv[id]||0); if(q<=0) return null;
  const r=ITEMS[id].r,old=treeLv();
  S.inv[id]-=q; if(S.inv[id]<=0) delete S.inv[id];
  S.tree.pts+=DPTS[r]*q; S.tree.n+=q;
  const lp=DLP[r]*q; S.lp=Math.min(100,S.lp+lp);
  logTx('Quyên góp '+q+'× '+ITEMS[id].n,0);
  return {lp,up:treeLv()>old};
}

/* --- thẩm định (từ ngày 16): chỉ số hoàn hảo x/10đ --- */
const AP_FEE=30000,AP_SLOTS=3,AP_W=[30,28,20,12,7,3];
const AP_BOOST=1.5;
const AP_M=[[1.05,1.25],[1.2,1.5],[1.5,1.9],[1.9,2.5],[2.5,3.5],[5,10]].map(r=>r.map(v=>Math.round(v*AP_BOOST*100)/100)); /* hệ số giá theo điểm 5..10, đã nhân AP_BOOST */
const certPrice=c=>Math.round(price(c.id)*c.mult/10)*10;
const apReady=a=>a.day<S.day;
const apUsed=()=>S.appr.filter(a=>a.day===S.day).length;
function apSubmit(id){
  if(S.day<CFG.APPRAISE_DAY) return 'Thẩm định chưa mở.';
  if(apUsed()>=AP_SLOTS) return 'Hôm nay đã hết slot thẩm định.';
  if(!(S.inv[id]>0)||ITEMS[id].r<3) return 'Item không hợp lệ.';
  if(isLocked(id)) return LOCK_MSG;
  if(S.money<AP_FEE) return 'Không đủ tiền phí thẩm định.';
  S.money-=AP_FEE; S.day$.spent+=AP_FEE;
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const score=pickW(AP_W,5),m=AP_M[score-5];
  S.appr.push({uid:S.uid++,id,day:S.day,score,boost:1,mult:Math.round((m[0]+Math.random()*(m[1]-m[0]))*100)/100});
  logTx('Gửi thẩm định '+ITEMS[id].n,-AP_FEE);
  return '';
}
function apCollect(uid,force){
  const i=S.appr.findIndex(a=>a.uid===uid);
  if(i<0||(!force&&!apReady(S.appr[i]))) return null;
  const a=S.appr.splice(i,1)[0];
  if(!a.boost) a.mult=Math.round(a.mult*AP_BOOST*100)/100;
  S.cert.push({uid:a.uid,id:a.id,score:a.score,mult:a.mult});
  logTx('Nhận kết quả thẩm định '+ITEMS[a.id].n+': '+a.score+'/10đ',0);
  return S.cert[S.cert.length-1];
}
function sellCert(uid){
  const i=S.cert.findIndex(c=>c.uid===uid);if(i<0)return 0;
  const c=S.cert.splice(i,1)[0],net=Math.round(certPrice(c)*(1-CFG.SELL_FEE));
  S.money+=net;S.day$.earned+=net;
  logTx('Bán item thẩm định '+ITEMS[c.id].n+' ('+c.score+'/10đ)',net);
  return net;
}

/* --- bán hàng loạt --- */
function sellBulk(L){
  let net=0,base=0,cnt=0;
  L=L.filter(x=>!isLocked(x.id));
  L.forEach(({id,n})=>{net+=sellNet(id,n);base+=ITEMS[id].base*n;cnt+=n;S.inv[id]-=n;if(S.inv[id]<=0)delete S.inv[id];});
  net=Math.round(net);S.money+=net;S.day$.earned+=net;
  const g=net-Math.round(base);
  logTx('Bán hàng loạt '+L.length+' loại ('+cnt+' item) · '+(g>=0?'lời ':'lỗ ')+fmt(Math.abs(g)),net);
  return {net,g};
}

/* --- ngày --- */
function startDay(n){
  const first=n===1;
  S.day=n;rollRate(first);S.clock=CFG.DAY_START;S.overNote=false;
  if(!first){S.lp+=(baseLP()-S.lp)*0.2;marketTick(true);}
  S.day$={startWorth:netWorth(),spent:0,earned:0,bags:0,bestR:-1,bestId:null};
  S.ddCount=0;S.bm=null;S.au=null;S.blind=null;S.trade=null;ensureEvents();
}
function endDay(){
  const d=S.day$;
  const loan=settleLoans();
  const sum={day:S.day,spent:d.spent,earned:d.earned,pl:netWorth()-d.startWorth,bags:d.bags,bestId:d.bestId,bestR:d.bestR,money:S.money,loan};
  if(S.au&&S.au.list) S.au.list.forEach(a=>{if(a.status==='joined')a.status='lost';});
  if(S.trade&&S.trade.cur&&S.trade.cur.status==='open') S.trade.cur.status='expired';
  S.lastSum=sum;
  S.clock=CFG.DAY_END;S.closed=true;S.overNote=true;
  return sum;
}
function startNextDay(){
  startDay(S.day+1);S.closed=false;
  if(S.day===CFG.BANK_DAY) setTimeout(()=>toast('🏦 Mở khóa Ngân hàng'),500);
  if(S.day===CFG.DONATE_DAY) setTimeout(()=>toast('🌱 Mở khóa Quyên góp'),500);
  if(S.day===CFG.APPRAISE_DAY) setTimeout(()=>toast('🔬 Mở khóa Thẩm định'),500);
  if(S.appr.some(apReady)) setTimeout(()=>toast('🔬 Có kết quả thẩm định đang chờ bạn!'),900);
}

function ddBox(){

  const base=(86-(d.p0-mn)/rg*80).toFixed(1),col=cur>=d.p0?'var(--good)':'var(--bad)';

function auCard(a,i){
  const it=ITEMS[a.id],mk=price(a.id);
  const item='<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+'</div><div class="muted">Giá thị trường: <b>'+fmt(mk)+' ₫</b></div></div></div>';
  const t='<h3>Phiên đấu giá '+(i+1)+'</h3>';
  if(a.status==='open') return '<div class="card">'+t+item+
    '<div class="kv"><span>Giá khởi điểm</span><b>'+fmt(a.start)+' ₫</b></div><div class="kv"><span>Bước nhảy</span><b>'+fmt(a.step)+' ₫</b></div><div class="kv"><span>Phí tham gia (theo cấp và tài sản)</span><b>'+fmt(a.fee)+' ₫</b></div>'+
    '<button class="btn primary block" style="margin-top:12px" data-a="auJoinAsk" data-i="'+i+'"'+(S.money<a.fee?' disabled':'')+'>Tham gia · '+fmt(a.fee)+' ₫</button></div>';
  if(a.status==='joined'){
    const holder=a.holder===null?'Chưa ai ra giá':a.holder==='you'?'Bạn đang dẫn đầu':a.bots[a.holder].n+' đang dẫn đầu';
    const n1=auNext(a),n3=n1+a.step*2;
    return '<div class="card">'+t+item+
     '<div class="kv"><span>Giá hiện tại</span><b>'+fmt(a.cur)+' ₫</b></div><div class="kv"><span>Tình hình</span><b>'+(a.busy?'<span class="spin"></span>Đối thủ đang cân nhắc…':holder)+'</b></div>'+
     '<div class="btnrow"><button class="btn primary" data-a="auBid" data-i="'+i+'" data-j="1"'+(a.busy||S.money<n1?' disabled':'')+'>Ra giá '+fmt(n1)+'</button><button class="btn" data-a="auBid" data-i="'+i+'" data-j="3"'+(a.busy||S.money<n3?' disabled':'')+'>Nhảy 3 bước '+fmt(n3)+'</button></div>'+
     '<button class="btn block" style="margin-top:8px" data-a="auLeaveAsk" data-i="'+i+'"'+(a.busy?' disabled':'')+'>Bỏ cuộc (mất phí '+fmt(a.fee)+' ₫)</button>'+
     (a.log.length?'<div style="margin-top:10px">'+a.log.slice(0,5).map(l=>'<div class="log"><span>'+l+'</span></div>').join('')+'</div>':'')+'</div>';
  }
  const msg=a.status==='won'?'Bạn đã thắng và nhận '+it.n+' với giá '+fmt(a.cur)+' ₫.':a.status==='lost'?'Bạn không giành được món này. Phí tham gia đã mất.':'Bạn đã bỏ lỡ phiên này.';
  return '<div class="card">'+t+item+'<p style="margin:0"><b>'+msg+'</b></p></div>';
}
function viewBlind(){
  const intro='<div class="card"><h3>Đấu giá mù</h3><p class="muted" style="margin:0">Mỗi ngày có một phiên với một item bí mật. Hệ thống đề xuất 3 mức giá, bạn chọn một để mua. Sau khi xác nhận, item hiện ra và lãi/lỗ được chốt ngay.</p></div>';
  if(S.lvl<CFG.BLIND_LV) return lockedCard('Đấu giá mù',CFG.BLIND_LV,'Mua item bí mật với 3 mức giá đề xuất.');
  const b=S.blind;
  if(!b||b.day!==S.day||b.status==='wait'){
    if(isOver()) return intro+'<div class="card empty"><b>Đấu giá mù đã ngưng</b>Hết giờ hoạt động hôm nay.</div>';
    return intro+'<div class="card empty"><b><span class="pulse"></span>Chưa có phiên đấu giá mù</b>Phiên sẽ xuất hiện ngẫu nhiên trong ngày.</div>';
  }
  if(b.status==='open') return intro+'<div class="card"><div class="hero-item r0"><div class="big">❓</div><div><h2>Item bí mật</h2><div class="muted">Chưa biết là gì, thuộc bộ nào</div></div></div>'+
    b.offers.map((o,k)=>'<button class="bagrow" data-a="blindAsk" data-t="'+k+'" style="margin-bottom:8px"'+(S.money<o.price?' disabled':'')+'><span style="font-size:30px">'+BLIND[k].e+'</span><span class="bi"><b>'+BLIND[k].n+'</b><small>'+BLIND[k].hint+'</small></span><span class="qty" style="font-size:17px">'+fmt(o.price)+' ₫</span></button>').join('')+'</div>';
  if(b.status==='done'){
    const r=b.res,it=ITEMS[r.id],pl=r.val-r.paid;
    return intro+'<div class="card"><div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+'</div></div></div>'+
     '<div class="kv"><span>'+BLIND[r.t].n+' · giá đã mua</span><b>'+fmt(r.paid)+' ₫</b></div><div class="kv"><span>Giá trị thị trường lúc mở</span><b>'+fmt(r.val)+' ₫</b></div><div class="kv"><span>Lãi/lỗ đã chốt</span><b class="'+(pl>=0?'up':'dn')+'">'+sgn(pl)+' ₫</b></div></div>';
  }
  return intro+'<div class="card empty"><b>Đã bỏ lỡ</b>Bạn không tham gia phiên đấu giá mù hôm nay.</div>';
}
function viewAU(){
  if(S.lvl<CFG.AU_LV) return lockedCard('Đấu giá',CFG.AU_LV,'Mỗi ngày có 3 phiên, đấu với 3 bot có tính cách riêng.')+viewBlind();
  const list=S.au&&S.au.list&&S.au.day===S.day?S.au.list:[];
  let h='<div class="card"><h3>Đấu giá</h3><p class="muted" style="margin:0">Mỗi ngày có 3 phiên xuất hiện ngẫu nhiên. Đóng phí để tham gia, ra giá để giành item. Bỏ cuộc hoặc thua thì mất phí. Bot đối thủ:</p>'+
    BOTS.map(b=>'<div class="kv"><span><b>'+b.n+'</b></span><span class="muted">'+b.t+'</span></div>').join('')+'</div>';
  const shown=list.map((a,i)=>({a,i})).filter(x=>x.a.status!=='wait');
  const waiting=list.filter(a=>a.status==='wait').length;
  h+=shown.map(x=>auCard(x.a,x.i)).join('');
  if(waiting&&!isOver()) h+='<div class="card empty"><b><span class="pulse"></span>Còn '+waiting+' phiên sắp xuất hiện</b>Các phiên mới sẽ xuất hiện ngẫu nhiên trong ngày.</div>';
  else if(!shown.length) h+='<div class="card empty"><b>Đấu giá đã ngưng</b>Hết giờ hoạt động hôm nay.</div>';
  return h+viewBlind();
}
function viewKho(){
  const head=seg('kho',[['item','Vật phẩm'],['bst','BST']]);
  return head+(ui.sub.kho==='bst'?viewBST():viewItems());
}
function viewBagTab(){
  if(ui.sub.bag==='shop') return '<button class="back" data-a="shopBack">‹ Quay lại túi</button>'+viewShop();
  const head=seg('bag',[['bags','Túi mù'],['log','Nhật ký']]);
  if(ui.sub.bag==='log') return head+viewLog();
  const buy='<button class="btn primary block" data-a="shopOpen" style="margin-bottom:12px">🛍️ Mua túi mù</button>';
  const ids=Object.keys(S.bags).map(Number).sort((a,b)=>a-b);
  if(!ids.length) return head+buy+'<div class="card empty"><b>Chưa có túi mù</b>Bấm Mua túi mù ở trên, rồi quay lại đây để xé.</div>';
  return head+buy+ids.map(ci=>{
    const c=COLS[ci];
    return '<button class="bagrow" data-a="bagOpen" data-c="'+ci+'">'+bagSVG(c.hue,c.icon,60)+'<span class="bi"><b>Túi '+c.name+'</b><small>Chạm để xem và xé túi</small></span><span class="qty">×'+S.bags[ci]+'</span></button>';
  }).join('');
}
function viewLog(){
  const d=S.day$,pl=netWorth()-d.startWorth,sm=S.lastSum;
  let h='<div class="card"><h3>Hôm nay · Ngày '+S.day+'</h3><div class="stat"><div><small>Chi ra</small><b>'+fmt(d.spent)+'</b></div><div><small>Thu về</small><b>'+fmt(d.earned)+'</b></div><div><small>Lời/lỗ ngày</small><b class="'+(pl>=0?'up':'dn')+'">'+sgn(pl)+'</b></div><div><small>Túi đã mở</small><b>'+d.bags+'</b></div></div>'+
   '<div class="kv" style="margin-top:8px"><span>Item hiếm nhất hôm nay</span><b>'+(d.bestId!==null?ITEMS[d.bestId].e+' '+ITEMS[d.bestId].n:'Chưa có')+'</b></div>'+
   '<button class="btn block" style="margin-top:8px" data-a="endDayAsk">Kết thúc ngày</button></div>';
  if(sm) h+='<div class="card"><h3>Tổng kết ngày '+sm.day+'</h3><div class="kv"><span>Chi ra</span><b>'+fmt(sm.spent)+' ₫</b></div><div class="kv"><span>Lời/lỗ</span><b class="'+(sm.pl>=0?'up':'dn')+'">'+sgn(sm.pl)+' ₫</b></div><div class="kv"><span>Số túi đã mở</span><b>'+sm.bags+'</b></div><div class="kv"><span>Item hiếm nhất</span><b>'+(sm.bestId!==null?ITEMS[sm.bestId].e+' '+ITEMS[sm.bestId].n:'Không có')+'</b></div></div>';
  h+='<div class="card"><h3>Nhật ký giao dịch</h3>'+(S.log.length?S.log.map(l=>'<div class="log"><span>'+esc(l.x)+'<small>'+l.t+'</small></span><b class="'+(l.d>0?'up':l.d<0?'dn':'')+'">'+(l.d?sgn(l.d):'—')+'</b></div>').join(''):'<p class="muted" style="margin:0">Chưa có giao dịch nào.</p>')+'</div>';
  return h;
}
function viewBST(){
  if(ui.bstCol!==null){
    const c=COLS[ui.bstCol];
    const have=c.byR.reduce((n,a)=>n+a.filter(id=>S.disc[id]).length,0);
    let h='<button class="back" data-a="bstBack">‹ Tất cả bộ sưu tập</button><div class="card"><div class="row"><div><h3 style="margin:0">'+c.icon+' '+c.name+'</h3><small>Đã sưu tầm '+have+'/36</small></div></div><div class="bar" style="margin-top:8px"><i style="width:'+(have/36*100)+'%"></i></div></div>';
    for(let r=5;r>=0;r--){
      const arr=c.byR[r],n=arr.filter(id=>S.disc[id]).length;
      h+='<h4 class="rh r'+r+'">'+RAR[r]+' <small>'+n+'/'+arr.length+'</small></h4><div class="tiles">'+arr.map(id=>tile(id)).join('')+'</div>';
    }
    return h;
  }
  return COLS.map(c=>{
    if(!unlocked(c.id)) return '<div class="col-card lock"><span class="col-ico">🔒</span><span style="flex:1"><b style="font-family:var(--fd);font-size:17px">'+c.name+'</b><br><small>Mở khóa ở cấp '+c.unlock+'</small></span></div>';
    const have=c.byR.reduce((n,a)=>n+a.filter(id=>S.disc[id]).length,0);
    return '<button class="col-card" data-a="bstOpen" data-c="'+c.id+'"><span class="col-ico">'+c.icon+'</span><span style="flex:1;min-width:0"><b style="font-family:var(--fd);font-size:17px">'+c.name+'</b><br><small>'+have+'/36 item</small><div class="bar"><i style="width:'+(have/36*100)+'%"></i></div></span></button>';
  }).join('');
}
function viewItems(){
  const owned=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&(ui.irar<0||ITEMS[id].r===ui.irar)&&(ui.icol<0||ITEMS[id].ci===ui.icol));
  const sorts=[['col','Theo bộ'],['hi','Hiếm → thường'],['lo','Thường → hiếm']];
  const nb=Object.values(S.bags).reduce((s,n)=>s+n,0);
  let h='<button class="btn primary block" data-a="nav" data-k="bag" data-sub="bags" style="margin-bottom:12px">Xé thêm túi mù · '+nb+' túi chưa mở</button><div class="chips" style="margin-bottom:8px">'+sorts.map(([k,t])=>'<button class="chip'+(ui.isort===k?' on':'')+'" data-a="isort" data-v="'+k+'">'+t+'</button>').join('')+'</div>'+
   '<div class="chips" style="margin-bottom:8px"><button class="chip'+(ui.irar<0?' on':'')+'" data-a="irar" data-v="-1">Tất cả</button>'+RAR.map((t,r)=>'<button class="chip'+(ui.irar===r?' on':'')+'" data-a="irar" data-v="'+r+'">'+t+'</button>').join('')+'</div>'+
   '<div style="margin-bottom:12px"><select class="sel" data-a="icol" aria-label="Lọc theo bộ"><option value="-1">Tất cả bộ sưu tập</option>'+COLS.filter(c=>unlocked(c.id)).map(c=>'<option value="'+c.id+'"'+(ui.icol===c.id?' selected':'')+'>'+c.icon+' '+c.name+'</option>').join('')+'</select></div>';
  const certs=(S.cert||[]).filter(c=>(ui.irar<0||ITEMS[c.id].r===ui.irar)&&(ui.icol<0||ITEMS[c.id].ci===ui.icol));
  if(!owned.length&&!certs.length) return h+'<div class="card empty"><b>Chưa có vật phẩm</b>Xé túi mù để nhận item đầu tiên.</div>';
  if(certs.length) h+='<h4 class="rh" style="color:var(--ink)">🏅 Item đã thẩm định <small>'+certs.length+'</small></h4><div class="tiles">'+certs.map(certTile).join('')+'</div>';
  h+='<p class="muted" style="margin:0 0 6px">'+(ui.selMode?'Chạm để chọn hoặc bỏ chọn item.':'Nhấn giữ một item để chọn nhiều và bán hàng loạt.')+'</p>';
  ui.shown=owned.slice();
  if(ui.isort==='col'){
    COLS.forEach(c=>{
      const ids=owned.filter(id=>ITEMS[id].ci===c.id).sort((a,b)=>ITEMS[b].r-ITEMS[a].r||a-b);
      if(ids.length) h+='<h4 class="rh" style="color:var(--ink)">'+c.icon+' '+c.name+' <small>'+ids.length+' loại</small></h4><div class="tiles">'+ids.map(id=>tile(id,'inv')).join('')+'</div>';
    });
  }else{
    const dir=ui.isort==='hi'?-1:1;
    const ids=owned.sort((a,b)=>dir*(ITEMS[a].r-ITEMS[b].r)||price(b)-price(a));
    h+='<div class="tiles">'+ids.map(id=>tile(id,'inv')).join('')+'</div>';
  }
  if(ui.selMode){
    const L=Object.keys(ui.sel).map(Number).filter(id=>S.inv[id]>0&&!isLocked(id));
    let net=0,base=0;L.forEach(id=>{net+=sellNet(id,S.inv[id]);base+=ITEMS[id].base*S.inv[id];});
    const g=Math.round(net-base);
    h+='<div class="selbar"><b>Đã chọn '+L.length+' loại</b><small>Bán hết sẽ nhận ≈ '+fmt(net)+' ₫ · <span class="'+(g>=0?'up':'dn')+'">'+(g>=0?'lãi ':'lỗ ')+fmt(Math.abs(g))+'</span></small>'+
     '<div class="btnrow"><button class="btn" data-a="selCancel">Hủy</button><button class="btn" data-a="selAll">Chọn tất cả</button><button class="btn primary" data-a="selSellAsk"'+(L.length?'':' disabled')+'>Bán</button></div></div>';
  }
  return h;
}

function viewChar(){
  const head='<button class="back" data-a="charBack">‹ Quay lại</button>'+seg('char',[['profile','Hồ sơ'],['badge','Huy hiệu']]);
  const bd=S.showBadge&&BADGES.find(b=>b.id===S.showBadge);
  if(ui.sub.char==='badge'){
    const got=BADGES.filter(b=>S.badges[b.id]).length;
    return head+'<div class="card"><h3>Huy hiệu '+got+'/'+BADGES.length+'</h3><p class="muted" style="margin:0 0 6px">Chọn một huy hiệu đã đạt để hiển thị cạnh tên (tối đa 1).</p>'+BADGES.map(b=>{
      const v=Math.min(b.cur(),b.need),on=S.showBadge===b.id;
      const act=!S.badges[b.id]?'':on?'<button class="chip on" data-a="badgeHide">Đang hiển thị · Gỡ</button>':'<button class="chip" data-a="badgeAsk" data-id="'+b.id+'">Hiển thị</button>';
      return '<div class="badge'+(S.badges[b.id]?' got':'')+'"><span class="bi">'+b.i+'</span><div style="flex:1;min-width:0"><b>'+b.t+'</b><small>'+b.d+'</small><div class="bar"><i style="width:'+(v/b.need*100)+'%"></i></div></div>'+act+'</div>';
    }).join('')+'</div>';
  }
  const max=S.lvl>=CFG.MAX_LV,tot=netWorth()-CFG.START_MONEY;
  let h=head+'<div class="card"><div class="row"><div><h2 style="font-size:24px">'+esc(S.name)+(bd?' <span title="'+esc(bd.t)+'">'+bd.i+'</span>':'')+'</h2><small>Cấp '+S.lvl+(max?' · tối đa':' · XP '+fmt(S.xp)+'/'+fmt(xpNeed(S.lvl)))+'</small></div><div class="stars-big" title="Chỉ số may mắn">'+starsHTML(stars())+'</div></div>'+
   '<div class="bar" style="margin:10px 0 4px"><i style="width:'+(max?100:S.xp/xpNeed(S.lvl)*100)+'%"></i></div>'+
   '<div class="kv"><span>Điểm may mắn'+(S.forced?' <small>(admin ép '+S.forced+' sao)</small>':'')+'</span><b>'+S.lp.toFixed(1)+' / 100</b></div>'+
   '<div class="kv"><span>Tiền đang có</span><b>'+fmt(S.money)+' ₫</b></div>'+
   '<div class="kv"><span>Tổng tài sản (tiền + item + túi)</span><b>'+fmt(netWorth())+' ₫</b></div>'+
   '<div class="kv"><span>Lời/lỗ tổng cộng so với vốn</span><b class="'+(tot>=0?'up':'dn')+'">'+sgn(tot)+' ₫</b></div></div>';
  h+='<div class="card"><h3>Nhật ký giao dịch</h3>'+(S.log.length?S.log.slice(0,8).map(l=>'<div class="log"><span>'+esc(l.x)+'<small>'+l.t+'</small></span><b class="'+(l.d>0?'up':l.d<0?'dn':'')+'">'+(l.d?sgn(l.d):'—')+'</b></div>').join(''):'<p class="muted" style="margin:0">Chưa có giao dịch nào.</p>')+
   '<button class="btn block" style="margin-top:8px" data-a="nav" data-k="bag" data-sub="log">Xem nhật ký đầy đủ</button></div>';
  return h;
}

    const es=ui.adEdit||stars(),rt=rates(es),sum=rt.reduce((a,b)=>a+b,0),dw=S.ddWin==null?50:S.ddWin;

     '<div class="chips" style="margin-bottom:8px">'+[1,2,3,4,5].map(n=>'<button class="chip'+(es===n?' on':'')+'" data-a="adRateSel" data-n="'+n+'">'+n+' ★'+(S.adRates&&S.adRates[n]?' •':'')+'</button>').join('')+'</div>'+

    const ids=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0).sort((a,b)=>S.inv[b]-S.inv[a]||ITEMS[b].r-ITEMS[a].r);
    sheet('<h2>Chọn item quyên góp</h2><p class="muted" style="margin:0 0 8px">Nên chọn item dư nhiều mà bạn không muốn nâng cấp.</p>'+
      (ids.length?'<div class="tiles">'+ids.map(id=>{const it=ITEMS[id];return '<button class="tile r'+it.r+(isLocked(id)?' dim':'')+'" data-a="donPick" data-id="'+id+'">'+(isLocked(id)?'<span class="t-lk">🔒</span>':'')+'<span class="t-e">'+it.e+'</span><span class="t-n">'+it.n+'</span><span class="t-q">×'+S.inv[id]+'</span></button>';}).join('')+'</div>':'<div class="empty"><b>Bạn chưa có item</b>Hãy xé túi mù trước nhé.</div>')+
      '<button class="btn block" style="margin-top:12px" data-a="closeM">Đóng</button>');
    return;
  }
  const id=d.id,it=ITEMS[id],q=S.inv[id];

function enterGame(){
  ui.screen='game';$('#title').hidden=true;$('#app').hidden=false;
  ensureEvents();auSync();
  if(S.au&&S.au.list) S.au.list.forEach((a,i)=>{if(a.status==='joined'&&a.holder==='you')auResolve(i);});
  ui.sig=marketSig();last=performance.now();
  refresh();
  if(S.bankrupt){showGameOver();return;}
  if(S.closed&&S.lastSum) showSummary(S.lastSum);
}
function startNew(name){
  S=newState(name);S.admin=!!ui.titleAdmin;startDay(1);
  S.day$.startWorth=netWorth();
  ui.tab='bag';ui.sub={market:'bm',kho:'item',bag:'bags',char:'profile',sys:'sys'};ui.bstCol=null;
  save();enterGame();
}

  adTime(d){const n=+d.n;S.clock=n?Math.min(CFG.DAY_END,S.clock+n):CFG.DAY_END;auSync();checkTimeEvents();after();},
  adClearItems(){confirmBox('Xóa tất cả item?','Toàn bộ item đang có và bộ sưu tập đã mở sẽ bị xóa.','Xóa',()=>{S.inv={};S.disc={};closeModal();after();toast('Đã xóa tất cả item');},true);},
  adClearBags(){confirmBox('Xóa tất cả túi mù?','Mọi túi mù chưa xé sẽ bị xóa.','Xóa',()=>{S.bags={};closeModal();after();toast('Đã xóa tất cả túi mù');},true);},
  saveExit(){save();renderTitle('Đã lưu. Hẹn gặp lại!');},
  resetAsk(){confirmBox('Reset game?','Toàn bộ tiến trình sẽ bị xóa và bạn phải bắt đầu lại từ đầu.','Xóa và chơi lại',()=>{try{localStorage.removeItem(KEY);}catch(e){}S=null;closeModal();renderTitle('Đã reset game.');},true);},
  exportData(){sheet('<h2>Mã sao lưu</h2><p class="muted">Copy toàn bộ đoạn văn bản dưới đây và cất đi.</p><textarea class="txt" id="exp" readonly></textarea><button class="btn block" style="margin-top:10px" data-a="closeM">Đóng</button>');$('#exp').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#exp').select();},
  importAsk(){sheet('<h2>Khôi phục từ mã</h2><p class="muted">Dán mã sao lưu vào đây. Tiến trình hiện tại sẽ bị thay thế.</p><textarea class="txt" id="imp"></textarea><div class="btnrow"><button class="btn" data-a="closeM">Hủy</button><button class="btn primary" data-a="importOk">Khôi phục</button></div>');},
  importOk(){
    try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!o||o.v!==1||!o.name)throw 0;S=migrate(o);save();closeModal();enterGame();toast('Đã khôi phục tiến trình','good');}
    catch(e){toast('Mã sao lưu không hợp lệ','bad');}
  },
  start(){const v=($('#nm').value||'').trim();if(!v){toast('Hãy nhập tên nhân vật','bad');$('#nm').focus();return;}startNew(v);},
  continue(){S=loadSave();if(S){S.admin=!!ui.titleAdmin;save();enterGame();}else renderTitle('Không đọc được dữ liệu đã lưu.');},
  newAsk(){confirmBox('Chơi mới?','Dữ liệu đã lưu sẽ bị xóa.','Chơi mới',()=>{try{localStorage.removeItem(KEY);}catch(e){}closeModal();renderTitle();},true);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el) return;
  if(el.tagName==='SELECT') return;
  if(el.disabled) return;
  const f=A[el.dataset.a];
  if(f){f(el.dataset);return;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.a==='icol'){ui.icol=+el.value;renderView();}
});
$('#modal').addEventListener('click',e=>{
  if(e.target===$('#modal')&&!$('#modal').classList.contains('reveal')&&!$('#modal').classList.contains('locked')) A.closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden&&!$('#modal').classList.contains('locked')) A.closeM();
  if(e.key==='Enter'&&ui.screen==='title'&&$('#nm')) A.start();
});

/* ============ ĐỒNG HỒ GAME ============ */
let last=performance.now();
function marketSig(){
  if(!S) return '';
  const bm=bmActive().map(o=>o.oid+':'+o.qty).join(',');
  const au=S.au&&S.au.list&&S.au.day===S.day?S.au.list.map(a=>a.status).join(','):'-';
  const bl=S.blind&&S.blind.day===S.day?S.blind.status:'-';
  return (S.clock>=CFG.BM_OPEN?1:0)+'|'+(S.clock>=CFG.BM_CLOSE?1:0)+'|'+bm+'|'+au+'|'+bl+'|'+(isOver()?1:0)+'|'+(S.trade&&S.trade.day===S.day?S.trade.idx+':'+(S.trade.cur?S.trade.cur.status:'-'):'-');
}
function checkTimeEvents(){
  const before=ui.sig.split('|');
  auSync();
  const sig=marketSig();
  if(sig!==ui.sig){
    const p=sig.split('|');
    const ids=s=>(s||'').split(',').filter(Boolean).map(x=>x.split(':')[0]);
    const oldIds=ids(before[2]);
    if(ids(p[2]).some(x=>!oldIds.includes(x))) toast('🕶️ Chợ đen vừa có hàng mới!');
    const oa=(before[3]||'').split(','),na=(p[3]||'').split(',');
    if(na.some((s,i)=>s==='open'&&oa[i]==='wait')) toast('🔨 Có phiên đấu giá mới!');
    if(p[4]==='open'&&before[4]==='wait') toast('🎁 Có phiên đấu giá mù!');
    if(p[6]&&p[6].endsWith(':open')&&p[6].split(':')[0]!==(before[6]||'').split(':')[0]) toast('🤝 Có NPC muốn đổi item với bạn!');
    ui.sig=sig;renderNav();
    if(ui.tab==='market'&&$('#modal').hidden) renderView();
  }
  if(isOver()&&!S.overNote){S.overNote=true;toast('🌙 Hết giờ hoạt động — hãy kết thúc ngày');renderTop();}
}
function tick(){
  const now=performance.now();let dt=(now-last)/1000;last=now;
  if(ui.screen==='game'&&S&&S.dd){
    const t=Date.now(),due=Math.min(DD_STEPS,Math.floor((t-S.dd.start)/250));
    while(S.dd.steps<due) ddStep();
    if(t>=S.dd.deadline||S.dd.steps>=DD_STEPS){
      ddResolve();save();refresh();
      const r=S.ddLast,it=ITEMS[r.id];
      toast(r.up?'📈 Thắng! +'+fmt(r.val)+' ₫':r.down?'📉 Thua, mất '+it.n:'Hòa, giữ lại item',r.up?'good':r.down?'bad':'');
      if($('#modal').hidden) sheet('<h2>'+(r.up?'📈 Giá tăng — bạn thắng!':r.down?'📉 Giá giảm — bạn thua':'Giá đi ngang — hòa')+'</h2><div class="hero-item r'+it.r+'" style="margin-top:8px"><div class="big">'+it.e+'</div><div><h2 style="font-size:19px">'+it.n+'</h2><div class="muted">'+fmt(r.p0)+' ₫ → '+fmt(r.end)+' ₫</div></div></div><p style="margin:0"><b>'+(r.up?'Nhận thưởng +'+fmt(r.val)+' ₫ và giữ lại item.':r.down?'Bạn đã mất item này.':'Bạn giữ lại item, không có thưởng.')+'</b></p><button class="btn primary block" style="margin-top:12px" data-a="closeM">Xong</button>');
    }else if(ui.tab==='market'&&ui.sub.market==='dd') updateDD();
  }
  if(ui.screen!=='game'||!S||document.hidden) return;
  dt=Math.min(dt,1);
  if(!isOver()){
    const oldH=Math.floor(S.clock/60);
    S.clock=Math.min(CFG.DAY_END,S.clock+dt*GMS);
    if(Math.floor(S.clock/60)!==oldH) marketTick(false);
    ui.dirty=true;
  }
  const ck=$('#ck');if(ck) ck.textContent=fmtClock();
  document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=fmtDur(+el.dataset.cd-S.clock);});
  checkTimeEvents();
  if(ui.dirty&&Date.now()-ui.lastSave>5000){ui.lastSave=Date.now();save();}
}
setInterval(tick,250);
let lpTimer=null,lpPos=null;
document.addEventListener('pointerdown',e=>{
  ui.suppress=false;
  const t=e.target.closest&&e.target.closest('.tile[data-inv]');
  if(!t||ui.tab!=='kho'||ui.selMode) return;
  lpPos={x:e.clientX,y:e.clientY};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{
    lpTimer=null;ui.suppress=true;
    if(isLocked(+t.dataset.id)){lockedPrompt(+t.dataset.id,'bán');return;}
    ui.selMode=true;ui.sel={};ui.sel[+t.dataset.id]=1;
    try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
    renderView();
  },450);
});
document.addEventListener('pointermove',e=>{if(lpTimer&&lpPos&&Math.hypot(e.clientX-lpPos.x,e.clientY-lpPos.y)>10){clearTimeout(lpTimer);lpTimer=null;}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(lpTimer);lpTimer=null;if(ui.suppress)setTimeout(()=>{ui.suppress=false;},350);}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tile[data-inv]'))e.preventDefault();});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&S)save();});
window.addEventListener('pagehide',()=>{if(S&&ui.screen==='game')save();});

/* ============ KHỞI ĐỘNG ============ */
renderTitle();
})();
</script>
