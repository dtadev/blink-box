    });
  },
  tradeSkip(d){const o=S.trade&&S.trade.offers?S.trade.offers.find(x=>x.oid===+d.oid):null;if(o&&o.status==='open'){o.status='skipped';save();renderView();toast('Đã bỏ qua, chờ lượt sau');}},
  ddPick(d){
    const id=+d.id,it=ITEMS[id];
    if(isLocked(id)){lockedPrompt(id);return;}
    confirmBox('Đặt cược '+it.e+' '+it.n+'?','Giá hiện tại '+fmt(price(id))+' ₫. Sau 6 giây: giá tăng thì bạn nhận <b>+'+fmt(price(id))+' ₫</b> và giữ lại item; giá giảm thì <b>mất item</b>.'+qtyWarn(id),'Đặt cược',()=>{
      const e=ddStart(id);closeModal();
      if(e)toast(e,'bad');else toast('Đã đặt cược. Chờ 6 giây!');
      after();
    },true);
  },
  loanAsk(d){
    const k=+d.k,t=LOANS[k],c=loanCalc(t);
    confirmBox('Vay '+fmt(t.amt)+' ₫?','Lãi suất hôm nay '+pp(S.rate)+'/ngày (chốt cho khoản vay này). Thời hạn '+t.days+' ngày, tổng phải trả '+fmt(c.total)+' ₫, trả '+fmt(c.daily)+' ₫ mỗi ngày sau khi kết thúc ngày. Không đủ tiền sẽ bị gán nợ bằng item, không đủ cả hai thì phá sản.','Vay',()=>{
      const e=takeLoan(k);closeModal();
      if(e)toast(e,'bad');else toast('Đã nhận '+fmt(t.amt)+' ₫','good');
      after();
    });
  },
  loanPayAsk(d){
    const k=+d.k,L=S.loans.find(l=>l.tier===k);if(!L)return;
    confirmBox('Trả hết nợ sớm?','Bạn sẽ trả '+fmt(L.remaining)+' ₫ để tất toán khoản vay này (không được hoàn lại lãi).','Trả hết nợ',()=>{
      const e=repayLoan(k);closeModal();
      if(e)toast(e,'bad');else toast('Đã tất toán khoản vay','good');
      after();
    });
  },
  gameOverNew(){try{localStorage.removeItem(KEY);}catch(e){}S=null;closeModal();renderTitle();},
  shopOpen(){A.nav({k:'supply'});},
  shopBack(){ui.sub.bag='bags';renderView();$('#main').scrollTop=0;},
  auJoinAsk(d){
    const i=+d.i,a=AU(i);if(!a)return;
    confirmBox('Tham gia đấu giá?','Phí tham gia '+fmt(a.fee)+' ₫ sẽ bị trừ ngay và không hoàn lại nếu bạn bỏ cuộc hoặc thua.','Đóng phí và tham gia',()=>{
      const e=auJoin(i);closeModal();
      if(e)toast(e,'bad');else toast('Đã tham gia. Hãy ra giá!');
      after();
    });
  },
  auBid(d){
    const i=+d.i,e=auBid(i,+d.j);
    if(e){toast(e,'bad');return;}
    save();refresh();
    setTimeout(()=>{
      const r=auResolve(i);
      if(r&&r.won){after();showReveal({id:r.id,isNew:r.isNew,note:'Thắng đấu giá!',actions:'<button class="btn primary" data-a="closeM">Tuyệt</button>'});}
      else{if(r&&r.counter)toast(r.counter+' đã ra giá cao hơn');after();}
    },900);
  },
  auLeaveAsk(d){const i=+d.i,a=AU(i);if(!a)return;confirmBox('Bỏ cuộc?','Bạn sẽ mất phí tham gia '+fmt(a.fee)+' ₫ và không giành được item.','Bỏ cuộc',()=>{auLeave(i);closeModal();after();},true);},
  endDayAsk(){
    if(S.closed){showSummary(S.lastSum);return;}
    if(S.dd){toast('Hãy chờ kết quả Đu đỉnh trước khi kết thúc ngày.');return;}
    if(pendingCustomers().length){toast('Còn khách trong tiệm. Hãy thanh toán hoặc chờ khách rời đi trước khi kết toán.');A.nav({k:'shop'});return;}
    const body=isOver()?'Hệ thống sẽ kết toán ngày '+S.day+' và bắt đầu ngày mới.':'Chưa tới 21:00. Chợ đen và đấu giá còn lại hôm nay sẽ bị bỏ lỡ. Vẫn kết thúc ngày '+S.day+'?';
    confirmBox('Kết thúc ngày '+S.day+'?',body,'Kết thúc ngày',()=>{if(pendingCustomers().length){closeModal();toast('Có khách mới vào. Hãy xử lý khách trước khi kết toán.');A.nav({k:'shop'});return;}const sum=endDay();save();refresh();if(S.bankrupt){showGameOver();return;}showSummary(sum);});
  },
  showSum(){if(S.lastSum)showSummary(S.lastSum);},
  nextDayAsk(){
    if(!S.closed||S.bankrupt)return;
    startNextDay();closeModal();save();refresh();
  },
  closeM(){ui.adminOpen=false;closeModal();if(!S||ui.screen==='title')return;if(S&&S.bankrupt){showGameOver();return;}if(S&&S.closed&&S.lastSum){refresh();showSummary(S.lastSum);return;}refresh();},
  confirmOk(){const f=ui.conf;if(f){ui.conf=null;f();}},
  adRateSel(d){ui.adEdit=+d.n;renderView();},
  adRateSave(){
    const es=ui.adEdit||stars(),vals=[...document.querySelectorAll('.rin[data-r]')].map(i=>Math.max(0,Math.min(100,parseFloat(i.value)||0)));
    const sum=vals.reduce((a,b)=>a+b,0);
    if(vals.length!==6||sum<=0){toast('Tổng tỉ lệ phải lớn hơn 0','bad');return;}
    const norm=vals.map(v=>Math.round(v/sum*10000)/100);
    if(!S.adRates)S.adRates={};S.adRates[es]=norm;
    save();renderView();toast('Đã lưu tỉ lệ cho mức '+es+' ★','good');
  },
  adRateReset(){const es=ui.adEdit||stars();if(S.adRates){delete S.adRates[es];if(!Object.keys(S.adRates).length)S.adRates=null;}save();renderView();toast('Đã khôi phục mặc định '+es+' ★');},
  adDdWin(d){S.ddWin=+d.n;save();renderView();toast('Tỉ lệ thắng Đu đỉnh: '+S.ddWin+'%');},
  adDdWinSet(){const v=Math.max(0,Math.min(100,parseFloat($('#ddwin').value)));if(isNaN(v)){toast('Giá trị không hợp lệ','bad');return;}S.ddWin=Math.round(v*10)/10;save();renderView();toast('Tỉ lệ thắng Đu đỉnh: '+S.ddWin+'%','good');},
  adLv(d){const o=S.lvl;S.lvl=d.n==='max'?CFG.MAX_LV:Math.min(CFG.MAX_LV,S.lvl+(+d.n));S.xp=0;if(S.lvl>o){S.lp=Math.min(100,S.lp+0.3*(S.lvl-o));onLevelUp(o,S.lvl);}after();},
  adStar(d){S.forced=+d.n;after();toast(S.forced?'Ép '+S.forced+' sao may mắn':'May mắn về chế độ tự động');},
  adMoney(d){S.money+=+d.n;toast('+'+fmt(+d.n)+' ₫','good');after();},
  adDays(d){
    const n=+d.n;closeModal();
    for(let i=0;i<n;i++){endDay();if(S.bankrupt)break;startNextDay();}
    save();refresh();
    if(S.bankrupt){showGameOver();return;}
    toast('⏩ Đã tua '+n+' ngày, hiện là ngày '+S.day,'good');
  },
  adTime(d){const n=+d.n,nc=n?Math.min(CFG.DAY_END,S.clock+n):CFG.DAY_END;runHoursTo(nc);S.clock=nc;auSync();checkTimeEvents();after();},
  adClearItems(){confirmBox('Xóa tất cả item?','Toàn bộ item đang có và bộ sưu tập đã mở sẽ bị xóa.','Xóa',()=>{S.inv={};S.disc={};closeModal();after();toast('Đã xóa tất cả item');},true);},
  adClearBags(){confirmBox('Xóa tất cả túi mù?','Mọi túi mù chưa xé sẽ bị xóa.','Xóa',()=>{S.bags={};closeModal();after();toast('Đã xóa tất cả túi mù');},true);},
  saveExit(){save();renderTitle('Đã lưu. Hẹn gặp lại!');},
  resetAsk(){confirmBox('Reset game?','Toàn bộ tiến trình sẽ bị xóa và bạn phải bắt đầu lại từ đầu.','Xóa và chơi lại',()=>{try{localStorage.removeItem(KEY);}catch(e){}S=null;closeModal();renderTitle('Đã reset game.');},true);},
  exportData(){sheet('<h2>Mã sao lưu</h2><p class="muted">Copy toàn bộ đoạn văn bản dưới đây và cất đi.</p><textarea class="txt" id="exp" readonly></textarea><button class="btn block" style="margin-top:10px" data-a="closeM">Đóng</button>');$('#exp').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#exp').select();},
  importAsk(){sheet('<h2>Khôi phục từ mã</h2><p class="muted">Dán mã sao lưu vào đây. Tiến trình hiện tại sẽ bị thay thế.</p><textarea class="txt" id="imp"></textarea><div class="btnrow"><button class="btn" data-a="closeM">Hủy</button><button class="btn primary" data-a="importOk">Khôi phục</button></div>');},
  importOk(){
    try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!o||o.v!==1||!o.name)throw 0;S=migrate(o);save();closeModal();enterGame();toast('Đã khôi phục tiến trình','good');}
    catch(e){toast('Mã sao lưu không hợp lệ','bad');}
  },
  start(){
    const v=($('#nm').value||'').trim(),sv=loadSave();
    if(sv){S=sv;if(v&&v!==S.name)S.name=v;S.admin=!!S.adminCard;save();enterGame();return;}
    if(!v){toast('Hãy nhập tên nhân vật','bad');$('#nm').focus();return;}
    startNew(v);
  },
  continue(){S=loadSave();if(S){S.admin=!!S.adminCard;save();enterGame();}else renderTitle('Không đọc được dữ liệu đã lưu.');},
  newAsk(){confirmBox('Chơi mới?','Dữ liệu đã lưu sẽ bị xóa.','Chơi mới',()=>{try{localStorage.removeItem(KEY);}catch(e){}closeModal();renderTitle();},true);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el) return;
  if(el.tagName==='SELECT') return;
  if(el.disabled) return;
  const f=A[el.dataset.a];
  if(f){sfx('tap');f(el.dataset);return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='admin-search'&&S&&S.adminCard){
    ui.adminSearch=e.target.value;
    const results=$('#admin-search-results');
    if(results)results.innerHTML=adminItemResults(ADMIN_ITEMS.filter(x=>adminSearchKey(x.name).includes(adminSearchKey(ui.adminSearch))));
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.a==='icol'){ui.icol=+el.value;renderView();}
  if(el.dataset&&el.dataset.a==='askSet'){ui.askPct=Math.round(clamp(parseFloat(el.value)||0,-60,300));reAsk();}
});
$('#modal').addEventListener('click',e=>{
  if(e.target===$('#modal')&&!$('#modal').classList.contains('reveal')&&!$('#modal').classList.contains('locked')) A.closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden&&!$('#modal').classList.contains('locked')) A.closeM();
  if(e.key==='Enter'&&ui.screen==='title'&&$('#nm')) A.start();
});

/* ============ ĐỒNG HỒ GAME ============ */
let last=performance.now();
function marketSig(){
  if(!S) return '';
  const bm=bmActive().map(o=>o.oid+':'+o.qty).join(',');
  const au=S.au&&S.au.list&&S.au.day===S.day?S.au.list.map(a=>a.status).join(','):'-';
  return (S.clock>=CFG.BM_OPEN?1:0)+'|'+(S.clock>=CFG.BM_CLOSE?1:0)+'|'+bm+'|'+au+'|'+(isOver()?1:0)+'|'+(S.trade&&S.trade.day===S.day?S.trade.idx+':'+tradeOpenN():'-');
}
function checkTimeEvents(){
  const before=ui.sig.split('|');
  auSync();
  const sig=marketSig();
  if(sig!==ui.sig){
    const p=sig.split('|');
    const ids=s=>(s||'').split(',').filter(Boolean).map(x=>x.split(':')[0]);
    const oldIds=ids(before[2]);
    if(ids(p[2]).some(x=>!oldIds.includes(x))) toast('🕶️ Chợ đen vừa có hàng mới!');
    const oa=(before[3]||'').split(','),na=(p[3]||'').split(',');
    if(na.some((s,i)=>s==='open'&&oa[i]==='wait')) toast('🔨 Có phiên đấu giá mới!');
    if(p[5]&&p[5]!=='-'){const a6=p[5].split(':'),b6=(before[5]||'').split(':');if(a6[0]!==b6[0]&&+a6[1]>0) toast('🤝 Có NPC đang chờ giao dịch với bạn!');}
    ui.sig=sig;renderNav();
    if((ui.tab==='market'||ui.tab==='community')&&$('#modal').hidden) renderView();
  }
  if(isOver()&&!S.overNote){S.overNote=true;renderTop();}
}
function tick(){
  const now=performance.now();let dt=(now-last)/1000;last=now;
  if(ui.screen==='game'&&S&&S.dd){
    const t=Date.now(),due=Math.min(DD_STEPS,Math.floor((t-S.dd.start)/250));
    while(S.dd.steps<due) ddStep();
    if(t>=S.dd.deadline||S.dd.steps>=DD_STEPS){
      ddResolve();save();refresh();
      const r=S.ddLast,it=ITEMS[r.id];
      toast(r.up?'📈 Thắng! +'+fmt(r.val)+' ₫':r.down?'📉 Thua, mất '+it.n:'Hòa, giữ lại item',r.up?'good':r.down?'bad':'');
      if($('#modal').hidden) sheet('<h2>'+(r.up?'📈 Giá tăng — bạn thắng!':r.down?'📉 Giá giảm — bạn thua':'Giá đi ngang — hòa')+'</h2><div class="hero-item r'+it.r+'" style="margin-top:8px"><div class="big">'+it.e+'</div><div><h2 style="font-size:19px">'+it.n+'</h2><div class="muted">'+fmt(r.p0)+' ₫ → '+fmt(r.end)+' ₫</div></div></div><p style="margin:0"><b>'+(r.up?'Nhận thưởng +'+fmt(r.val)+' ₫ và giữ lại item.':r.down?'Bạn đã mất item này.':'Bạn giữ lại item, không có thưởng.')+'</b></p><button class="btn primary block" style="margin-top:12px" data-a="closeM">Xong</button>');
    }else if(ui.tab==='market'&&ui.sub.market==='dd') updateDD();
  }
  if(ui.screen!=='game'||!S||document.hidden) return;
  dt=Math.min(dt,1);
  autoRestock();
  tickCustomers(dt);
  if(isStoreOpen()){
    const oldH=Math.floor(S.clock/60);
    S.clock=Math.min(CFG.DAY_END,S.clock+dt*GMS);
    if(Math.floor(S.clock/60)!==oldH){fmHour();renderTop();renderNav();if($('#modal').hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT')&&(ui.tab==='shop'||ui.tab==='supply'||ui.tab==='kho'||ui.tab==='char'))renderView();}
    ui.dirty=true;
  }
  const ck=$('#ck');if(ck) ck.textContent=fmtClock();
  document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=fmtDur(+el.dataset.cd-S.clock);});
  checkTimeEvents();
  if(ui.dirty&&Date.now()-ui.lastSave>5000){ui.lastSave=Date.now();save();}
}
setInterval(tick,250);
let lpTimer=null,lpPos=null;
document.addEventListener('pointerdown',e=>{
  ui.suppress=false;
  const t=e.target.closest&&e.target.closest('.tile[data-inv]');
  if(!t||ui.tab!=='char'||ui.sub.char!=='bag'||ui.selMode) return;
  lpPos={x:e.clientX,y:e.clientY};
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{
    lpTimer=null;ui.suppress=true;
    if(isLocked(+t.dataset.id)){lockedPrompt(+t.dataset.id,'bán');return;}
    ui.selMode=true;ui.sel={};ui.sel[+t.dataset.id]=1;
    try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
    renderView();
  },450);
});
document.addEventListener('pointermove',e=>{if(lpTimer&&lpPos&&Math.hypot(e.clientX-lpPos.x,e.clientY-lpPos.y)>10){clearTimeout(lpTimer);lpTimer=null;}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(lpTimer);lpTimer=null;if(ui.suppress)setTimeout(()=>{ui.suppress=false;},350);}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.tile[data-inv]'))e.preventDefault();});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&S)save();});
window.addEventListener('pagehide',()=>{if(S&&ui.screen==='game')save();});

/* ============ KHỞI ĐỘNG ============ */
loadSettings();
renderTitle();
})();
</script>
</body>
