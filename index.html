<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blink Box (Update 5.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceffd; --surface:#ffffff; --surface2:#f2f3fd; --ink:#1b1940; --ink2:#5d5c85; --line:#dbdff4;
  --accent:#ff3d86; --accent-ink:#ffffff; --gold:#ffb800; --teal:#0fb5a3; --bad:#d93a40; --good:#14954f;
  --shadow:0 6px 22px rgba(40,30,110,.10); --overlay:rgba(18,12,48,.62);
  --r0:#2fae67; --r1:#3a86ff; --r2:#9a5cff; --r3:#e43d50; --r4:#ff8420; --r5:#ffb800;
  --fd:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
    --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
    --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
    --r0:#43c47c; --r1:#5b9bff; --r2:#b087ff; --r3:#ff586b; --r4:#ff9a45; --r5:#ffc83a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
  --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
  --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
  --r0:#43c47c; --r1:#5b9bff; --r2:#b087ff; --r3:#ff586b; --r4:#ff9a45; --r5:#ffc83a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-family:var(--fd);line-height:1.15}
small{color:var(--ink2)}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.app[hidden],.title[hidden],.modal[hidden]{display:none}

/* header */
#top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px 0;box-shadow:var(--shadow);z-index:5}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.hl{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left;min-width:0;border-radius:12px;padding:2px 4px 2px 0}
.hl:active{background:var(--surface2)}
.hl .r1{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.hl b{font-family:var(--fd);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvb{font-style:normal;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 8px;white-space:nowrap}
.hl .luck{font-size:13px;letter-spacing:1px}
.hm{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:5px 8px;font-size:11.5px;line-height:1.25}
.hm-l{font-weight:800;color:var(--ink2);font-size:9.5px;letter-spacing:.3px}
#feedtxt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .18s}
#feedtxt.fade{opacity:0}
.hr{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.hr1{display:flex;align-items:center;gap:6px}
.gear{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);flex:none}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xpbar{height:3px;background:var(--surface2);margin:8px -12px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));transition:width .5s}
.tbtn{margin-top:10px}
.qrbox{width:100%;aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--surface2)}
.qrbox img{width:100%;height:100%;object-fit:contain}
.top-r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-family:var(--fd);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.who{text-align:left;border-radius:14px;padding:2px 8px 2px 2px}
button.who:active{background:var(--surface2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:16px;flex:none}
.clock{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-family:var(--fd);font-weight:700}
.clock .ck-d{font-size:13px;color:var(--ink2);font-weight:600}
.clock #ck{font-size:18px;font-variant-numeric:tabular-nums}
.clock.over{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.clock.over .ck-d{color:inherit}
.top-r2{display:flex;align-items:center;gap:12px;margin-top:8px}
.lv{flex:1;min-width:0}
.lv-n{font-family:var(--fd);font-weight:700;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:99px;transition:width .5s ease}
.luck{font-size:15px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.luck .off{color:var(--line)}
.cash{font-family:var(--fd);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.cash small{font-size:13px;margin-left:2px}
.banner{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid var(--accent);border-radius:12px;padding:8px 10px;font-size:13px}
.banner button{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-weight:700;white-space:nowrap}

/* main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.seg{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ev{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:evp 1.6s infinite}
@keyframes evp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
#nav button{position:relative}
.menu{display:flex;gap:8px;margin-bottom:10px}
.menu button{flex:1;padding:10px 8px;border-radius:14px;font-family:var(--fd);font-weight:700;font-size:16px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);transition:background .2s,color .2s}
.menu button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.score{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;color:var(--gold)}
#nav .ev{position:absolute;top:4px;left:calc(50% + 8px);margin:0}
.seg button .lk{font-size:11px;margin-left:3px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:8px}
.muted{color:var(--ink2);font-size:13px}
.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty b{display:block;font-family:var(--fd);font-size:18px;color:var(--ink);margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp{height:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;transition:transform .12s,background .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.block{display:flex;width:100%}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select.sel{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
input.txt{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.txt{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;width:100%;height:140px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}

/* bags */
.bag{position:relative;display:inline-block;width:var(--sz);height:calc(var(--sz)*1.2);flex:none}
.bag svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(30,20,90,.22))}
.bag-e{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);text-align:center;font-size:calc(var(--sz)*.34);line-height:1}
.bagcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .15s;position:relative;text-align:center}
.bagcard:active{transform:scale(.97)}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shop-grid .bagcard{min-width:0;padding:9px 5px;border-radius:12px;gap:3px}
.shop-grid .bc-n{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.shop-grid .bc-p{font-size:11px;overflow-wrap:anywhere}
.shop-grid .bc-q{position:static;font-size:10px;padding:1px 6px}
.shop-grid .btn{width:100%;padding:6px 3px;font-size:10px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
@media(max-width:359px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.luck-progress{height:6px}
.luck-progress i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.bc-n{font-family:var(--fd);font-weight:700;font-size:15px;margin-top:4px;line-height:1.1}
.bc-p{font-weight:700;color:var(--accent);font-size:13.5px}
.bc-q{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.bagcard.lock{opacity:.55;filter:grayscale(.6);cursor:default}
.bagrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.bagrow .bi{flex:1;min-width:0}
.bagrow b{font-family:var(--fd);font-size:17px;display:block}
.qty{font-family:var(--fd);font-weight:800;font-size:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 11%,var(--surface));text-align:center;min-height:92px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.t-e{font-size:30px;line-height:1.1}
.t-n{font-size:11.5px;font-weight:600;line-height:1.2;word-break:break-word}
.t-q{position:absolute;top:4px;right:5px;font-size:11px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:99px;padding:0 6px}
.tile.unk{border-style:dashed;border-color:var(--line);background:var(--surface2)}
.tile[data-inv]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.t-d{font-size:11.5px;font-weight:800;margin-top:auto;padding-top:2px;font-variant-numeric:tabular-nums}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.rin{width:92px;font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right}
.ibtns{display:flex;gap:8px;margin-left:auto;flex:none}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-color:var(--gold)}
.adq{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.adq button{padding:2px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.askctl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
.askin{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.askin .rin{width:76px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--surface2);border:1px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden}
.slot.empty{border-style:dashed;background:transparent}
.slot.sp{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface2))}
.slot .sq{position:absolute;bottom:2px;right:4px;font-size:11px;font-weight:800}
.slot.soon{aspect-ratio:auto;padding:10px 6px;text-align:center;opacity:.6;border-style:dashed}
.slot.soon span{font-size:24px}.slot.soon small{display:block;line-height:1.2}
.slot.lst{border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 11%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot.lst .lp{font-size:10.5px;font-weight:700;line-height:1}
.slot.lst .sq{top:2px;right:3px;bottom:auto}
.t-lk{position:absolute;top:4px;left:5px;font-size:13px;line-height:1}
.tile.dim .t-lk{opacity:1}
.t-ck{position:absolute;top:4px;left:5px;background:var(--accent);color:var(--accent-ink);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.selbar{position:sticky;bottom:-12px;margin:14px -14px -20px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(30,20,90,.12);padding:10px 14px 12px;z-index:4}
.selbar .btnrow{margin-top:8px}
.selbar small{display:block}
.spark{width:100%;height:96px;display:block;margin:8px 0}
.npc{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.npc .face{width:54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:30px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pair h4{font-size:13px;color:var(--ink2);margin-bottom:6px}
.tile.static{min-height:104px}
.tile.unk .t-e{filter:grayscale(1);opacity:.45}
.tile.dim{opacity:.55}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.rtag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--rc);color:#fff;font-size:12px;font-weight:700}
.r5 .rtag,.rtag.r5{color:#3b2a00}
.rh{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:15px;color:var(--rc)}
.rh small{font-weight:500}
.col-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.col-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--surface2);flex:none}
.col-card .bar{margin-top:6px}
.col-card.lock{opacity:.55}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.delta{font-weight:700;font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}

/* sheets / modal */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet .x{position:absolute}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.rate span:first-child{width:76px;color:var(--rc);font-weight:700}
.rate .bar{flex:1;margin:0;height:6px}
.rate .bar i{background:var(--rc)}
.rate span:last-child{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.hero-item{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.hero-item .big{width:78px;height:78px;border-radius:20px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--surface));display:grid;place-items:center;font-size:42px;flex:none}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 14px}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease,tout .3s ease 2.3s forwards;max-width:92%;text-align:center}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}

/* nav */
#nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink2);font-size:11.5px;font-weight:600;transition:color .2s}

#nav button.on svg{transform:translateY(-2px) scale(1.08)}

/* reveal */
.reveal{align-items:center}
.rv{width:min(92vw,360px);margin:0 auto;text-align:center;position:relative}
.rv-stage{position:relative;height:300px;display:grid;place-items:center;cursor:pointer}
.rv-bag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.rv.shake .rv-bag{animation:shake .75s ease-in-out}
.rv.open .rv-bag{animation:bagout .35s ease-in forwards}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}15%{transform:translate(-54%,-50%) rotate(-8deg)}30%{transform:translate(-46%,-50%) rotate(8deg)}45%{transform:translate(-54%,-50%) rotate(-10deg)}60%{transform:translate(-46%,-50%) rotate(10deg)}80%{transform:translate(-50%,-50%) scale(1.12) rotate(0)}}
@keyframes bagout{to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.rv-card{width:230px;padding:18px 12px 16px;border-radius:24px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,var(--surface));color:var(--ink);opacity:0;transform:rotateY(90deg) scale(.6);box-shadow:0 0 0 0 var(--rc)}
.rv.open .rv-card{animation:cardin .6s cubic-bezier(.2,.9,.3,1.25) forwards}
.rv.r5.open .rv-card{animation:cardin .6s cubic-bezier(.2,.9,.3,1.25) forwards,glow 1.6s ease-in-out .6s infinite}
@keyframes cardin{to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc) 55%,transparent)}50%{box-shadow:0 0 34px 8px color-mix(in srgb,var(--rc) 55%,transparent)}}

.rv.r5 .rv-rar{color:#3b2a00}
.rv-e{font-size:78px;line-height:1.15;margin:8px 0 2px}
.rv-n{font-family:var(--fd);font-size:22px;font-weight:700}
.rv-meta{font-size:13px;color:var(--ink2);margin-top:2px}
.rv-xp{font-weight:800;color:var(--teal);margin-top:6px}
.new{background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:99px;font-size:11px}
.rv-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;opacity:0;pointer-events:none;transition:opacity .3s .35s}
.rv.open .rv-actions{opacity:1;pointer-events:auto}
.rv-hint{color:#fff;opacity:.8;font-size:13px;position:absolute;left:0;right:0;bottom:6px}
.rv.open .rv-hint{display:none}
.burst i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--rc);opacity:0}
.rv.open .burst i{animation:burst .95s ease-out .1s forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(30px)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d))}}
.rv .btn{width:100%}

/* title */
.title{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding:24px 18px;padding-top:calc(24px + env(safe-area-inset-top,0px))}

}

  if(same){same.cost=(same.qty*(same.cost||0)+qty*unitCost)/(same.qty+qty);same.qty+=qty;}else S.listings.push({uid:S.uid++,kind:'bag',ci,qty,ask,cost:unitCost,t:'Ngày '+S.day+' '+fmtClock()});
  S.restock.watch[ci]={ask};logTx('Đăng bán '+qty+'× '+bagName(ci)+' giá '+fmt(ask)+' ₫',0);return {ok:true};
}
function restockNotice(key,message){

function autoRestock(force=false){
  const R=S.restock,H=S.customers;
  if(force&&S&&!S.closed&&(R.bagsOn||R.cardsOn)){const used=S.day$.staffUsed||(S.day$.staffUsed={});if(R.bagsOn)used.bags=true;if(R.cardsOn)used.cards=true;}
  if((!R.bagsOn&&!R.cardsOn)||S.closed||(!force&&!isStoreOpen()))return;
  if(!force&&H.time<R.next)return;R.next=H.time+15;
  const wallet=S.money,budget=Math.floor(wallet*R.budgetPct/100);let purchased=0,changed=false;
  // One purchase sweep has a single shared budget across all collections.
  for(const key of (R.bagsOn?Object.keys(R.watch):[])){
    const ci=+key;if(!COLS[ci])continue;
    if(!canShelf('bag',ci)){restockNotice('bag-capacity',shelfFull('bag'));continue;}
    if(S.listings.some(L=>L.kind==='bag'&&L.ci===ci&&L.qty>0))continue;
    if(!(S.bags[ci]>0)&&S.boxes[ci]>0){unpackBox(ci);changed=true;}
    if(!(S.bags[ci]>0)){
      const cost=boxPrice(ci);
      if(unlocked(ci)&&cost<=budget-purchased&&cost<=S.money){
        const err=buyBoxes(ci,1);if(!err){purchased+=cost;unpackBox(ci);changed=true;}
      }
    }
    if(S.bags[ci]>0){
      const result=listBag(ci,Math.min(S.bags[ci],shelfFree('bag')),R.watch[ci].ask);if(result.ok){changed=true;delete R.notice[key];}
    }else restockNotice(key,'⚠️ Hết '+bagName(ci)+'. Không thể nhập box trong ngân sách '+R.budgetPct+'%.');
  }
  const allowed=new Set(R.cardsOn?R.rarities:[]);
  for(const key of Object.keys(S.inv)){
    const id=+key,it=ITEMS[id];
    if(it&&S.inv[id]>0&&!isLocked(id)&&allowed.has(it.r)){
      const quantity=Math.min(S.inv[id],shelfFree('card')),err=quantity>0?listItem(id,quantity,5):{err:shelfFull('card')};if(err.ok)changed=true;else if(!canShelf('card',id))restockNotice('card-capacity',shelfFull('card'));
    }
  }
  // Appraised cards preserve their certificates and obey the same rarity/lock rules.
  for(const card of S.cert.slice()){
    if(!isLocked(card.id)&&allowed.has(ITEMS[card.id].r)){if(listCert(card.uid,5).ok)changed=true;else if(!canShelf('card',card.id))restockNotice('card-capacity',shelfFull('card'));}
  }
  if(shelfCount('bag')<shelfLimit('bag'))delete R.notice['bag-capacity'];
  if(shelfCount('card')<shelfLimit('card'))delete R.notice['card-capacity'];
  if(!S.listings.length)restockNotice('empty','⚠️ Quầy đã hết hàng. Hãy kiểm tra Kho tồn, thẻ được phép bán hoặc nhập thêm box.');
  else delete R.notice.empty;
  if(changed){save();renderTop();if(ui.tab==='shop'&&$('#modal').hidden)renderView();}
}

const LIVE_STATES=['toLive','liveWaiting','liveOpening','liveReact'];

function addHot(delta){S.hot=Math.max(0,Math.round((S.hot||0)+delta));ui.dirty=true;}
function finishCustomerExit(c){
  if(c.thief){escapeThief(c);return;}
  if(c.exitSettled)return;c.exitSettled=true;
  if(c.paid&&c.liveResult){S.live.history.unshift({day:S.day,clock:fmtClock(),uid:c.uid,name:c.name,face:c.face,total:c.liveResult.total,bestId:c.liveResult.bestId,trash:c.liveResult.trash||0,god:c.liveResult.god||0,bestGodKey:c.liveResult.bestGodKey||null,high:c.liveResult.high,hot:c.exitHot});S.live.history.length=Math.min(50,S.live.history.length);}
  if(c.paid&&c.exitHot){addHot(c.exitHot);logTx('HOT · '+c.name+' · '+(c.exitHot>0?'+':'')+c.exitHot+' HOT'+(c.liveResult?' (livestream)':' (mua hàng)'),0);}
}
function sendPaidCustomer(c,bags){
  c.paid=true;c.exitSettled=false;c.liveBags=bags;c.exitHot=0;
  if(S.live.enabled&&bags.length&&Math.random()*100<S.live.chance){
    customerState(c,'toLive',2.5,'Nhờ cửa hàng mở túi giúp tôi nhé!');
  }else{c.exitHot=1+Math.floor(Math.random()*3);customerState(c,'leaving',2.5,'Mua được hàng rồi, vui quá!');}
}
function rollCustomerLive(c){
  const result={total:0,bestId:null,high:false,trash:0,god:0,bestGodKey:null,counts:[0,0,0,0,0,0]};
  // Customer-owned bags use their collection odds. Player pity, XP and inventory are untouched.
  for(const line of c.liveBags)for(let n=0;n<line.qty;n++){
    const specialKind=ordinaryDropKind(Math.random());
    if(specialKind==='trash'){result.total++;result.trash++;continue;}
    if(specialKind==='god'){result.total++;result.god++;result.high=true;result.bestGodKey=result.bestGodKey||'god:'+line.ci+':'+Math.floor(Math.random()*3);continue;}
    const r=pickW(bagRates(line.ci),0),id=pick(COLS[line.ci].byR[r]);
    result.total++;result.counts[r]++;
    if(result.bestId==null||ITEMS[id].r>ITEMS[result.bestId].r)result.bestId=id;
    if(r>=2)result.high=true;
  }
  c.liveResult=result;c.exitHot=result.high?3+Math.floor(Math.random()*3):-1;
  c.satisfaction=result.high?'Vui vẻ':'Thất vọng';
  customerState(c,'liveReact',S.live.reactionSec,result.high?'Tuyệt quá! Có thẻ giá trị cao!':'Hơi tiếc, lần này chưa có thẻ giá trị cao.');
  S.live.last={name:c.name,face:c.face,...result,hot:c.exitHot};
}
function tickLive(){
  const H=S.customers;let changed=false;
  for(const c of H.people){
    const elapsed=H.time-c.since;
    if(c.state==='toLive'&&elapsed>=c.duration){customerState(c,'liveWaiting',0,'Tôi chờ mở túi tại livestream.');changed=true;}
    else if(c.state==='liveOpening'&&elapsed>=c.duration){rollCustomerLive(c);changed=true;}
    else if(c.state==='liveReact'&&elapsed>=c.duration){customerState(c,'leaving',2.5,c.line);changed=true;}
  }
  if(!H.people.some(c=>c.state==='liveOpening'||c.state==='liveReact')){
    const first=liveWaiting()[0];
    if(first){const count=first.liveBags.reduce((n,x)=>n+x.qty,0);customerState(first,'liveOpening',clamp(count*S.live.openSec,2,30),'Nhân viên đang mở '+count+' túi…');changed=true;}
  }
  return changed;
}

function unpackGodBox(ci,qty=1){

/* VIP, shop security and collectible previews. */
const randInt=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
function newVisitorConfig(){return {vipMin:3,vipMax:5,vipCount:1,thiefMin:3,thiefMax:5,thiefCountMin:1,thiefCountMax:3,stealMin:3,stealMax:10};}
function planVisitors(){
  const V=S.visitors,C=S.visitorConfig;
  if(V.day===S.day)return;
  V.day=S.day;V.plan=[];
  if(!V.vipNext)V.vipNext=S.day+randInt(C.vipMin,C.vipMax)-1;
  if(!V.thiefNext)V.thiefNext=S.day+randInt(C.thiefMin,C.thiefMax)-1;
  const add=(kind,n)=>{for(let i=0;i<n;i++)V.plan.push({kind,at:randInt(510,1170),done:false});};
  if(S.day>=V.vipNext){add('vip',C.vipCount);V.vipNext=S.day+randInt(C.vipMin,C.vipMax);V.vipToday=C.vipCount>0;if(V.vipToday){const msg='Hôm nay sẽ có khách hàng đặc biệt ghé thăm cửa hàng của bạn';toast(msg,'good');pushNews(msg);}}
  else V.vipToday=false;
  if(S.day>=V.thiefNext){add('thief',randInt(C.thiefCountMin,C.thiefCountMax));V.thiefNext=S.day+randInt(C.thiefMin,C.thiefMax);}
  V.plan.sort((a,b)=>a.at-b.at);
}
const cameraActive=()=>S.camera.level>0&&S.camera.on;
function visitorClass(c){return c.thief&&cameraActive()?' thief-mark':c.vip?' vip-mark':'';}
function tickVisitors(){
  if(!isAcceptingCustomers())return false;
  let changed=false;
  for(const p of S.visitors.plan){if(!p.done&&S.clock>=p.at&&S.customers.people.length<18){p.done=true;const c=spawnCustomer(p.kind);changed=true;if(c.thief&&cameraActive()&&S.camera.level===3){toast('📹 Camera phát hiện có trộm đã đến cửa hàng.');catchThief(c.uid,true);}}}
  return changed;
}
function stealBags(c){
  if(c.stole||!isStoreOpen())return;c.stole=true;
  let n=c.target;
  for(const L of shuffle(S.listings.filter(L=>L.kind==='bag'&&L.qty>0))){const qty=Math.min(n,L.qty);if(qty){c.cart.push({...L,qty});L.qty-=qty;n-=qty;}if(!n)break;}
  S.listings=S.listings.filter(L=>L.qty>0);
}
function escapeThief(c){
  if(c.theftSettled||c.caught)return;c.theftSettled=true;
  const qty=c.cart.reduce((n,L)=>n+L.qty,0);shopLedger().theftCost+=c.cart.reduce((n,L)=>n+(L.cost||0)*L.qty,0);shopLedger().estimated=shopLedger().estimated||c.cart.some(L=>L.costEstimated);S.day$.theft.lost+=qty;
  for(const L of c.cart)S.day$.theft.byCol[L.ci]=(S.day$.theft.byCol[L.ci]||0)+L.qty;
  c.cart=[];if(qty)recordSecurity('escape',c,qty);if(qty)logTx('Thất thoát do trộm · '+qty+' túi mù',0);
}

function validateSystemSettings(input){

  out.customerMax=x.customerMax===null?null:number(x.customerMax,1,500,'Sức mua tối đa',true);

  out.godConfig={normal:number(x.godConfig.normal,1,Number.MAX_SAFE_INTEGER,'Mốc GOD-BOX thường',true),premium:number(x.godConfig.premium,1,Number.MAX_SAFE_INTEGER,'Mốc GOD-BOX cao cấp',true),chance:number(x.godConfig.chance,0,100,'Tỉ lệ God-item')};
  out.visitorConfig={};for(const key of Object.keys(newVisitorConfig()))out.visitorConfig[key]=number(x.visitorConfig[key],1,100,key,true);
  for(const [a,b] of [['vipMin','vipMax'],['thiefMin','thiefMax'],['thiefCountMin','thiefCountMax'],['stealMin','stealMax']])if(out.visitorConfig[a]>out.visitorConfig[b])throw Error('Mốc tối thiểu vượt tối đa: '+a);
  out.duelNpcWin={arena:number(x.duelNpcWin.arena,0,100,'NPC Đấu trường'),legend:number(x.duelNpcWin.legend,0,100,'NPC Huyền thoại')};

  for(const key of ['mkMin','mkMax','fmGamma','fmKappa','fmVol','fmShock','fmDepth','fmFill','fmTol'])out.adConf[key]=number(c[key],0,1e9,key);
  if(out.adConf.mkMax<=0||out.adConf.mkMin>out.adConf.mkMax)throw Error('Biên độ thị trường không hợp lệ.');

}

function readBalanceFromHTML(source){
  const matches=[...source.matchAll(/\/\*BINK_BALANCE_START\*\/([\s\S]*?)\/\*BINK_BALANCE_END\*\//g)];
  if(matches.length!==1||!source.includes("const KEY='blinkshop.save.v1'"))throw Error('Hãy chọn đúng file HTML của bản game này.');
  let current;try{current=JSON.parse(matches[0][1]);}catch(e){throw Error('File HTML có cấu hình bị lỗi.');}
  if(current.version!==1||typeof current.revision!=='string')throw Error('File HTML chưa hỗ trợ bộ cấu hình này.');
  return {current,marker:matches[0][0]};
}
function patchBalanceHTML(source,profile,expectedRevision=LOCAL_BALANCE.revision){
  const checked=validateBalanceProfile(profile),{current,marker}=readBalanceFromHTML(source);
  if(current.revision!==expectedRevision)throw Error('File đã được áp dụng cấu hình khác. Hãy tải lại đúng file đó trước khi ghi tiếp.');
  const json=JSON.stringify(checked).replace(/</g,'\\u003c');
  // A callback preserves literal characters instead of treating replacement text as patterns.
  const start='/*BINK_'+'BALANCE_START*/',end='/*BINK_'+'BALANCE_END*/';

}

/* Book costs follow stock until the unit is sold; importing unsold stock is not an expense twice. */
function newShopLedger(partial=false){return {gross:0,net:0,cogs:0,orders:0,units:0,bagNet:0,cardNet:0,bagUnits:0,cardUnits:0,theftCost:0,imports:0,capex:0,collectibleCost:0,estimated:false,partial};}
function shopLedger(state=S){if(!state.day$.shop)state.day$.shop=newShopLedger(true);return state.day$.shop;}
function stockUnitCost(kind,ci,state=S){const value=state.stockCost[kind][ci];return Number.isFinite(value)&&value>=0?value:kind==='boxes'?boxPrice(ci):boxPrice(ci)/boxSize(ci);}
function addStock(kind,ci,qty,totalCost,state=S){
  const old=state[kind][ci]||0,oldCost=stockUnitCost(kind,ci,state);state.stockCost[kind][ci]=(old*oldCost+totalCost)/(old+qty);state[kind][ci]=old+qty;
}
function takeStock(kind,ci,qty){const cost=stockUnitCost(kind,ci)*qty;S[kind][ci]-=qty;if(!S[kind][ci])delete S[kind][ci];return cost;}
function recordShopSale(lines,gross,net){
  const a=shopLedger();a.gross+=gross;a.net+=net;a.orders++;
  for(const L of lines){a.cogs+=(L.cost||0)*L.qty;a.units+=L.qty;a.estimated=a.estimated||!!L.costEstimated;const amount=L.ask*L.qty*(1-CFG.SELL_FEE);if(L.kind==='bag'){a.bagNet+=amount;a.bagUnits+=L.qty;}else{a.cardNet+=amount;a.cardUnits+=L.qty;}}
}
function makeShopReport(day,staff){
  const a=day.shop;if(!a)return null;
  const fees=a.gross-a.net,grossProfit=a.net-a.cogs,staffCost=staff?staff.total:staffEstimate().total;
  return {...a,salesFees:fees,grossProfit,staffCost,profit:grossProfit-staffCost-a.theftCost};
}

const FM_DEPTH=[40,25,12,6,3,1.5],FM_SIG=[0.025,0.035,0.05,0.07,0.09,0.12],FM_FILL=[0.55,0.48,0.40,0.30,0.22,0.15],FM_FLOOR=[0.85,0.75,0.55,0.4,0.3,0.25];
const rndn=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
function mkEvent(x){S.mkEv.unshift({x,hr:S.hourN||0});if(S.mkEv.length>4)S.mkEv.length=4;}
const demandRatio=id=>clamp(S.macro*S.mkH[ITEMS[id].ci]*S.mkD[id]/S.mkS[id],0.3,3);
function fillProb(id,ask,cert){
  const it=ITEMS[id],ref=cert?Math.round(price(id)*cert.mult/10)*10:price(id);
  const m=ask/ref-1;
  let tol=0.116+0.25*Math.log(demandRatio(id))+cf('fmTol'),w=0.03,p0=FM_FILL[it.r]*cf('fmFill');
  if(cert){const b=cert.score-4;tol+=0.03*b;w+=0.008*b;p0*=1+0.04*b;}
  tol=clamp(tol,0,0.7);
  return clamp(p0/(1+Math.exp((m-tol)/w)),0,0.95);
}
function fmHour(){
  const g=cf('fmGamma'),k=cf('fmKappa'),vm=cf('fmVol'),sk=cf('fmShock'),mn=cf('mkMin'),mx=cf('mkMax');
  S.hourN=(S.hourN||0)+1;
  S.macro=clamp((S.macro||1)+(1-(S.macro||1))*0.01+rndn()*0.004*vm,0.5,2);
  for(let ci=0;ci<COLS.length;ci++){
    let hy=S.mkH[ci]||1;
    hy+=(1-hy)*0.06+rndn()*0.02*vm;
    if(Math.random()<0.012*sk){
      const hot=Math.random()<0.6;
      hy*=hot?1.25+Math.random()*0.35:0.6+Math.random()*0.2;
      if(unlocked(ci)) mkEvent(hot?'🔥 Cầu bộ '+COLS[ci].name+' tăng mạnh, giá đang lên':'🧊 Bộ '+COLS[ci].name+' nguội dần, giá có xu hướng giảm');
    }
    S.mkH[ci]=clamp(hy,0.4,2.5);
  }
  for(const it of ITEMS){
    const id=it.id;
    let s=S.mkS[id],d=S.mkD[id];
    s+=(1-s)*0.12+rndn()*0.03*vm; d+=(1-d)*0.08+rndn()*0.035*vm;
    if(Math.random()<0.010*sk) s*=1.3+Math.random()*0.6;
    if(Math.random()<0.010*sk) d*=1.3+Math.random()*0.7; else if(Math.random()<0.006*sk) d*=0.5+Math.random()*0.25;
    s=clamp(s,0.3,4);d=clamp(d,0.3,4);S.mkS[id]=s;S.mkD[id]=d;
    const T=it.anchor*Math.pow(S.macro*S.mkH[it.ci]*d/s,g);
    let pr=S.mkP[id];pr+=k*(T-pr);pr*=Math.exp(FM_SIG[it.r]*vm*rndn());
    S.mkP[id]=clamp(pr,it.anchor*Math.max(mn,FM_FLOOR[it.r]),it.anchor*mx);
  }
  COLS.forEach(c=>{const target=bagPrice(c.id)*Math.pow(S.macro*S.mkH[c.id],.65);S.bagP[c.id]=clamp((S.bagP[c.id]+.3*(target-S.bagP[c.id]))*Math.exp(rndn()*.025*vm),bagPrice(c.id)*.5,bagPrice(c.id)*3);});

}

  for(let i=0;i<3;i++) fmHour();
}

function chooseCustomerItems(c){
  if(!isStoreOpen())return false;
  const p=CUSTOMER_TYPES.find(p=>p.key===c.type),pool=shuffle(S.listings.filter(L=>L.qty>0));
  if(p.key==='collector')pool.sort((a,b)=>(b.kind==='bag')-(a.kind==='bag'));

  let remaining=Math.min(c.target,customerMax()),budget=c.budget;
  if(!c.vip&&Math.random()*100>=customerBuyRate())return false;
  for(const L of pool){
    if(!remaining||budget<L.ask)continue;
    const ref=listingRef(L);
    const acceptance=clamp(Math.exp(-p.sensitivity*Math.max(0,L.ask/ref-1)),0,1);
    if(!c.vip&&Math.random()>acceptance)continue;
    const qty=Math.min(L.qty,remaining,Math.floor(budget/L.ask));if(qty<1)continue;
    c.cart.push({...L,cert:L.cert?{...L.cert}:undefined,qty});

  }
  S.listings=S.listings.filter(L=>L.qty>0);

    S.sales.unshift({t:'Ngày '+S.day+' '+fmtClock(),kind:L.kind||'card',ci:L.ci,id:L.id,n:L.qty,net:Math.round(L.ask*L.qty*(1-CFG.SELL_FEE)),cost:Math.round((L.cost||0)*L.qty),cert:L.cert?L.cert.score:0});
  }
  recordShopSale(c.cart,total,net);
  S.sales.length=Math.min(12,S.sales.length);S.money+=net;S.day$.earned+=net;H.served++;
  logTx('Thanh toán '+c.name+' · '+qty+' món'+(automatic?' (tự động)':''),net);
  if(c.type==='regular'||Math.random()<.15){
    if(!H.regulars.some(r=>r.name===c.name&&r.face===c.face))H.regulars.push({name:c.name,face:c.face});

  }

function tickCustomers(dt){
  if(!S.dayStarted||S.closed||S.bankrupt)return;
  const H=S.customers;H.time+=dt;let changed=tickVisitors();changed=cameraSweep()||changed;
  if(isAcceptingCustomers()&&H.time>=H.next){
    H.next=H.time+(7+Math.random()*7)/(1+Math.min(S.hot||0,1000)/500);
    if(H.people.filter(c=>c.state!=='leaving').length<12){spawnCustomer();changed=true;}
  }
  for(const c of H.people.slice()){
    if(c.thief){
      const elapsed=H.time-c.since;
      if(c.state==='entering'&&elapsed>=c.duration){customerState(c,isStoreOpen()?'browsing':'leaving',isStoreOpen()?(3+Math.random()*4)*2:5);changed=true;}
      else if(c.state==='browsing'&&elapsed>=c.duration){stealBags(c);customerState(c,'leaving',5);changed=true;}
      else if(c.state==='leaving'&&elapsed>=c.duration){escapeThief(c);H.people=H.people.filter(x=>x.uid!==c.uid);changed=true;}
      continue;
    }
    const elapsed=H.time-c.since;
    if(c.state==='entering'&&elapsed>=c.duration){
      if(isStoreOpen())customerState(c,'browsing',3+Math.random()*4,'Để tôi chọn vài món…');
      else customerState(c,'leaving',2.5,'Cửa hàng đóng rồi, hẹn ngày mai.');changed=true;
    }else if(c.state==='browsing'&&elapsed>=c.duration){
      if(chooseCustomerItems(c))customerState(c,'toCheckout',2.5,'Tôi chọn xong rồi!');
      else customerState(c,'leaving',2.5,isStoreOpen()?'Hôm nay chưa tìm thấy món phù hợp.':'Hẹn cửa hàng ngày mai.');changed=true;
    }else if(c.state==='toCheckout'&&elapsed>=c.duration){
      customerState(c,'waiting',c.patience,'Thanh toán giúp tôi nhé!');changed=true;
      if(!H.auto)toast(c.face+' '+c.name+' đang chờ thanh toán');
    }else if(c.state==='waiting'&&elapsed>=c.patience){abandonCustomer(c);changed=true;}
    else if(c.state==='leaving'&&elapsed>=c.duration){finishCustomerExit(c);H.people=H.people.filter(x=>x.uid!==c.uid);changed=true;}
  }
  changed=tickLive()||changed;
  if(H.auto){const first=waitingCustomers()[0];if(first){checkoutCustomer(first.uid,true);changed=true;}}
  if(changed){ui.dirty=true;save();renderCheckoutShortcut();}
  updateCustomerUI(changed);
}
function customerPosition(c){
  const progress=clamp((S.customers.time-c.since)/Math.max(.1,c.duration),0,1),j=c.uid%4;
  if(c.thief&&c.state==='leaving'){const x=22+j*13,y=25+(j%2)*9;return [x+(48-x)*progress,y+(96-y)*progress];}
  if(c.state==='entering')return [48+(25-48)*progress,94+(28-94)*progress];
  if(c.state==='browsing')return [22+j*13,25+(j%2)*9];
  if(c.state==='toCheckout')return [35+(79-35)*progress,32+(70-32)*progress];
  if(c.state==='waiting'){const n=waitingCustomers().indexOf(c);return [Math.max(12,80-n*10),71];}
  if(c.state==='toLive')return [79+(22-79)*progress,71];
  if(LIVE_STATES.includes(c.state))return [Math.min(44,16+Math.max(0,liveWaiting().indexOf(c))*8),71];
  return [(c.liveResult?22:80)+(48-(c.liveResult?22:80))*progress,71+(96-71)*progress];
}

function askInfo(id,pc,cert,costOv){
  const ref=cert?certPrice(cert):price(id),ask=askOf(ref,pc),pr=fillProb(id,ask,cert),net=Math.round(ask*(1-CFG.SELL_FEE));
  const cost=costOv!=null?costOv:cert&&cert.cost!=null?cert.cost:S.cost[id]!=null?S.cost[id]:ref;
  return {ref,ask,p:pr,net,cost,pl:net-cost};

const chanceTxt=pr=>(pr>=0.25?'Cao':pr>=0.1?'Vừa':pr>=0.03?'Thấp':'Rất thấp')+' · '+(pr<0.005?'<1':Math.round(pr*100))+'% tham khảo';
const waitTxt=pr=>pr<0.01?'khó bán được':'trung bình ~'+Math.max(1,Math.round(1/pr))+' giờ game';
function listItem(id,qty,pc){

function cancelListing(uid){

/* --- chợ đen --- */
/* Shelf capacity counts individual units, including unpaid reservations. */
const shelfKind=L=>L.kind==='bag'?'bag':'card';
const shelfLimit=kind=>S.shelfSlots[kind==='bag'?'bags':'cards'];
function shelfCount(kind){
  return [...S.listings,...S.customers.people.flatMap(c=>c.cart||[])].reduce((n,L)=>n+(L.qty>0&&shelfKind(L)===kind?L.qty:0),0);
}
const shelfFree=kind=>Math.max(0,shelfLimit(kind)-shelfCount(kind));
const canShelf=(kind,id,qty=1)=>Number.isInteger(qty)&&qty>0&&qty<=shelfFree(kind);
const shelfFull=kind=>'Quầy '+(kind==='bag'?'túi mù':'thẻ')+' không đủ sức chứa. Còn '+shelfFree(kind)+' chỗ; nâng sức chứa thêm 12 với 150.000₫ hoặc gỡ bớt hàng.';
function shelfBar(kind){
  return '<div class="shelf-bar"><b>'+shelfCount(kind)+'/'+shelfLimit(kind)+' '+(kind==='bag'?'túi':'thẻ')+'</b><button class="chip" data-a="shelfUpgrade" data-kind="'+kind+'">Sức chứa +12 · 150.000₫</button></div><small class="shelf-note">Tính tổng từng túi/thẻ, không phân biệt loại. Hàng khách đang giữ được tính đến khi thanh toán để bảo đảm chỗ trả lại.</small>';
}
function normalizeShelfStock(state){
  let returned=0;
  for(const kind of ['bag','card']){
    const reserved=state.customers.people.reduce((n,c)=>n+(c.cart||[]).filter(L=>shelfKind(L)===kind).reduce((m,L)=>m+L.qty,0),0);
    let available=Math.max(0,state.shelfSlots[kind==='bag'?'bags':'cards']-reserved);
    for(const L of state.listings){
      if(shelfKind(L)!==kind)continue;
      const keep=Math.min(L.qty,available),extra=L.qty-keep;available-=keep;L.qty=keep;if(!extra)continue;returned+=extra;
      if(kind==='bag')addStock('bags',L.ci,extra,(L.cost||0)*extra,state);
      else if(L.cert)state.cert.push({uid:L.cert.uid,id:L.id,score:L.cert.score,mult:L.cert.mult,cost:L.cost,costEstimated:!!L.costEstimated});
      else{const old=state.inv[L.id]||0,cost=L.cost==null?state.mkP[L.id]:L.cost;state.cost[L.id]=old?((state.cost[L.id]??cost)*old+cost*extra)/(old+extra):cost;state.costEstimated[L.id]=old>0?!!state.costEstimated[L.id]||!!L.costEstimated:!!L.costEstimated;state.inv[L.id]=old+extra;state.disc[L.id]=1;}
    }
  }
  state.listings=state.listings.filter(L=>L.qty>0);
  if(returned){state.log.unshift({t:'Ngày '+state.day+' · '+fmtClock(state.clock),x:'Áp dụng sức chứa theo số lượng: '+returned+' món dư đã trả về Kho tồn / Túi',d:0});state.log=state.log.slice(0,30);}
}
function upgradeShelf(kind){
  if(kind!=='bag'&&kind!=='card')return 'Quầy không hợp lệ.';
  if(S.money<150000)return 'Không đủ 150.000₫ để nâng cấp.';
  S.money-=150000;S.shelfSlots[kind==='bag'?'bags':'cards']+=12;S.day$.spent+=150000;shopLedger().capex+=150000;
  logTx('Nâng cấp quầy '+(kind==='bag'?'túi mù':'thẻ')+' sức chứa +12',-150000);return '';
}
function genBM(){
  const un=unlockedCols(),rounds=[],offers=[],span=(CFG.BM_CLOSE-CFG.BM_OPEN)/3;
  for(let batch=0;batch<3;batch++){
    const appear=CFG.BM_OPEN+batch*span,end=CFG.BM_OPEN+(batch+1)*span;
    const round={batch,appear,end,offers:[]},used=new Set(),n=3+Math.floor(Math.random()*3);
    for(let k=0;k<n;k++){
      const pool=un.flatMap(ci=>COLS[ci].byR.slice(2).flat()).filter(id=>!used.has(id));
      const available=[2,3,4,5].filter(r=>pool.some(id=>ITEMS[id].r===r));
      if(!available.length)break;
      const rarity=available[pickW(available.map(r=>[60,28,10,2][r-2]),0)];
      const id=pick(pool.filter(id=>ITEMS[id].r===rarity));used.add(id);
      const offer={oid:S.day*100+batch*10+k,batch,id,price:Math.round(price(id)*(1-(.1+Math.random()*.2))/10)*10,qty:1,appear,end};
      round.offers.push(offer);offers.push(offer);
    }
    rounds.push(round);
  }
  S.bm={v:2,day:S.day,rounds,offers};
}
const bmCurrent=()=>S.bm&&S.bm.v===2&&S.bm.day===S.day?S.bm.rounds.find(r=>S.clock>=r.appear&&S.clock<r.end):null;
const bmActive=()=>{const round=bmCurrent();return isStoreOpen()&&S.lvl>=CFG.BM_LV&&round?round.offers.filter(o=>o.qty>0):[];};
function bmBuy(oid){
  if(!isStoreOpen())return {err:EVENT_CLOSED};
  const round=bmCurrent();
  if(S.lvl<CFG.BM_LV||!round)return {err:'Chợ đen chưa mở hoặc lượt này đã kết thúc.'};
  const o=round.offers.find(o=>o.oid===oid&&o.qty>0);
  if(!o)return {err:'Món hàng không thuộc lượt hiện tại hoặc đã hết hàng.'};
  if(S.money<o.price)return {err:'Không đủ tiền.'};
  S.money-=o.price;S.day$.spent+=o.price;o.qty=0;
  const isNew=giveItem(o.id,o.price);logTx('Săn chợ đen: '+ITEMS[o.id].n,-o.price);
  return {id:o.id,isNew};
}

/* --- đấu giá --- */
const BOTS=[
  {n:'Đối thủ A',t:'Nhát gan, hay bỏ cuộc sớm',p:.35,agg:.1,lo:.85,hi:1.05},
  {n:'Đối thủ B',t:'Tính toán, ra giá vừa phải',p:.55,agg:.25,lo:1.0,hi:1.25},
  {n:'Đối thủ C',t:'Liều lĩnh, hay đẩy giá mạnh',p:.75,agg:.5,lo:1.2,hi:1.6}
];
function genAuctions(){
  const un=unlockedCols(),times=[];
  while(times.length<3){const t=540+Math.floor(Math.random()*480);if(times.every(x=>Math.abs(x-t)>=60))times.push(t);}
  times.sort((a,b)=>a-b);
  const list=times.map(appear=>{
    const ci=pick(un),r=pickW([50,30,15,5],2),id=pick(COLS[ci].byR[r]);
    const mk=price(id),start=Math.max(5000,Math.round(mk*(0.6+Math.random()*0.15)/500)*500);
    const step=Math.max(1000,Math.round(start*0.05/500)*500);
    const fee=Math.max(5000,Math.round((0.05*mk+100*S.lvl+0.002*S.money)/500)*500);
    return {id,status:'wait',start,step,cur:start,holder:null,lastJump:1,fee,appear,busy:false,log:[],
      bots:BOTS.map(b=>({n:b.n,p:b.p,agg:b.agg,max:Math.round(mk*(b.lo+Math.random()*(b.hi-b.lo))/500)*500}))};
  });
  S.au={day:S.day,list};
}
function ensureEvents(){
  if(S.lvl>=CFG.BM_LV&&(!S.bm||S.bm.day!==S.day)) genBM();
  if(S.lvl>=CFG.AU_LV&&(!S.au||!S.au.list||S.au.day!==S.day)) genAuctions();
  if(S.lvl>=CFG.TRADE_LV&&(!S.trade||S.trade.day!==S.day)) genTrade();
}
function auSync(){
  if(!isStoreOpen())return;
  if(S.au&&S.au.list&&S.au.day===S.day) S.au.list.forEach(a=>{
    if(a.status==='wait'&&S.clock>=a.appear) a.status='open';
    if(a.status==='open'&&isOver()) a.status='missed';
  });
  tradeSync();
}
const AU=i=>S.au&&S.au.list&&S.au.day===S.day?S.au.list[i]:null;
function auNext(a){return a.holder===null?a.start:a.cur+a.step;}
function auJoin(i){
  if(!isStoreOpen())return EVENT_CLOSED;
  const a=AU(i);
  if(!a||a.status!=='open') return 'Phiên đấu giá chưa mở.';
  if(S.money<a.fee) return 'Không đủ tiền đóng phí tham gia.';
  S.money-=a.fee; S.day$.spent+=a.fee; a.status='joined';
  logTx('Phí tham gia đấu giá',-a.fee);

function auBid(i,j){
  if(!isStoreOpen())return EVENT_CLOSED;
  const a=AU(i); if(!a||a.status!=='joined'||a.busy) return 'Không thể ra giá lúc này.';
  const amt=auNext(a)+a.step*(j-1);
  if(S.money<amt) return 'Không đủ tiền để ra mức giá này.';
  a.cur=amt;a.holder='you';a.lastJump=j;
  a.log.unshift('Bạn ra giá '+fmt(amt)+' ₫');
  a.busy=true;
  return '';
}
function auResolve(i){
  if(!isStoreOpen())return;
  const a=AU(i); if(!a) return;
  a.busy=false;
  if(a.status!=='joined'||a.holder!=='you') return;
  const pen=Math.pow(0.75,a.lastJump-1);
  for(const bi of shuffle([0,1,2])){
    const b=a.bots[bi],bid=a.cur+a.step*(Math.random()<b.agg?2:1);
    if(bid<=b.max&&Math.random()<b.p*pen){
      a.cur=bid;a.holder=bi;a.log.unshift(b.n+' ra giá '+fmt(bid)+' ₫');
      return {counter:b.n};
    }
  }
  S.money-=a.cur; S.day$.spent+=a.cur; a.status='won';
  const isNew=giveItem(a.id,a.cur+(a.fee||0));
  logTx('Thắng đấu giá: '+ITEMS[a.id].n,-a.cur);
  a.log.unshift('Không ai theo giá — bạn thắng!');
  return {won:true,id:a.id,isNew};
}
function auLeave(i){
  const a=AU(i); if(!a||a.status!=='joined') return;
  a.status='lost'; a.log.unshift('Bạn bỏ cuộc. Phí tham gia không được hoàn lại.');
}
/* --- giao dịch NPC (cấp 40) --- */
const NPCS=[{n:'Bà Tám đồ cũ',e:'👵'},{n:'Anh Ba nhà giàu',e:'🧑‍💼'},{n:'Cô Hai sưu tầm',e:'👩‍🎨'},{n:'Chú Tư thợ săn',e:'🧔'},{n:'Thầy Bảy đồ cổ',e:'👴'},{n:'Bé Na thích đổi',e:'👧'},{n:'Cậu Chín lái buôn',e:'🧑‍🌾'}];
function genTrade(){
  const slots=[];
  while(slots.length<5){const t=540+Math.floor(Math.random()*660);if(slots.every(x=>Math.abs(x-t)>=60)) slots.push(t);}
  slots.sort((a,b)=>a-b);
  S.trade={day:S.day,slots,idx:-1,offers:[]};
}
function genOffers(){
  const un=unlockedCols(),n=1+Math.floor(Math.random()*3),out=[],used={};
  const owned=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&!isLocked(id));
  for(let j=0;j<n;j++){
    const cand=owned.filter(id=>!used[id]);
    if(!cand.length) break;
    const swapC=cand.filter(id=>ITEMS[id].r>=2);
    const swap=swapC.length>0&&Math.random()<0.5;
    const want=pick(swap?swapC:cand);used[want]=1;
    const npc=pick(NPCS);
    if(swap){
      const r=ITEMS[want].r;let give,t=0;
      do{give=pick(COLS[pick(un)].byR[r]);t++;}while(give===want&&t<10);
      out.push({oid:S.uid++,npc,type:'swap',give,want,status:'open'});
    }else{
      const bonus=0.05+Math.random()*0.25;
      out.push({oid:S.uid++,npc,type:'buy',want,bonus,price:Math.round(price(want)*(1+bonus)/10)*10,status:'open'});
    }
  }
  return out;
}
const tradeValid=o=>o.status==='open'&&(S.inv[o.want]||0)>0;
const tradeOpenN=()=>S.trade&&S.trade.day===S.day&&Array.isArray(S.trade.offers)?S.trade.offers.filter(tradeValid).length:0;
function tradeSync(){
  if(!isStoreOpen())return;
  const t=S.trade;if(!t||t.day!==S.day||!Array.isArray(t.offers)) return;
  let moved=false;
  while(t.idx<4&&S.clock>=t.slots[t.idx+1]){t.idx++;moved=true;}
  if(moved){t.offers.forEach(o=>{if(o.status==='open')o.status='expired';});t.offers=genOffers();}
  if(isOver()) t.offers.forEach(o=>{if(o.status==='open')o.status='expired';});
}
function acceptTrade(oid){
  if(!isStoreOpen())return {err:EVENT_CLOSED};
  const t=S.trade,o=t&&t.offers?t.offers.find(x=>x.oid===oid):null;
  if(!o||o.status!=='open') return {err:'Đề nghị này đã kết thúc.'};
  if(!(S.inv[o.want]>0)){o.status='expired';return {err:'Bạn không còn item mà NPC muốn nhận.'};}
  if(isLocked(o.want)) return {err:LOCK_MSG};
  const transferredCost=S.cost[o.want]||0,transferredEstimated=!!S.costEstimated[o.want];
  S.inv[o.want]--; if(S.inv[o.want]<=0) delete S.inv[o.want];
  o.status='done';
  if(o.type==='buy'){
    S.money+=o.price;if(S.day$)S.day$.earned+=o.price;
    logTx('NPC mua '+ITEMS[o.want].n+' (+'+Math.round(o.bonus*100)+'% so với thị trường)',o.price);
    return {buy:true,price:o.price,gain:o.price-price(o.want)};
  }
  const isNew=giveItem(o.give,transferredCost,transferredEstimated),pl=price(o.give)-price(o.want);
  logTx('Đổi '+ITEMS[o.want].n+' lấy '+ITEMS[o.give].n+' ('+(pl>=0?'lãi ':'lỗ ')+fmt(Math.abs(pl))+')',0);
  return {id:o.give,isNew,pl};
}

/* --- đu đỉnh (cấp 50): cược item cực hiếm trở lên, giá 6 giây tới tăng hay giảm --- */
const DD_STEPS=24,DD_MS=6000,DD_MAX=5;
function ddStart(id){
  if(!isStoreOpen())return EVENT_CLOSED;
  if(S.dd||!(S.inv[id]>0)||ITEMS[id].r<2) return 'Không thể cược item này.';
  if(isLocked(id)) return LOCK_MSG;
  if((S.ddCount||0)>=DD_MAX) return 'Hôm nay bạn đã đu đỉnh đủ '+DD_MAX+' lần.';
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const p0=price(id);
  S.ddCount=(S.ddCount||0)+1;
  const win=Math.random()*100<(S.ddWin==null?50:S.ddWin);
  S.dd={id,p0,p:[p0],path:ddPath(p0,win),win,steps:0,start:Date.now(),deadline:Date.now()+DD_MS};
  S.ddLast=null;
  return '';
}
function ddPath(p0,win){
  const N=DD_STEPS,lw=[0];let w=0;
  for(let i=1;i<=N;i++){w+=(Math.random()-0.5)*0.014;lw.push(w);}
  const target=(win?1:-1)*(0.002+Math.random()*0.01);
  return lw.map((v,i)=>Math.max(10,p0*Math.exp(v+(target-lw[N])*(i/N))));
}
function ddStep(){
  const d=S.dd,cur=d.p[d.p.length-1];
  d.p.push(d.path&&d.path[d.p.length]!==undefined?d.path[d.p.length]:Math.max(10,cur*(1+(Math.random()-0.5)*0.014)));d.steps++;
}
function ddResolve(){
  const d=S.dd; while(d.steps<DD_STEPS) ddStep();
  const end=d.p[d.p.length-1],val=Math.round(d.p0/10)*10,up=end>d.p0,down=end<d.p0;
  if(!down) S.inv[d.id]=(S.inv[d.id]||0)+1;
  if(up){S.money+=val;S.day$.earned+=val;logTx('Đu đỉnh thắng: '+ITEMS[d.id].n,val);}
  else if(down) logTx('Đu đỉnh thua: mất '+ITEMS[d.id].n+' (giá trị '+fmt(val)+')',0);
  else logTx('Đu đỉnh hòa: giữ lại '+ITEMS[d.id].n,0);
  S.ddLast={id:d.id,val,up,down,p0:d.p0,end};
  S.dd=null;
}

/* --- ngân hàng (từ ngày 5) --- */
const pp=r=>(r*100).toFixed(2).replace('.',',')+'%';
const loanRate=amt=>.08-(amt-500000)/4500000*.05;
function loanCalc(t,rate){rate=rate==null?loanRate(t.amt):rate;const total=Math.round(t.amt*(1+rate));return {rate,total,daily:Math.ceil(total/t.days)};}
function takeLoan(amt,days){
  if(S.lvl<CFG.BANK_LV)return 'Ngân hàng chưa mở.';
  if(!Number.isSafeInteger(amt)||amt<500000||amt>5000000||amt%50000||!Number.isInteger(days)||days<5||days>20)return 'Khoản vay không hợp lệ.';
  if(S.loans.length>=2)return 'Tối đa 2 khoản vay đang hoạt động. Hãy tất toán trước.';
  const c=loanCalc({amt,days});let tier=S.uid++;while(S.loans.some(l=>l.tier===tier))tier=S.uid++;
  S.loans.push({tier,rate:c.rate,principal:amt,term:days,total:c.total,daily:c.daily,remaining:c.total,left:days,borrowedDay:S.day,dueDay:S.day+1,interestMode:'total'});
  S.money+=amt;logTx('Vay ngân hàng '+fmt(amt)+' ₫ ('+days+' kỳ, lãi toàn khoản '+pp(c.rate)+', trả từ cuối ngày '+(S.day+1)+')',amt);return '';
}
function repayLoan(k){
  const i=S.loans.findIndex(l=>l.tier===k); if(i<0) return 'Không có khoản vay.';
  const L=S.loans[i]; if(S.money<L.remaining) return 'Không đủ tiền để trả hết nợ.';
  S.money-=L.remaining; logTx('Trả hết nợ ngân hàng',-L.remaining); S.loans.splice(i,1);
  return '';
}
function collect(need){
  const out={seized:[],credit:0};
  const c=Math.min(S.money,need);S.money-=c;need-=c;
  if(need>0){
    const units=[];
    for(const k in S.inv) for(let i=0;i<S.inv[k];i++) units.push({t:'i',id:+k,v:price(+k),lk:isLocked(+k)});
    (S.cert||[]).forEach(x=>units.push({t:'c',uid:x.uid,id:x.id,v:certPrice(x),lk:false}));
    for(const lockedPass of [false,true]){
      const pool=units.filter(u=>u.lk===lockedPass);
      while(need>0&&pool.length){
        pool.sort((a,b)=>a.v-b.v);
        let idx=pool.findIndex(u=>u.v>=need); if(idx<0) idx=pool.length-1;
        const u=pool.splice(idx,1)[0];
        if(u.t==='i'){S.inv[u.id]--;if(S.inv[u.id]<=0)delete S.inv[u.id];}
        else S.cert=S.cert.filter(x=>x.uid!==u.uid);
        out.seized.push(u.id); need-=u.v;
        if(need<0){S.money+=-need;out.credit+=-need;need=0;}
      }
    }
  }
  out.short=need;
  return out;
}
function settleLoans(){
  const res={paid:0,seized:[]};
  if(!S.loans||!S.loans.length) return res;
  for(const L of S.loans.slice()){
    if(S.day<(L.dueDay==null?S.day:L.dueDay))continue;
    const pay=L.left<=1?L.remaining:Math.min(L.daily,L.remaining);
    if(S.money<pay&&S.safe>0){S.money+=S.safe;S.safe=0;}
    const r=collect(pay);
    const applied=pay-r.short;
    L.remaining-=applied; L.left--; L.dueDay=S.day+1; res.paid+=applied; res.seized.push(...r.seized);
    logTx('Trả nợ ngân hàng'+(r.seized.length?' (gán nợ '+r.seized.length+' item)':''),-applied);
    if(r.short>0){S.bankrupt=true;break;}
    if(L.remaining<=0) S.loans.splice(S.loans.indexOf(L),1);
  }
  return res;
}

/* --- thẩm định (từ ngày 16): chỉ số hoàn hảo x/10đ --- */
const AP_FEE=30000,AP_SLOTS=3,AP_W=[45,30,17,8];   /* trọng số: 7,x | 8,x | 9,x | 10,0 */
const scoreTxt=s=>(+s).toFixed(1).replace('.',',');
const AP_MID={7:2.55,8:3.3,9:4.5,10:11.25};
function apMult(sc){
  if(sc>=10) return Math.round((7.5+Math.random()*7.5)*100)/100;
  const lo=Math.floor(sc),f=sc-lo,a=AP_MID[lo],b=AP_MID[lo+1];
  return Math.round((a+(b-a)*f)*(0.92+Math.random()*0.16)*100)/100;
}
const AP_BOOST=1.5;
const AP_M=[[1.05,1.25],[1.2,1.5],[1.5,1.9],[1.9,2.5],[2.5,3.5],[5,10]].map(r=>r.map(v=>Math.round(v*AP_BOOST*100)/100)); /* hệ số giá theo điểm 5..10, đã nhân AP_BOOST */
const certPrice=c=>Math.round(price(c.id)*c.mult/10)*10;
const apReady=a=>a.day<S.day;
const apUsed=()=>S.appr.filter(a=>a.day===S.day).length+S.godAppr.filter(a=>a.day===S.day).length;
function apSubmit(id){
  if(S.lvl<CFG.APPRAISE_LV) return 'Thẩm định chưa mở.';
  if(apUsed()>=AP_SLOTS) return 'Hôm nay đã hết slot thẩm định.';
  if(!(S.inv[id]>0)||ITEMS[id].r<3) return 'Item không hợp lệ.';
  if(isLocked(id)) return LOCK_MSG;
  if(S.money<AP_FEE) return 'Không đủ tiền phí thẩm định.';
  S.money-=AP_FEE; S.day$.spent+=AP_FEE;
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const aw=cf('apW'),bk=pickW(aw&&aw.length===4?aw:AP_W,7),score=bk>=10?10:Math.min(9.9,Math.round((bk+Math.random())*10)/10);
  const cst=(S.cost[id]!=null?S.cost[id]:price(id))+AP_FEE;
  S.appr.push({uid:S.uid++,id,day:S.day,score,boost:1,cost:cst,costEstimated:!!S.costEstimated[id],mult:apMult(score)});
  logTx('Gửi thẩm định '+ITEMS[id].n,-AP_FEE);
  return '';
}
function apCollect(uid,force){
  const i=S.appr.findIndex(a=>a.uid===uid);
  if(i<0||(!force&&!apReady(S.appr[i]))) return null;
  const a=S.appr.splice(i,1)[0];
  if(!a.boost) a.mult=Math.round(a.mult*AP_BOOST*100)/100;
  S.cert.push({uid:a.uid,id:a.id,score:a.score,mult:a.mult,cost:a.cost!=null?a.cost:price(a.id),costEstimated:!!a.costEstimated});
  logTx('Nhận kết quả thẩm định '+ITEMS[a.id].n+': '+scoreTxt(a.score)+'/10đ',0);
  return S.cert[S.cert.length-1];
}

  S.duels.used={arena:0,legend:0};planVisitors();
  S.ddCount=0;S.bm=null;S.au=null;S.trade=null;ensureEvents();

  S.customers.people.forEach(c=>{if(c.thief)escapeThief(c);else{restoreCustomerCart(c);finishCustomerExit(c);}});S.customers.people=[];

  const d=S.day$;

ICONS.supply=ICONS.bag;
const TABS=[['market','Sự kiện'],['community','Cộng đồng'],['shop','Cửa hàng'],['kho','Kho tồn'],['char','Nhân vật']];
function renderNav(){
  const e=evActive(),anyEv=e.bm||e.au||e.tr||e.dd||e.ap;
  $('#nav').innerHTML=TABS.map(([k,t])=>{
    const dot=k==='market'&&(e.bm||e.au||e.tr||e.dd)||k==='community'&&e.ap;
    return '<button class="'+((ui.tab===k||(k==='shop'&&ui.tab==='supply'))?'on':'')+(k==='shop'?' nav-shop':'')+'" data-a="nav" data-k="'+k+'" aria-label="'+t+(dot?' (có thông báo)':'')+'">'+ICONS[k]+'<span>'+t+'</span>'+(dot?'<i class="ev"></i>':'')+'</button>';
  }).join('');
}
function marketNews(){
  let best=null,worst=null;
  for(const ci of unlockedCols()) for(let r=1;r<6;r++) for(const id of COLS[ci].byR[r]){
    const pc=pct(id);
    if(!best||pc>best.pc) best={id,pc};
    if(!worst||pc<worst.pc) worst={id,pc};
  }
  const out=[];
  if(best&&best.pc>=25) out.push({t:'📈 Giá tăng mạnh: '+ITEMS[best.id].e+' '+ITEMS[best.id].n+' +'+Math.round(best.pc)+'%',go:'kho'});
  if(worst&&worst.pc<=-25) out.push({t:'📉 Giá giảm sâu: '+ITEMS[worst.id].e+' '+ITEMS[worst.id].n+' −'+Math.abs(Math.round(worst.pc))+'%',go:'kho'});
  return out;
}
function feedLines(){
  const L=[];
  if(S.news.length) L.push({t:S.news[0].x,go:'kho'});
  if(isOver()) L.push({t:'🌙 Hết giờ hoạt động. Hãy kết thúc ngày.',go:'char'});
  if(S.lvl>=CFG.BM_LV&&!isOver()){
    if(S.clock<CFG.BM_OPEN) L.push({t:'🕶️ Chợ đen sắp mở lúc '+fmtClock(CFG.BM_OPEN)+' (còn '+fmtDur(CFG.BM_OPEN-S.clock)+')',go:'bm'});
    else if(S.clock<CFG.BM_CLOSE){const n=bmActive().length;L.push({t:n?'🕶️ Chợ đen đang mở · '+n+' món hàng':'🕶️ Chợ đen đang chờ hàng về',go:'bm'});}
  }
  if(S.lvl>=CFG.TRADE_LV&&!isOver()&&S.trade&&S.trade.day===S.day&&Array.isArray(S.trade.offers)){
    const n=tradeOpenN();
    if(n>0) L.push({t:'🤝 '+n+' NPC đang chờ giao dịch với bạn',go:'tr'});
    else if(S.trade.idx<4) L.push({t:'🤝 Còn '+(4-S.trade.idx)+' lượt NPC sắp đến',go:'tr'});
  }
  if(S.lvl>=CFG.AU_LV&&S.au&&S.au.list&&S.au.day===S.day){
    const op=S.au.list.filter(a=>a.status==='open'||a.status==='joined').length,wt=S.au.list.filter(a=>a.status==='wait').length;
    if(op) L.push({t:'🔨 '+op+' phiên đấu giá đang mở',go:'au'});
    else if(wt&&!isOver()) L.push({t:'🔨 Còn '+wt+' phiên đấu giá sắp xuất hiện',go:'au'});
  }
  if(S.lvl>=CFG.DD_LV&&S.dd) L.push({t:'📈 Đang đu đỉnh '+ITEMS[S.dd.id].e+' '+ITEMS[S.dd.id].n,go:'dd'});
  if(S.lvl>=CFG.APPRAISE_LV&&(S.appr.some(apReady)||S.godAppr.some(apReady))) L.push({t:'🔬 Có kết quả thẩm định đang chờ bạn',go:'ap'});
  if(S.mkEv[0]&&(S.hourN-S.mkEv[0].hr)<=10) L.push({t:S.mkEv[0].x,go:'kho'});
  {const ix=marketIndex();L.push({t:'📊 Thị trường hôm nay '+(ix>=0?'▲ +':'▼ ')+Math.abs(ix).toFixed(1).replace('.',',')+'%',go:'kho'});}
  marketNews().forEach(x=>L.push(x));
  if(!isOver()) L.push({t:'⏰ Kết thúc ngày lúc 21:00 (còn '+fmtDur(CFG.DAY_END-S.clock)+')',go:''});
  if(!L.length) L.push({t:'📭 Hiện chưa có sự kiện nào',go:''});
  return L;
}
function renderTop(){
  const over=isOver(),max=S.lvl>=CFG.MAX_LV,pm=S.clock>=720;
  $('#top').innerHTML='<div class="game-header">'+
    '<button class="gear" data-a="nav" data-k="sys" aria-label="Hệ thống">'+ICONS.sys+'</button>'+
    '<button class="clock'+(over?' over':'')+'" data-a="'+(!S.dayStarted&&!S.closed&&!over?'beginDay':'endDayAsk')+'" aria-label="'+(over?'Hãy kết thúc ngày':'Kết thúc ngày')+'"'+(over?' aria-live="polite"':'')+'>'+
    (over?'<span class="end-warning" aria-hidden="true">⚠️</span><span class="end-label">HÃY KẾT THÚC NGÀY</span>':'<span class="ck-d">Ngày '+S.day+'</span><span id="ck">'+fmtClock()+'</span><span class="day-icon" role="img" aria-label="'+(pm?'PM':'AM')+'">'+(pm?'🌙':'☀️')+'</span>')+'</button>'+
    '<button class="header-wallet" data-a="nav" data-k="char" aria-label="Nhân vật, cấp '+S.lvl+', '+fmt(S.money)+' đồng"><span class="lvb">LV '+S.lvl+(max?' MAX':'')+'</span><span class="cash">'+fmt(S.money)+'<small>₫</small></span></button></div>'+(!S.dayStarted&&!S.closed&&!over?'<button class="btn primary begin-day" data-a="beginDay">▶ BẮT ĐẦU NGÀY '+S.day+'</button>':'');
}
function seg(tab,items){
  return '<div class="seg" role="tablist">'+items.map(([k,t,lock,dot])=>'<button role="tab" class="'+(ui.sub[tab]===k?'on':'')+'" data-a="sub" data-t="'+tab+'" data-k="'+k+'">'+t+(lock?'<span class="lk">🔒'+lock+'</span>':'')+(!lock&&dot?'<span class="ev" title="Đang có sự kiện"></span>':'')+'</button>').join('')+'</div>';
}

/* ============ GIAO DIỆN: CÁC VIEW ============ */
function evActive(){
  const au=S.au&&S.au.list&&S.au.day===S.day?S.au.list.some(a=>a.status==='open'||a.status==='joined'):false;
  return {
    bm:S.lvl>=CFG.BM_LV&&bmActive().length>0,
    au:isStoreOpen()&&S.lvl>=CFG.AU_LV&&au,
    tr:isStoreOpen()&&S.lvl>=CFG.TRADE_LV&&tradeOpenN()>0,
    dd:isStoreOpen()&&S.lvl>=CFG.DD_LV&&!!S.dd,
    ap:S.lvl>=CFG.APPRAISE_LV&&(S.appr.some(apReady)||S.godAppr.some(apReady))
  };
}
const MK_SUBS=['bm','au','dd','arena','legend'],CM_SUBS=['bank','ap'];
function viewMarket(){
  const ev=evActive(),inC=ui.tab==='community';
  const sub=inC?(ui.last.community||'bank'):(ui.last.market||'bm');
  ui.sub.market=sub;
  const head=inC?seg('market',[
    ['bank','Ngân hàng',S.lvl<CFG.BANK_LV?'Cấp '+CFG.BANK_LV:0],
    ['ap','Thẩm định',S.lvl<CFG.APPRAISE_LV?'Cấp '+CFG.APPRAISE_LV:0,ev.ap]]):seg('market',[
    ['bm','Chợ đen',S.lvl<CFG.TRADE_LV?'Cấp '+CFG.TRADE_LV:0,ev.bm||ev.tr],
    ['au','Đấu giá',S.lvl<CFG.AU_LV?'Cấp '+CFG.AU_LV:0,ev.au],
    ['dd','Đu đỉnh',S.lvl<CFG.DD_LV?'Cấp '+CFG.DD_LV:0,ev.dd],['arena','Đấu trường',S.lvl<40?'Cấp 40':0],['legend','Thách đấu',S.lvl<50?'Cấp 50':0]]);
  if(!inC&&!isStoreOpen())return head+'<div class="card empty"><b>'+(!S.dayStarted&&!isOver()?'Đang chuẩn bị mở cửa':'Cửa hàng đã hết giờ hoạt động')+'</b>'+(!S.dayStarted&&!isOver()?'Kiểm tra kho và đăng bán vật phẩm, rồi bấm BẮT ĐẦU NGÀY '+S.day+' để mở các sự kiện.':'Sự kiện hoạt động từ 08:00 đến 21:00. Bạn vẫn có thể quản lý kho, đăng bán và dùng các mục Cộng đồng.')+'</div>';
  if(sub==='arena'||sub==='legend')return head+viewDuel(sub);
  if(sub==='au') return head+viewAU();
  if(sub==='dd') return head+viewDD();
  if(sub==='bank') return head+viewBank();
  if(sub==='ap') return head+viewAppraise();
  const inner=seg('bmx',[['tr','Giao dịch đen',S.lvl<CFG.TRADE_LV?'Cấp '+CFG.TRADE_LV:0,ev.tr],['bm','Chợ đen',S.lvl<CFG.BM_LV?'Cấp '+CFG.BM_LV:0,ev.bm]]);
  return head+inner+(ui.sub.bmx==='bm'?viewBM():viewTrade());
}
function viewAppraise(){
  if(S.lvl<CFG.APPRAISE_LV) return lockedCard('Thẩm định',CFG.APPRAISE_LV,'Chuyên gia chấm chỉ số hoàn hảo x/10đ cho item của bạn.');
  const used=apUsed();
  let h='<div class="card"><h3>Thẩm định · chỉ số hoàn hảo</h3><p class="muted" style="margin:0">Gửi item từ cực hiếm trở lên cho chuyên gia chấm điểm từ 7,0 đến 10đ (có số lẻ). Điểm càng cao, giá item càng tăng so với giá thị trường (10đ có thể gấp '+String(AP_M[5][0]).replace('.',',')+' đến '+AP_M[5][1]+' lần). Phí '+fmt(AP_FEE)+' ₫ mỗi item, thẩm định mất 1 ngày, mỗi ngày có '+AP_SLOTS+' slot.</p>'+
   '<div class="kv" style="margin-top:8px"><span>Slot hôm nay</span><b>'+used+'/'+AP_SLOTS+'</b></div></div>';
  if(S.appr.length){
    h+='<div class="card"><h3>Đang gửi thẩm định</h3>'+(S.admin&&S.appr.some(a=>!apReady(a))?'<button class="btn block" style="margin-bottom:10px" data-a="apCollectAll">Admin · Nhận tất cả kết quả ngay</button>':'')+S.appr.map(a=>{
      const it=ITEMS[a.id],ok=apReady(a);
      return '<div class="offer"><div class="tile static r'+it.r+'" style="width:74px;min-height:74px"><span class="t-e">'+it.e+'</span></div><div class="oi"><b>'+it.n+'</b><div class="muted">'+(ok?'Đã có kết quả':'Gửi ngày '+a.day+' · trả kết quả ngày '+(a.day+1))+'</div></div>'+
       (ok?'<button class="btn primary" data-a="apCollect" data-uid="'+a.uid+'">Nhận kết quả</button>':(S.admin?'<button class="btn" data-a="apCollect" data-uid="'+a.uid+'" data-now="1">Nhận ngay</button>':'<span class="muted">Đang chấm…</span>'))+'</div>';
    }).join('')+'</div>';
  }
  h+=godAppraisalHTML();
  const cand=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&ITEMS[id].r>=3).sort((a,b)=>price(b)-price(a));
  if(used>=AP_SLOTS) return h+'<div class="card empty"><b>Đã hết slot hôm nay</b>Mỗi ngày game được gửi tối đa '+AP_SLOTS+' item. Hẹn bạn ngày mai.</div>';
  if(!cand.length&&Object.values(S.godCards).some(n=>n>0))return h;
  if(!cand.length) return h+'<div class="card empty"><b>Chưa có item để thẩm định</b>Bạn cần có item từ cực hiếm trở lên.</div>';
  return h+'<div class="card"><h3>Chọn item để thẩm định</h3><div class="tiles">'+cand.map(id=>{
    const it=ITEMS[id];
    return '<button class="tile r'+it.r+(isLocked(id)?' dim':'')+'" data-a="apAsk" data-id="'+id+'">'+(isLocked(id)?'<span class="t-lk">🔒</span>':'')+'<span class="t-e">'+it.e+'</span><span class="t-n">'+it.n+'</span><span class="t-q">×'+S.inv[id]+'</span><span class="t-d">'+fmt(price(id))+' ₫</span></button>';
  }).join('')+'</div></div>';
}
function certTile(c){
  const it=ITEMS[c.id];
  return '<button class="tile r'+it.r+'" data-a="cert" data-uid="'+c.uid+'"><span class="t-e">'+it.e+'</span><span class="t-n">'+it.n+'</span><span class="t-q">'+scoreTxt(c.score)+'/10đ</span><span class="t-d up">'+fmt(certPrice(c))+' ₫</span></button>';
}
function sTile(id,extra){
  const it=ITEMS[id];
  return '<div class="tile static r'+it.r+'"><span class="t-e">'+it.e+'</span><span class="t-n">'+it.n+'</span>'+(extra||'')+'</div>';
}
function viewTrade(){
  if(S.lvl<CFG.TRADE_LV) return lockedCard('Giao dịch đen',CFG.TRADE_LV,'NPC đến đổi item hoặc hỏi mua item của bạn, 5 lượt mỗi ngày.');
  const t=S.trade&&S.trade.day===S.day&&Array.isArray(S.trade.offers)?S.trade:null;
  if(t) t.offers.forEach(o=>{if(o.status==='open'&&!((S.inv[o.want]||0)>0))o.status='expired';});
  const intro='<div class="card"><h3>Giao dịch đen</h3><p class="muted" style="margin:0">Mỗi ngày có 5 lượt. Mỗi lượt có từ 1 đến 3 NPC xuất hiện: hoặc đề nghị đổi item của họ lấy một item tương tự bạn đang sở hữu, hoặc hỏi mua một item của bạn với giá tốt hơn thị trường 5% đến 30%. Đồng ý thì xác nhận, không thì bỏ qua.</p><div class="chips" style="margin-top:10px">'+[0,1,2,3,4].map(i=>'<span class="chip'+(t&&t.idx>=i?' on':'')+'">Lượt '+(i+1)+'</span>').join('')+'</div></div>';
  if(!t||t.idx<0) return intro+'<div class="card empty"><b>'+(isOver()?'Hôm nay không còn NPC nào':'<span class="pulse"></span>Chưa có NPC nào')+'</b>'+(isOver()?'Hẹn bạn vào ngày mai.':'Lượt đầu tiên sẽ xuất hiện ngẫu nhiên trong ngày.')+'</div>';
  if(!t.offers.length) return intro+'<div class="card empty"><b>Lượt '+(t.idx+1)+': chưa có NPC nào đến</b>NPC chỉ trao đổi hoặc mua item bạn đang có và chưa khoá.</div>';
  let h=intro;
  t.offers.forEach(o=>{
    const wv=price(o.want),have=S.inv[o.want]||0;
    h+='<div class="card"><div class="npc"><span class="face">'+o.npc.e+'</span><div><b style="font-family:var(--fd);font-size:18px">'+o.npc.n+'</b><div class="muted">Lượt '+(t.idx+1)+'/5 · '+(o.type==='buy'?'muốn mua item của bạn':'muốn đổi item')+'</div></div></div>';
    if(o.type==='buy'){
      h+='<div class="pair"><div><h4>NPC muốn mua</h4>'+sTile(o.want,'<span class="t-q">×'+have+'</span><span class="t-d">'+fmt(wv)+' ₫</span>')+'</div><div style="display:grid;align-content:center;text-align:center"><h4>NPC trả</h4><b style="font-family:var(--fd);font-size:20px" class="up">'+fmt(o.price)+' ₫</b><small>+'+Math.round(o.bonus*100)+'% so với thị trường</small></div></div>';
    }else{
      const gv=price(o.give),pl=gv-wv;
      h+='<div class="pair"><div><h4>NPC đưa bạn</h4>'+sTile(o.give,'<span class="t-d">'+fmt(gv)+' ₫</span>')+'</div><div><h4>Bạn đưa lại</h4>'+sTile(o.want,'<span class="t-q">×'+have+'</span><span class="t-d">'+fmt(wv)+' ₫</span>')+'</div></div><div class="kv"><span>Lãi/lỗ dự kiến (theo giá thị trường)</span><b class="'+(pl>=0?'up':'dn')+'">'+sgn(pl)+' ₫</b></div>';
    }
    if(o.status==='open'){
      h+=(isLocked(o.want)?'<p class="muted" style="margin:8px 0 0">Item này đang bị khoá nên không thể giao dịch. <button class="chip" data-a="lockPrompt" data-id="'+o.want+'">Mở khoá</button></p>':'')+
       '<div class="btnrow"><button class="btn" data-a="tradeSkip" data-oid="'+o.oid+'">Bỏ qua</button><button class="btn primary" data-a="tradeAsk" data-oid="'+o.oid+'"'+(isLocked(o.want)?' disabled':'')+'>'+(o.type==='buy'?'Đồng ý bán':'Đồng ý đổi')+'</button></div>';
    }else h+='<p style="margin:8px 0 0"><b>'+(o.status==='done'?'Đã giao dịch xong.':o.status==='skipped'?'Bạn đã bỏ qua.':'NPC đã rời đi.')+'</b></p>';
    h+='</div>';
  });
  return h;
}
function ddBox(){
  const d=S.dd,it=ITEMS[d.id],cur=d.p[d.p.length-1],ch=(cur/d.p0-1)*100;
  const left=Math.max(0,Math.ceil((d.deadline-Date.now())/1000));
  const mn=Math.min(...d.p,d.p0),mx=Math.max(...d.p,d.p0),rg=(mx-mn)||1;
  const pts=d.p.map((v,i)=>(i/DD_STEPS*300).toFixed(1)+','+(86-(v-mn)/rg*80).toFixed(1)).join(' ');
  const base=(86-(d.p0-mn)/rg*80).toFixed(1),col=cur>=d.p0?'var(--good)':'var(--bad)';
  return '<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · đang cược</div></div></div>'+
   '<div class="kv"><span>Giá lúc đặt cược</span><b>'+fmt(d.p0)+' ₫</b></div><div class="kv"><span>Giá hiện tại</span><b style="color:'+col+'">'+fmt(cur)+' ₫ '+(ch>=0?'▲':'▼')+' '+Math.abs(ch).toFixed(2)+'%</b></div><div class="kv"><span>Còn lại</span><b>'+left+' giây</b></div>'+
   '<svg class="spark" viewBox="0 0 300 92" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="300" y1="'+base+'" y2="'+base+'" stroke="var(--line)" stroke-dasharray="4 4"/><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>'+
   '<p class="muted" style="margin:0">Cuối 6 giây, giá cao hơn lúc đặt cược thì bạn nhận tiền thưởng bằng giá trị item và giữ lại item. Giá thấp hơn thì mất item.</p>';
}
function updateDD(){const el=$('#ddbox');if(el&&S.dd)el.innerHTML=ddBox();}
function viewDD(){
  if(S.lvl<CFG.DD_LV) return lockedCard('Đu đỉnh',CFG.DD_LV,'Cược item hiếm trở lên theo biến động giá trong 6 giây.');
  const intro='<div class="card"><h3>Đu đỉnh</h3><p class="muted" style="margin:0">Đặt cược một item từ hiếm trở lên. Nếu giá item tăng trong 6 giây tới, bạn nhận tiền thưởng bằng giá trị item và giữ lại item. Nếu giá giảm, bạn mất item đó.</p></div>';
  if(S.dd) return intro+'<div class="card" id="ddbox">'+ddBox()+'</div>';
  let h=intro+'<div class="card" style="padding:10px 14px"><div class="kv" style="border:0;padding:2px 0"><span>Lượt đu đỉnh hôm nay</span><b>'+(S.ddCount||0)+'/'+DD_MAX+'</b></div></div>';
  if(S.ddLast){
    const r=S.ddLast,it=ITEMS[r.id];
    h+='<div class="card"><h3>Kết quả gần nhất</h3><div class="kv"><span>'+it.e+' '+it.n+'</span><b class="'+(r.up?'up':r.down?'dn':'')+'">'+(r.up?'Thắng +'+fmt(r.val)+' ₫':r.down?'Thua, mất item':'Hòa, giữ item')+'</b></div></div>';
  }
  const cand=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&ITEMS[id].r>=2).sort((a,b)=>price(b)-price(a));
  if((S.ddCount||0)>=DD_MAX) return h+'<div class="card empty"><b>Đã hết lượt hôm nay</b>Mỗi ngày game được đu đỉnh tối đa '+DD_MAX+' lần. Hẹn bạn ngày mai.</div>';
  if(!cand.length) return h+'<div class="card empty"><b>Chưa có item để cược</b>Bạn cần có item từ hiếm trở lên.</div>';

    });

  }

}

function renderView(){
  const m=$('#main'),keep=m.scrollTop;
  m.innerHTML=(ui.tab==='market'||ui.tab==='community')?viewMarket():(ui.tab==='shop'||ui.tab==='supply')?viewShopTab():ui.tab==='kho'?viewKho():ui.tab==='char'?viewChar():viewSys();
  m.scrollTop=keep;
  if(ui.adminOpen&&S.adminCard)showAdminCard();
  renderCheckoutShortcut();
  const on=m.querySelector('.seg button.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({inline:'center',block:'nearest'});m.scrollTop=keep;}catch(e){}
}
function renderCheckoutShortcut(){
  let button=$('#checkout-shortcut');
  if(!button){button=document.createElement('button');button.id='checkout-shortcut';button.className='checkout-shortcut';button.dataset.a='nav';button.dataset.k='shop';document.body.appendChild(button);}
  const n=waitingCustomers().length;button.hidden=ui.screen!=='game'||!n||ui.tab==='shop';button.textContent='🧾 '+n+' khách chờ thanh toán';
}
function refresh(){renderTop();renderNav();renderView();}
function after(){
  S.stats.peak=Math.max(S.stats.peak,S.money);
  save();refresh();
}

function showReveal(o){
  if(o.kind==='trash'){showTrashReveal(o,o.actions||'');return;}
  if(o.kind==='god'){showGodReward(o,o.actions||'');return;}
  const it=ITEMS[o.id],ci=it.ci,c=COLS[ci];
  const burst=it.r>=3?'<div class="burst">'+Array.from({length:18},(_,i)=>'<i style="--a:'+(i*20)+'deg;--d:'+(110+(i%3)*30)+'px"></i>').join('')+'</div>':'';
  const acts=o.actions||'',bagFrame=o.art?.frame||'';
  openModal('<div class="rv r'+it.r+'" id="rv">'+
   '<div class="rv-stage" data-a="rvSkip">'+(o.bag?'<div class="rv-bag">'+(bagFrame?'<div class="special-bag-preview '+bagFrame+'">':'')+bagSVG((o.art||c).hue,(o.art||c).icon,150)+(bagFrame?'</div>':'')+'</div>':'')+
   '<div class="rv-card"><span class="rv-rar">'+RAR[it.r]+'</span><div class="rv-e">'+it.e+'</div><div class="rv-n">'+it.n+'</div>'+
   '<div class="rv-meta">'+c.name+(o.isNew?' · <b class="new">MỚI</b>':'')+'</div>'+(o.xp?'<div class="rv-xp">+'+o.xp+' XP</div>':'')+(o.note?'<div class="rv-meta">'+o.note+'</div>':'')+'</div>'+burst+
   (o.bag?'<div class="rv-hint">Chạm để mở nhanh</div>':'')+'</div>'+
   '<div class="rv-actions">'+acts+'</div></div>','reveal');
  const el=$('#rv');
  const openRv=()=>{const e=$('#rv');if(e&&!e.classList.contains('open')){e.classList.add('open');sfxRare(it.r);}};
  if(o.bag&&!reduceMotion()){el.classList.add('shake');sfx('shake');setTimeout(openRv,780);}
  else setTimeout(openRv,60);
}
function tear1(ci){
  const res=openBag(ci); if(!res){closeModal();return;}
  const left=S.bags[ci]||0;
  showReveal({...res,ci,id:res.id,bag:true,isNew:res.isNew,xp:res.xp,actions:
    (left>0?'<button class="btn primary" data-a="tear1" data-c="'+ci+'">Mở tiếp (còn '+left+' túi)</button>':'')+
    (left>1?'<button class="btn" data-a="tearN" data-c="'+ci+'">Xé nhanh ×'+Math.min(10,left)+'</button>':'')+
    '<button class="btn" data-a="closeM">'+(left>0?'Dừng lại':'Xong')+'</button>'});
  after();
}
function tearN(ci){
  const n=Math.min(10,S.bags[ci]||0),list=[];
  for(let i=0;i<n;i++){const r=openBag(ci);if(r)list.push(r);}
  if(!list.length){closeModal();return;}
  const left=S.bags[ci]||0,cnt=[0,0,0,0,0,0],grp={};
  let xp=0,val=0,newN=0;
  const trashCount=list.filter(r=>r.kind==='trash').length,gods={};
  list.filter(r=>r.kind==='god').forEach(r=>{xp+=r.xp;val+=godPrice(r.key);gods[r.key]=(gods[r.key]||0)+1;});
  list.filter(r=>r.kind!=='trash'&&r.kind!=='god').forEach(r=>{cnt[r.r]++;xp+=r.xp;val+=price(r.id);if(r.isNew)newN++;const g=grp[r.id]||(grp[r.id]={n:0,isNew:false});g.n++;if(r.isNew)g.isNew=true;});
  const ids=Object.keys(grp).map(Number).sort((a,b)=>ITEMS[b].r-ITEMS[a].r);
  const best=Math.max(-1,...list.filter(r=>r.kind!=='trash'&&r.kind!=='god').map(r=>r.r));
  sheet('<h2>Đã xé '+list.length+' × '+bagName(ci)+'</h2><div class="muted">Hiếm nhất: '+(Object.keys(gods).length?'✨ God-item':best>=0?'<span class="rtag r'+best+'">'+RAR[best]+'</span>':'Thẻ rác sưu tầm')+'</div>'+
   '<div class="chips" style="margin:10px 0">'+cnt.map((v,r)=>v?'<span class="chip r'+r+'" style="border-color:var(--rc);color:var(--rc)">'+RAR[r]+' ×'+v+'</span>':'').join('')+'</div>'+
   (Object.keys(gods).length?'<div class="tiles">'+Object.entries(gods).map(([key,qty])=>'<div class="tile god-glow"><span class="t-e">'+GOD_ITEMS[key].e+'</span><span class="t-n">'+esc(GOD_ITEMS[key].n)+'</span><span class="t-q">×'+qty+'</span><span class="t-d">God-item</span></div>').join('')+'</div>':'')+
   (trashCount?'<div class="kv"><span>Thẻ rác nhận được (ngoài BST)</span><b>'+trashCount+'</b></div><div class="tiles">'+trashTile(ci)+'</div>':'')+
   '<div class="kv"><span>Item mới vào BST</span><b>'+newN+'</b></div><div class="kv"><span>Kinh nghiệm nhận được</span><b>+'+xp+' XP</b></div><div class="kv"><span>Giá trị thị trường</span><b>'+fmt(val)+' ₫</b></div>'+
   '<div class="tiles" style="margin-top:10px">'+ids.map(id=>{const it=ITEMS[id],g=grp[id];return '<div class="tile r'+it.r+'"><span class="t-e">'+it.e+'</span><span class="t-n">'+it.n+'</span><span class="t-q">×'+g.n+'</span>'+(g.isNew?'<span class="new" style="position:absolute;bottom:3px">MỚI</span>':'')+'</div>';}).join('')+'</div>'+
   '<div class="btnrow">'+(left>0?'<button class="btn primary" data-a="tearN" data-c="'+ci+'">Xé nhanh tiếp ×'+Math.min(10,left)+'</button>':'')+'<button class="btn" data-a="closeM">Xong</button></div>');
  after();
}
