<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Blink Box (Update 5.0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceffd; --surface:#ffffff; --surface2:#f2f3fd; --ink:#1b1940; --ink2:#5d5c85; --line:#dbdff4;
  --accent:#ff3d86; --accent-ink:#ffffff; --gold:#ffb800; --teal:#0fb5a3; --bad:#d93a40; --good:#14954f;
  --shadow:0 6px 22px rgba(40,30,110,.10); --overlay:rgba(18,12,48,.62);
  --r0:#8b90a8; --r1:#2fae67; --r2:#3a86ff; --r3:#9a5cff; --r4:#ff8420; --r5:#ffb800;
  --fd:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --fb:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
    --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
    --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
    --r0:#9aa0bd; --r1:#43c47c; --r2:#5b9bff; --r3:#b087ff; --r4:#ff9a45; --r5:#ffc83a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112a; --surface:#1f1c3f; --surface2:#2a2652; --ink:#f2f0ff; --ink2:#a9a6d6; --line:#38336b;
  --accent:#ff5c9b; --accent-ink:#1b1030; --gold:#ffc83a; --teal:#2bd4c1; --bad:#ff6b70; --good:#3ddc84;
  --shadow:0 6px 22px rgba(0,0,0,.35); --overlay:rgba(5,3,20,.72);
  --r0:#9aa0bd; --r1:#43c47c; --r2:#5b9bff; --r3:#b087ff; --r4:#ff9a45; --r5:#ffc83a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-family:var(--fd);line-height:1.15}
small{color:var(--ink2)}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.app[hidden],.title[hidden],.modal[hidden]{display:none}

/* header */
#top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px 0;box-shadow:var(--shadow);z-index:5}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.hl{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;text-align:left;min-width:0;border-radius:12px;padding:2px 4px 2px 0}
.hl:active{background:var(--surface2)}
.hl .r1{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.hl b{font-family:var(--fd);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvb{font-style:normal;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 8px;white-space:nowrap}
.hl .luck{font-size:13px;letter-spacing:1px}
.hm{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:5px 8px;font-size:11.5px;line-height:1.25}
.hm-l{font-weight:800;color:var(--ink2);font-size:9.5px;letter-spacing:.3px}
#feedtxt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .18s}
#feedtxt.fade{opacity:0}
.hr{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.hr1{display:flex;align-items:center;gap:6px}
.gear{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);flex:none}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xpbar{height:3px;background:var(--surface2);margin:8px -12px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));transition:width .5s}
.tbtn{margin-top:10px}
.qrbox{width:100%;aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--surface2)}
.qrbox img{width:100%;height:100%;object-fit:contain}
.top-r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-family:var(--fd);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.who{text-align:left;border-radius:14px;padding:2px 8px 2px 2px}
button.who:active{background:var(--surface2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:16px;flex:none}
.clock{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-family:var(--fd);font-weight:700}
.clock .ck-d{font-size:13px;color:var(--ink2);font-weight:600}
.clock #ck{font-size:18px;font-variant-numeric:tabular-nums}
.clock.over{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.clock.over .ck-d{color:inherit}
.top-r2{display:flex;align-items:center;gap:12px;margin-top:8px}
.lv{flex:1;min-width:0}
.lv-n{font-family:var(--fd);font-weight:700;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:99px;transition:width .5s ease}
.luck{font-size:15px;letter-spacing:1px;color:var(--gold);white-space:nowrap}
.luck .off{color:var(--line)}
.cash{font-family:var(--fd);font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.cash small{font-size:13px;margin-left:2px}
.banner{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid var(--accent);border-radius:12px;padding:8px 10px;font-size:13px}
.banner button{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-weight:700;white-space:nowrap}

/* main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.seg{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .2s,color .2s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ev{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:evp 1.6s infinite}
@keyframes evp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
#nav button{position:relative}
.menu{display:flex;gap:8px;margin-bottom:10px}
.menu button{flex:1;padding:10px 8px;border-radius:14px;font-family:var(--fd);font-weight:700;font-size:16px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);transition:background .2s,color .2s}
.menu button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.score{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;color:var(--gold)}
#nav .ev{position:absolute;top:4px;left:calc(50% + 8px);margin:0}
.seg button .lk{font-size:11px;margin-left:3px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:8px}
.muted{color:var(--ink2);font-size:13px}
.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty b{display:block;font-family:var(--fd);font-size:18px;color:var(--ink);margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sp{height:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;transition:transform .12s,background .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.block{display:flex;width:100%}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select.sel{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
input.txt{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.txt{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;width:100%;height:140px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}

/* bags */
.bag{position:relative;display:inline-block;width:var(--sz);height:calc(var(--sz)*1.2);flex:none}
.bag svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(30,20,90,.22))}
.bag-e{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);text-align:center;font-size:calc(var(--sz)*.34);line-height:1}
.bagcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .15s;position:relative;text-align:center}
.bagcard:active{transform:scale(.97)}
.shop-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shop-grid .bagcard{min-width:0;padding:9px 5px;border-radius:12px;gap:3px}
.shop-grid .bc-n{font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.shop-grid .bc-p{font-size:11px;overflow-wrap:anywhere}
.shop-grid .bc-q{position:static;font-size:10px;padding:1px 6px}
.shop-grid .btn{width:100%;padding:6px 3px;font-size:10px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
@media(max-width:359px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.luck-progress{height:6px}
.luck-progress i{background:linear-gradient(90deg,var(--gold),var(--accent))}
.bc-n{font-family:var(--fd);font-weight:700;font-size:15px;margin-top:4px;line-height:1.1}
.bc-p{font-weight:700;color:var(--accent);font-size:13.5px}
.bc-q{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.bagcard.lock{opacity:.55;filter:grayscale(.6);cursor:default}
.bagrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.bagrow .bi{flex:1;min-width:0}
.bagrow b{font-family:var(--fd);font-size:17px;display:block}
.qty{font-family:var(--fd);font-weight:800;font-size:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 11%,var(--surface));text-align:center;min-height:92px;transition:transform .12s}
.tile:active{transform:scale(.96)}
.t-e{font-size:30px;line-height:1.1}
.t-n{font-size:11.5px;font-weight:600;line-height:1.2;word-break:break-word}
.t-q{position:absolute;top:4px;right:5px;font-size:11px;font-weight:800;background:var(--ink);color:var(--surface);border-radius:99px;padding:0 6px}
.tile.unk{border-style:dashed;border-color:var(--line);background:var(--surface2)}
.tile[data-inv]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.t-d{font-size:11.5px;font-weight:800;margin-top:auto;padding-top:2px;font-variant-numeric:tabular-nums}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
.rin{width:92px;font:inherit;padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right}
.ibtns{display:flex;gap:8px;margin-left:auto;flex:none}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .12s,background .2s}
.ibtn:active{transform:scale(.92)}
.ibtn.on{background:color-mix(in srgb,var(--gold) 28%,var(--surface));border-color:var(--gold)}
.adq{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.adq button{padding:2px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.askctl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 0}
.askin{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.askin .rin{width:76px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--surface2);border:1px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden}
.slot.empty{border-style:dashed;background:transparent}
.slot.sp{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface2))}
.slot .sq{position:absolute;bottom:2px;right:4px;font-size:11px;font-weight:800}
.slot.soon{aspect-ratio:auto;padding:10px 6px;text-align:center;opacity:.6;border-style:dashed}
.slot.soon span{font-size:24px}.slot.soon small{display:block;line-height:1.2}
.slot.lst{border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 11%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slot.lst .lp{font-size:10.5px;font-weight:700;line-height:1}
.slot.lst .sq{top:2px;right:3px;bottom:auto}
.t-lk{position:absolute;top:4px;left:5px;font-size:13px;line-height:1}
.tile.dim .t-lk{opacity:1}
.t-ck{position:absolute;top:4px;left:5px;background:var(--accent);color:var(--accent-ink);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.selbar{position:sticky;bottom:-12px;margin:14px -14px -20px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(30,20,90,.12);padding:10px 14px 12px;z-index:4}
.selbar .btnrow{margin-top:8px}
.selbar small{display:block}
.spark{width:100%;height:96px;display:block;margin:8px 0}
.npc{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.npc .face{width:54px;height:54px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:30px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pair h4{font-size:13px;color:var(--ink2);margin-bottom:6px}
.tile.static{min-height:104px}
.tile.unk .t-e{filter:grayscale(1);opacity:.45}
.tile.dim{opacity:.55}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.rtag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--rc);color:#fff;font-size:12px;font-weight:700}
.r5 .rtag,.rtag.r5{color:#3b2a00}
.rh{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;font-size:15px;color:var(--rc)}
.rh small{font-weight:500}
.col-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.col-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--surface2);flex:none}
.col-card .bar{margin-top:6px}
.col-card.lock{opacity:.55}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.delta{font-weight:700;font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}

/* sheets / modal */
.modal{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet h2{font-size:21px;margin-bottom:4px}
.sheet .x{position:absolute}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
.rate span:first-child{width:76px;color:var(--rc);font-weight:700}
.rate .bar{flex:1;margin:0;height:6px}
.rate .bar i{background:var(--rc)}
.rate span:last-child{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.hero-item{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.hero-item .big{width:78px;height:78px;border-radius:20px;border:3px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--surface));display:grid;place-items:center;font-size:42px;flex:none}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding:0 14px}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .25s ease,tout .3s ease 2.3s forwards;max-width:92%;text-align:center}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}

/* nav */
#nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink2);font-size:11.5px;font-weight:600;transition:color .2s}

.customer-store{gap:12px;min-height:0}.store-floor{position:relative;min-height:390px;padding-bottom:44px}.customer-store .shopping-zone{min-height:210px;padding:14px;cursor:default}.shopping-aisles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}.shopping-aisle{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0;border:1px dashed var(--line);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--surface) 50%,transparent)}.shopping-aisle>b,.aisle-open>b{font-family:var(--fd);font-size:16px}.shopping-aisle small{font-size:10px;color:var(--ink2)}.shopping-aisle .btnrow{gap:4px;flex-wrap:wrap;margin-top:0}.shopping-aisle .btn{font-size:10px;padding:6px 4px;flex:1 1 40px}.aisle-open{display:flex;flex-direction:column;align-items:center;width:100%}.customer-store .store-preview{padding:6px 0;gap:4px}.customer-store .store-preview-item{width:32px;height:36px;font-size:22px}.customer-store .store-empty-icon{font-size:34px}.customer-store .store-lower{margin-top:20px}.checkout-marker{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:130px;border:2px solid var(--teal);background:color-mix(in srgb,var(--teal) 9%,var(--surface))}.checkout-marker small{font-size:10px;text-align:center;color:var(--ink2)}.store-door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 12px;font-size:10px;white-space:nowrap;color:var(--ink2)}

<body>
<div id="app" class="app" hidden>
  <header id="top"></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Menu chính"></nav>
</div>
<div id="title" class="title" hidden></div>

<div id="toasts" aria-live="polite"></div>

<script>
(()=>{
'use strict';

/* ============ CẤU HÌNH (chỉnh khi cân bằng game) ============ */
const CFG={
  START_MONEY:1000000, MAX_LV:99,
  DAY_START:480, DAY_END:1260, REAL_DAY_SEC:600,       // 8:00 -> 21:00 = 10 phút thực
  BAG_BASE:15000, SELL_FEE:0, PITY:90, XP_SCALE:3, UPGRADE_N:10,
  BANK_LV:15, BM_LV:20, TRADE_LV:15, APPRAISE_LV:30, AU_LV:25, DD_LV:35,
  MK_VOL_HOUR:0.45, MK_REV_HOUR:0.03, MK_VOL_DAY:0.6, MK_REV_DAY:0.08, MK_MIN:0.3, MK_MAX:3, BM_OPEN:600, BM_CLOSE:1080       // chợ đen 10:00 - 18:00
};
const GMS=(CFG.DAY_END-CFG.DAY_START)/CFG.REAL_DAY_SEC; // phút game trên mỗi giây thực
const KEY='blinkshop.save.v1';
const VERSION='Update 5.0';
const SKEY='blinkbox.settings.v1';
let SET={sound:true};
function saveSettings(){try{localStorage.setItem(SKEY,JSON.stringify(SET));}catch(e){}}
function loadSettings(){
  try{const t=localStorage.getItem(SKEY);if(t){SET.sound=JSON.parse(t).sound!==false;return;}}catch(e){}

}
/* ----- thông tin liên hệ (điền dữ liệu thật vào đây) ----- */
const CONTACT={zaloQR:'',fbUrl:'',donateQR:''};   /* zaloQR, donateQR: ảnh dạng data:image/...;base64,... */
/* ----- gift code (mỗi mã dùng 1 lần cho mỗi save) ----- */
const GIFT={ADMINDTA:{adminCard:true,msg:'Thẻ bài Admin'},BLINKBOX:{money:200000,msg:'200.000 ₫'},CHAOBAN:{bags:{0:5},msg:'5 Túi mù: Món Ăn'},DUONGTHANHAN:{money:500000,bags:{1:5},msg:'500.000 ₫ và 5 Túi mù: Nước Uống'}};
/* ----- âm thanh (tổng hợp bằng WebAudio, không cần file) ----- */
let AC=null;
function sfx(n){
  if(!SET.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime;
    const tone=(f,d,type,v,dl)=>{dl=dl||0;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t+dl);g.gain.setValueAtTime(0.0001,t+dl);g.gain.exponentialRampToValueAtTime(v||0.06,t+dl+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dl+d);o.connect(g);g.connect(AC.destination);o.start(t+dl);o.stop(t+dl+d+0.03);};
    const seq=(fs,d,type,v,gap)=>fs.forEach((f,i)=>tone(f,d,type,v,i*gap));
    switch(n){
      case 'tap':tone(620,0.05,'triangle',0.035);break;
      case 'good':seq([660,880],0.12,'sine',0.06,0.08);break;
      case 'bad':seq([300,210],0.18,'sawtooth',0.04,0.12);break;
      case 'shake':seq([180,210,180,230,190],0.07,'square',0.025,0.1);break;
      case 'level':seq([523,659,784,1047],0.16,'triangle',0.07,0.1);break;
      case 'r0':tone(392,0.12,'sine',0.05);break;
      case 'r1':seq([440,554],0.12,'sine',0.06,0.09);break;
      case 'r2':seq([523,659,784],0.14,'triangle',0.07,0.09);break;
      case 'r3':seq([523,659,784,1047],0.16,'triangle',0.08,0.09);break;
      case 'r4':seq([587,740,880,1175,1480],0.18,'triangle',0.08,0.08);break;
      case 'r5':seq([523,659,784,1047,1319,1568,2093],0.22,'triangle',0.09,0.08);break;
    }
  }catch(e){}
}
const sfxRare=r=>sfx('r'+r);
const rates=st=>(S&&S.adRates&&S.adRates[st])||RATES[st];
const FEE_TXT=String(CFG.SELL_FEE*100).replace('.',',');
const RAR=['Thường','Phổ thông','Hiếm','Cực hiếm','Cực phẩm','Huyền thoại'];
const XPR=[2,4,12,40,120,400];
const LPD=[-0.5,-0.2,1,3,8,20];
const BASEV=[0.85,0.95,1.7,4,10,40];   /* hệ số giá item so với giá túi mù của bộ (tối thiểu): thường −15% */
const CONF_DEF={base:BASEV.slice(),spread:0.1,mkMin:0.25,mkMax:4,fmGamma:0.8,fmKappa:0.3,fmVol:1,fmShock:1,fmDepth:1,fmFill:1,fmTol:0,apW:null,rateFix:null};
const cf=k=>{const c=typeof S!=='undefined'&&S&&S.adConf;return c&&c[k]!=null?c[k]:CONF_DEF[k];};
function applyBase(){
  const base=cf('base'),sp=cf('spread');

function bagRates(ci){
  const base=rates(stars()).slice(),sum=base.reduce((n,v)=>n+v,0)||100;
  const weights=base.map(n=>n*100/sum);
  if(!isPremium(ci))return weights;
  const high=weights.slice(2).reduce((n,v)=>n+v,0),low=weights[0]+weights[1];
  // Normal settings allow exact doubling. Extreme Admin rates saturate at 100%.
  const scale=high>0?Math.min(2,100/high):2,newLow=Math.max(0,100-high*scale);
  return weights.map((v,r)=>r>=2?v*scale:low>0?v*newLow/low:0);
}
function buyBoxes(ci,qty){
  if(!COLS[ci]||!unlocked(ci))return 'BST này chưa mở khóa.';
  if(!Number.isSafeInteger(qty)||qty<1||qty>10000)return 'Số lượng box không hợp lệ.';
  const cost=boxPrice(ci)*qty;if(cost>S.money)return 'Không đủ tiền nhập box.';
  S.money-=cost;S.boxes[ci]=(S.boxes[ci]||0)+qty;S.day$.spent+=cost;
  logTx('Nhập '+qty+'× '+boxName(ci),-cost);return '';
}
function unpackBox(ci,qty=1){
  if(!COLS[ci]||!Number.isSafeInteger(qty)||qty<1||qty>(S.boxes[ci]||0))return 0;
  S.boxes[ci]-=qty;if(!S.boxes[ci])delete S.boxes[ci];
  const count=qty*boxSize(ci);S.bags[ci]=(S.bags[ci]||0)+count;
  logTx('Mở '+qty+'× '+boxName(ci)+' → '+count+' túi mù',0);return count;
}
function listBag(ci,qty,ask){
  if(!COLS[ci]||!Number.isSafeInteger(qty)||qty<1||qty>(S.bags[ci]||0))return {err:'Số túi mù không hợp lệ.'};
  ask=ask==null?askOf(bagMarket(ci),5):Math.round(Number(ask)/10)*10;
  if(!Number.isFinite(ask)||ask<10||ask>1e12)return {err:'Giá bán từ 10₫ đến 1.000 tỷ₫.'};
  S.bags[ci]-=qty;if(!S.bags[ci])delete S.bags[ci];
  const same=S.listings.find(L=>L.kind==='bag'&&L.ci===ci&&L.ask===ask);
  if(same)same.qty+=qty;else S.listings.push({uid:S.uid++,kind:'bag',ci,qty,ask,cost:boxPrice(ci)/boxSize(ci),t:'Ngày '+S.day+' '+fmtClock()});
  S.restock.watch[ci]={ask};logTx('Đăng bán '+qty+'× '+bagName(ci)+' giá '+fmt(ask)+' ₫',0);return {ok:true};
}

function autoRestock(force=false){
  const R=S.restock,H=S.customers;
  if(!R.on||S.closed||(!force&&!isStoreOpen()))return;
  if(!force&&H.time<R.next)return;R.next=H.time+15;
  const wallet=S.money,budget=Math.floor(wallet*R.budgetPct/100);let purchased=0,changed=false;
  // One purchase sweep has a single shared budget across all collections.
  for(const key of Object.keys(R.watch)){
    const ci=+key;if(!COLS[ci])continue;
    if(S.listings.some(L=>L.kind==='bag'&&L.ci===ci&&L.qty>0))continue;
    if(!(S.bags[ci]>0)&&S.boxes[ci]>0){unpackBox(ci);changed=true;}
    if(!(S.bags[ci]>0)){
      const cost=boxPrice(ci);
      if(unlocked(ci)&&cost<=budget-purchased&&cost<=S.money){
        const err=buyBoxes(ci,1);if(!err){purchased+=cost;unpackBox(ci);changed=true;}
      }
    }
    if(S.bags[ci]>0){
      const result=listBag(ci,S.bags[ci],R.watch[ci].ask);if(result.ok){changed=true;delete R.notice[key];}
    }else restockNotice(key,'⚠️ Hết '+bagName(ci)+'. Không thể nhập box trong ngân sách '+R.budgetPct+'%.');
  }
  const allowed=new Set(R.rarities);
  for(const key of Object.keys(S.inv)){
    const id=+key,it=ITEMS[id];
    if(it&&S.inv[id]>0&&!isLocked(id)&&allowed.has(it.r)){
      const quantity=S.inv[id],err=listItem(id,quantity,5);if(err.ok)changed=true;
    }
  }
  // Appraised cards preserve their certificates and obey the same rarity/lock rules.
  for(const card of S.cert.slice()){
    if(!isLocked(card.id)&&allowed.has(ITEMS[card.id].r)){if(listCert(card.uid,5).ok)changed=true;}
  }
  if(!S.listings.length)restockNotice('empty','⚠️ Quầy đã hết hàng. Hãy kiểm tra Kho tồn, thẻ được phép bán hoặc nhập thêm box.');
  else delete R.notice.empty;
  if(changed){save();renderTop();if(ui.tab==='shop'&&$('#modal').hidden)renderView();}
}

const FM_DEPTH=[40,25,12,6,3,1.5],FM_SIG=[0.025,0.035,0.05,0.07,0.09,0.12],FM_FILL=[0.55,0.48,0.40,0.30,0.22,0.15],FM_FLOOR=[0.85,0.75,0.55,0.4,0.3,0.25];
const rndn=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
function mkEvent(x){S.mkEv.unshift({x,hr:S.hourN||0});if(S.mkEv.length>4)S.mkEv.length=4;}
const demandRatio=id=>clamp(S.macro*S.mkH[ITEMS[id].ci]*S.mkD[id]/S.mkS[id],0.3,3);
function fillProb(id,ask,cert){
  const it=ITEMS[id],ref=cert?Math.round(price(id)*cert.mult/10)*10:price(id);
  const m=ask/ref-1;
  let tol=0.116+0.25*Math.log(demandRatio(id))+cf('fmTol'),w=0.03,p0=FM_FILL[it.r]*cf('fmFill');
  if(cert){const b=cert.score-4;tol+=0.03*b;w+=0.008*b;p0*=1+0.04*b;}
  tol=clamp(tol,0,0.7);
  return clamp(p0/(1+Math.exp((m-tol)/w)),0,0.95);
}
function fmHour(){
  const g=cf('fmGamma'),k=cf('fmKappa'),vm=cf('fmVol'),sk=cf('fmShock'),mn=cf('mkMin'),mx=cf('mkMax');
  S.hourN=(S.hourN||0)+1;
  S.macro=clamp((S.macro||1)+(1-(S.macro||1))*0.01+rndn()*0.004*vm,0.5,2);
  for(let ci=0;ci<COLS.length;ci++){
    let hy=S.mkH[ci]||1;
    hy+=(1-hy)*0.06+rndn()*0.02*vm;
    if(Math.random()<0.012*sk){
      const hot=Math.random()<0.6;
      hy*=hot?1.25+Math.random()*0.35:0.6+Math.random()*0.2;
      if(unlocked(ci)) mkEvent(hot?'🔥 Cầu bộ '+COLS[ci].name+' tăng mạnh, giá đang lên':'🧊 Bộ '+COLS[ci].name+' nguội dần, giá có xu hướng giảm');
    }
    S.mkH[ci]=clamp(hy,0.4,2.5);
  }
  for(const it of ITEMS){
    const id=it.id;
    let s=S.mkS[id],d=S.mkD[id];
    s+=(1-s)*0.12+rndn()*0.03*vm; d+=(1-d)*0.08+rndn()*0.035*vm;
    if(Math.random()<0.010*sk) s*=1.3+Math.random()*0.6;
    if(Math.random()<0.010*sk) d*=1.3+Math.random()*0.7; else if(Math.random()<0.006*sk) d*=0.5+Math.random()*0.25;
    s=clamp(s,0.3,4);d=clamp(d,0.3,4);S.mkS[id]=s;S.mkD[id]=d;
    const T=it.anchor*Math.pow(S.macro*S.mkH[it.ci]*d/s,g);
    let pr=S.mkP[id];pr+=k*(T-pr);pr*=Math.exp(FM_SIG[it.r]*vm*rndn());
    S.mkP[id]=clamp(pr,it.anchor*Math.max(mn,FM_FLOOR[it.r]),it.anchor*mx);
  }
  COLS.forEach(c=>{const target=bagPrice(c.id)*Math.pow(S.macro*S.mkH[c.id],.65);S.bagP[c.id]=clamp((S.bagP[c.id]+.3*(target-S.bagP[c.id]))*Math.exp(rndn()*.025*vm),bagPrice(c.id)*.5,bagPrice(c.id)*3);});

}

function chooseCustomerItems(c){
  if(!isStoreOpen())return false;
  const p=CUSTOMER_TYPES.find(p=>p.key===c.type),pool=shuffle(S.listings.filter(L=>L.qty>0));
  if(p.key==='collector')pool.sort((a,b)=>(b.kind==='bag')-(a.kind==='bag'));
  if(p.key==='save')pool.sort((a,b)=>a.ask-b.ask);
  let remaining=Math.min(c.target,customerMax()),budget=c.budget;
  if(Math.random()*100>=customerBuyRate())return false;
  for(const L of pool){
    if(!remaining||budget<L.ask)continue;
    const ref=listingRef(L);
    const acceptance=clamp(Math.exp(-p.sensitivity*Math.max(0,L.ask/ref-1)),0,1);
    if(Math.random()>acceptance)continue;
    const qty=Math.min(L.qty,remaining,Math.floor(budget/L.ask));if(qty<1)continue;
    c.cart.push({...L,cert:L.cert?{...L.cert}:undefined,qty});
    L.qty-=qty;remaining-=qty;budget-=qty*L.ask;
  }
  S.listings=S.listings.filter(L=>L.qty>0);
  if(!S.listings.length&&c.cart.length)restockNotice('empty','⚠️ Quầy đã hết hàng. Hãy kiểm tra Kho tồn, thẻ được phép bán hoặc nhập thêm box.');

function abandonCustomer(c){
  const hadItems=c.cart.length>0;restoreCustomerCart(c);S.customers.left++;
  customerState(c,'leaving',2.5,c.type==='picky'?'Chờ lâu quá! Tôi đi đây.':'Tôi có việc rồi, hẹn lần sau.');
  if(hadItems){logTx(c.name+' rời hàng chờ, hàng đã trả về quầy',0);toast(c.face+' '+c.name+' bỏ chờ. Hàng đã trả về quầy.');}
}
function checkoutCustomer(uid,automatic=false){
  const H=S.customers,c=H.people.find(c=>c.uid===uid);
  if(!c||c.state!=='waiting'||!c.cart.length||S.closed)return {err:'Khách không còn chờ thanh toán.'};
  if(H.time-c.since>=c.patience){abandonCustomer(c);save();return {err:'Khách đã hết thời gian chờ. Hàng đã được trả về quầy.'};}
  // The queue is served in arrival order, including automatic checkout.
  if(waitingCustomers()[0]!==c)return {err:'Hãy thanh toán khách đứng đầu hàng trước.'};
  const total=c.cart.reduce((n,L)=>n+L.ask*L.qty,0),net=Math.round(total*(1-CFG.SELL_FEE));
  if(!Number.isFinite(total)||total<=0||c.cart.some(L=>!Number.isInteger(L.qty)||L.qty<1||!(L.kind==='bag'?COLS[L.ci]:ITEMS[L.id])))return {err:'Đơn hàng không hợp lệ.'};
  const qty=c.cart.reduce((n,L)=>n+L.qty,0);
  for(const L of c.cart){
    if(L.kind!=='bag')S.mkS[L.id]=Math.min(4,S.mkS[L.id]+L.qty/FM_DEPTH[ITEMS[L.id].r]);
    else S.bagP[L.ci]=Math.min(bagPrice(L.ci)*3,S.bagP[L.ci]*(1+Math.min(.015,L.qty*.001)));
    S.sales.unshift({t:'Ngày '+S.day+' '+fmtClock(),kind:L.kind||'card',ci:L.ci,id:L.id,n:L.qty,net:Math.round(L.ask*L.qty*(1-CFG.SELL_FEE)),cost:Math.round((L.cost||0)*L.qty),cert:L.cert?L.cert.score:0});
  }
  S.sales.length=Math.min(12,S.sales.length);S.money+=net;S.day$.earned+=net;H.served++;
  logTx('Thanh toán '+c.name+' · '+qty+' món'+(automatic?' (tự động)':''),net);
  if(c.type==='regular'||Math.random()<.15){
    if(!H.regulars.some(r=>r.name===c.name&&r.face===c.face))H.regulars.push({name:c.name,face:c.face});
    H.regulars=H.regulars.slice(-20);
  }
  c.cart=[];customerState(c,'leaving',2.5,'Cảm ơn, lần sau tôi lại ghé!');
  S.stats.peak=Math.max(S.stats.peak,S.money);save();renderTop();
  toast('💰 '+c.name+' thanh toán +'+fmt(net)+' ₫','good');return {ok:true,net};
}
function tickCustomers(dt){
  if(!S.dayStarted||S.closed||S.bankrupt)return;
  const H=S.customers;H.time+=dt;let changed=false;
  if(isStoreOpen()&&H.time>=H.next){
    H.next=H.time+7+Math.random()*7;
    if(H.people.filter(c=>c.state!=='leaving').length<12){spawnCustomer();changed=true;}
  }
  for(const c of H.people.slice()){
    const elapsed=H.time-c.since;
    if(c.state==='entering'&&elapsed>=c.duration){
      if(isStoreOpen())customerState(c,'browsing',3+Math.random()*4,'Để tôi chọn vài món…');
      else customerState(c,'leaving',2.5,'Cửa hàng đóng rồi, hẹn ngày mai.');changed=true;
    }else if(c.state==='browsing'&&elapsed>=c.duration){
      if(chooseCustomerItems(c))customerState(c,'toCheckout',2.5,'Tôi chọn xong rồi!');
      else customerState(c,'leaving',2.5,isStoreOpen()?'Hôm nay chưa tìm thấy món phù hợp.':'Hẹn cửa hàng ngày mai.');changed=true;
    }else if(c.state==='toCheckout'&&elapsed>=c.duration){
      customerState(c,'waiting',c.patience,'Thanh toán giúp tôi nhé!');changed=true;
      if(!H.auto)toast(c.face+' '+c.name+' đang chờ thanh toán');
    }else if(c.state==='waiting'&&elapsed>=c.patience){abandonCustomer(c);changed=true;}
    else if(c.state==='leaving'&&elapsed>=c.duration){H.people=H.people.filter(x=>x.uid!==c.uid);changed=true;}
  }
  if(H.auto){const first=waitingCustomers()[0];if(first){checkoutCustomer(first.uid,true);changed=true;}}
  if(changed){ui.dirty=true;save();renderCheckoutShortcut();}
  updateCustomerUI(changed);
}
function customerPosition(c){
  const progress=clamp((S.customers.time-c.since)/Math.max(.1,c.duration),0,1),j=c.uid%4;
  if(c.state==='entering')return [48+(25-48)*progress,94+(28-94)*progress];
  if(c.state==='browsing')return [22+j*13,25+(j%2)*9];
  if(c.state==='toCheckout')return [35+(79-35)*progress,32+(70-32)*progress];
  if(c.state==='waiting'){const n=waitingCustomers().indexOf(c);return [Math.max(12,80-n*10),71];}
  return [80+(48-80)*progress,71+(96-71)*progress];
}

}

/* --- đăng bán --- */
function askInfo(id,pc,cert,costOv){
  const ref=cert?certPrice(cert):price(id),ask=askOf(ref,pc),pr=fillProb(id,ask,cert),net=Math.round(ask*(1-CFG.SELL_FEE));
  return {ref,ask,p:pr,net,cost:ref,pl:net-ref};
}
const chanceTxt=pr=>(pr>=0.25?'Cao':pr>=0.1?'Vừa':pr>=0.03?'Thấp':'Rất thấp')+' · '+(pr<0.005?'<1':Math.round(pr*100))+'% tham khảo';
const waitTxt=pr=>pr<0.01?'khó bán được':'trung bình ~'+Math.max(1,Math.round(1/pr))+' giờ game';
function listItem(id,qty,pc){
  if(isLocked(id)) return {err:LOCK_MSG};
  qty=Math.min(qty,S.inv[id]||0); if(qty<=0) return {err:'Bạn không có item này.'};
  const ask=askOf(price(id),pc),cost=S.cost[id]!=null?S.cost[id]:price(id);
  S.inv[id]-=qty; if(S.inv[id]<=0) delete S.inv[id];
  S.listings.push({uid:S.uid++,id,qty,ask,cost,t:'Ngày '+S.day+' '+fmtClock()});
  logTx('Đăng bán '+qty+'× '+ITEMS[id].n+' giá '+fmt(ask)+' ₫',0);
  return {ok:true};
}
function listCert(uid,pc){
  const i=S.cert.findIndex(c=>c.uid===uid);if(i<0) return {err:'Không tìm thấy item.'};
  const c=S.cert.splice(i,1)[0],ask=askOf(certPrice(c),pc);
  S.listings.push({uid:S.uid++,id:c.id,qty:1,ask,cost:c.cost!=null?c.cost:certPrice(c),cert:{uid:c.uid,score:c.score,mult:c.mult},t:'Ngày '+S.day+' '+fmtClock()});
  logTx('Đăng bán '+ITEMS[c.id].n+' ('+scoreTxt(c.score)+'/10đ) giá '+fmt(ask)+' ₫',0);
  return {ok:true};
}
function cancelListing(uid){
  const i=S.listings.findIndex(l=>l.uid===uid);if(i<0) return;
  const L=S.listings.splice(i,1)[0];
  if(L.kind==='bag'){S.bags[L.ci]=(S.bags[L.ci]||0)+L.qty;return;}
  if(L.cert){S.cert.push({uid:L.cert.uid,id:L.id,score:L.cert.score,mult:L.cert.mult,cost:L.cost});}
  else{const old=S.inv[L.id]||0;S.cost[L.id]=old>0?Math.round(((S.cost[L.id]!=null?S.cost[L.id]:L.cost)*old+L.cost*L.qty)/(old+L.qty)):L.cost;S.inv[L.id]=old+L.qty;S.disc[L.id]=1;}
}

/* --- chợ đen --- */
function genBM(){
  const un=unlockedCols(),offers=[];
  for(let k=0;k<6;k++){
    const ci=pick(un),r=pickW([60,28,10,2],2),id=pick(COLS[ci].byR[r]);
    const disc=0.10+Math.random()*0.20;
    const appear=CFG.BM_OPEN+Math.floor(Math.random()*300);
    const end=Math.min(CFG.BM_CLOSE,appear+90+Math.floor(Math.random()*150));
    offers.push({oid:S.day*100+k,id,price:Math.round(price(id)*(1-disc)/10)*10,qty:r>=5?1:1+Math.floor(Math.random()*3),appear,end});
  }
  offers.sort((a,b)=>a.appear-b.appear);
  S.bm={day:S.day,offers};
}
const bmActive=()=>isStoreOpen()&&S.bm&&S.bm.day===S.day&&S.lvl>=CFG.BM_LV&&S.clock>=CFG.BM_OPEN&&S.clock<CFG.BM_CLOSE?S.bm.offers.filter(o=>o.qty>0&&S.clock>=o.appear&&S.clock<o.end):[];
function bmBuy(oid){
  if(!isStoreOpen())return {err:EVENT_CLOSED};
  const o=S.bm.offers.find(x=>x.oid===oid);
  if(!o||o.qty<=0||S.clock<o.appear||S.clock>=o.end||S.clock>=CFG.BM_CLOSE) return {err:'Món này đã hết hạn hoặc hết hàng.'};
  if(S.money<o.price) return {err:'Không đủ tiền.'};
  S.money-=o.price; S.day$.spent+=o.price; o.qty--;
  const isNew=giveItem(o.id,o.price);
  logTx('Săn chợ đen: '+ITEMS[o.id].n,-o.price);
  return {id:o.id,isNew};
}

/* --- đấu giá --- */
const BOTS=[
  {n:'Đối thủ A',t:'Nhát gan, hay bỏ cuộc sớm',p:.35,agg:.1,lo:.85,hi:1.05},
  {n:'Đối thủ B',t:'Tính toán, ra giá vừa phải',p:.55,agg:.25,lo:1.0,hi:1.25},
  {n:'Đối thủ C',t:'Liều lĩnh, hay đẩy giá mạnh',p:.75,agg:.5,lo:1.2,hi:1.6}
];
function genAuctions(){
  const un=unlockedCols(),times=[];
  while(times.length<3){const t=540+Math.floor(Math.random()*480);if(times.every(x=>Math.abs(x-t)>=60))times.push(t);}
  times.sort((a,b)=>a-b);
  const list=times.map(appear=>{
    const ci=pick(un),r=pickW([50,30,15,5],2),id=pick(COLS[ci].byR[r]);
    const mk=price(id),start=Math.max(5000,Math.round(mk*(0.6+Math.random()*0.15)/500)*500);
    const step=Math.max(1000,Math.round(start*0.05/500)*500);
    const fee=Math.max(5000,Math.round((0.05*mk+100*S.lvl+0.002*S.money)/500)*500);
    return {id,status:'wait',start,step,cur:start,holder:null,lastJump:1,fee,appear,busy:false,log:[],
      bots:BOTS.map(b=>({n:b.n,p:b.p,agg:b.agg,max:Math.round(mk*(b.lo+Math.random()*(b.hi-b.lo))/500)*500}))};
  });
  S.au={day:S.day,list};
}
function ensureEvents(){
  if(S.lvl>=CFG.BM_LV&&(!S.bm||S.bm.day!==S.day)) genBM();
  if(S.lvl>=CFG.AU_LV&&(!S.au||!S.au.list||S.au.day!==S.day)) genAuctions();
  if(S.lvl>=CFG.TRADE_LV&&(!S.trade||S.trade.day!==S.day)) genTrade();
}
function auSync(){
  if(!isStoreOpen())return;
  if(S.au&&S.au.list&&S.au.day===S.day) S.au.list.forEach(a=>{
    if(a.status==='wait'&&S.clock>=a.appear) a.status='open';
    if(a.status==='open'&&isOver()) a.status='missed';
  });
  tradeSync();
}
const AU=i=>S.au&&S.au.list&&S.au.day===S.day?S.au.list[i]:null;
function auNext(a){return a.holder===null?a.start:a.cur+a.step;}
function auJoin(i){
  if(!isStoreOpen())return EVENT_CLOSED;
  const a=AU(i);
  if(!a||a.status!=='open') return 'Phiên đấu giá chưa mở.';
  if(S.money<a.fee) return 'Không đủ tiền đóng phí tham gia.';
  S.money-=a.fee; S.day$.spent+=a.fee; a.status='joined';
  logTx('Phí tham gia đấu giá',-a.fee);
  return '';
}
function auBid(i,j){
  if(!isStoreOpen())return EVENT_CLOSED;
  const a=AU(i); if(!a||a.status!=='joined'||a.busy) return 'Không thể ra giá lúc này.';
  const amt=auNext(a)+a.step*(j-1);
  if(S.money<amt) return 'Không đủ tiền để ra mức giá này.';
  a.cur=amt;a.holder='you';a.lastJump=j;
  a.log.unshift('Bạn ra giá '+fmt(amt)+' ₫');
  a.busy=true;
  return '';
}
function auResolve(i){
  if(!isStoreOpen())return;
  const a=AU(i); if(!a) return;
  a.busy=false;
  if(a.status!=='joined'||a.holder!=='you') return;
  const pen=Math.pow(0.75,a.lastJump-1);
  for(const bi of shuffle([0,1,2])){
    const b=a.bots[bi],bid=a.cur+a.step*(Math.random()<b.agg?2:1);
    if(bid<=b.max&&Math.random()<b.p*pen){
      a.cur=bid;a.holder=bi;a.log.unshift(b.n+' ra giá '+fmt(bid)+' ₫');
      return {counter:b.n};
    }
  }
  S.money-=a.cur; S.day$.spent+=a.cur; a.status='won';
  const isNew=giveItem(a.id,a.cur);
  logTx('Thắng đấu giá: '+ITEMS[a.id].n,-a.cur);
  a.log.unshift('Không ai theo giá — bạn thắng!');
  return {won:true,id:a.id,isNew};
}
function auLeave(i){
  const a=AU(i); if(!a||a.status!=='joined') return;
  a.status='lost'; a.log.unshift('Bạn bỏ cuộc. Phí tham gia không được hoàn lại.');
}
/* --- giao dịch NPC (cấp 40) --- */
const NPCS=[{n:'Bà Tám đồ cũ',e:'👵'},{n:'Anh Ba nhà giàu',e:'🧑‍💼'},{n:'Cô Hai sưu tầm',e:'👩‍🎨'},{n:'Chú Tư thợ săn',e:'🧔'},{n:'Thầy Bảy đồ cổ',e:'👴'},{n:'Bé Na thích đổi',e:'👧'},{n:'Cậu Chín lái buôn',e:'🧑‍🌾'}];
function genTrade(){
  const slots=[];
  while(slots.length<5){const t=540+Math.floor(Math.random()*660);if(slots.every(x=>Math.abs(x-t)>=60)) slots.push(t);}
  slots.sort((a,b)=>a-b);
  S.trade={day:S.day,slots,idx:-1,offers:[]};
}
function genOffers(){
  const un=unlockedCols(),n=1+Math.floor(Math.random()*3),out=[],used={};
  const owned=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&!isLocked(id));
  for(let j=0;j<n;j++){
    const cand=owned.filter(id=>!used[id]);
    if(!cand.length) break;
    const swapC=cand.filter(id=>ITEMS[id].r>=2);
    const swap=swapC.length>0&&Math.random()<0.5;
    const want=pick(swap?swapC:cand);used[want]=1;
    const npc=pick(NPCS);
    if(swap){
      const r=ITEMS[want].r;let give,t=0;
      do{give=pick(COLS[pick(un)].byR[r]);t++;}while(give===want&&t<10);
      out.push({oid:S.uid++,npc,type:'swap',give,want,status:'open'});
    }else{
      const bonus=0.05+Math.random()*0.25;
      out.push({oid:S.uid++,npc,type:'buy',want,bonus,price:Math.round(price(want)*(1+bonus)/10)*10,status:'open'});
    }
  }
  return out;
}
const tradeValid=o=>o.status==='open'&&(S.inv[o.want]||0)>0;
const tradeOpenN=()=>S.trade&&S.trade.day===S.day&&Array.isArray(S.trade.offers)?S.trade.offers.filter(tradeValid).length:0;
function tradeSync(){
  if(!isStoreOpen())return;
  const t=S.trade;if(!t||t.day!==S.day||!Array.isArray(t.offers)) return;
  let moved=false;
  while(t.idx<4&&S.clock>=t.slots[t.idx+1]){t.idx++;moved=true;}
  if(moved){t.offers.forEach(o=>{if(o.status==='open')o.status='expired';});t.offers=genOffers();}
  if(isOver()) t.offers.forEach(o=>{if(o.status==='open')o.status='expired';});
}
function acceptTrade(oid){
  if(!isStoreOpen())return {err:EVENT_CLOSED};
  const t=S.trade,o=t&&t.offers?t.offers.find(x=>x.oid===oid):null;
  if(!o||o.status!=='open') return {err:'Đề nghị này đã kết thúc.'};
  if(!(S.inv[o.want]>0)){o.status='expired';return {err:'Bạn không còn item mà NPC muốn nhận.'};}
  if(isLocked(o.want)) return {err:LOCK_MSG};
  S.inv[o.want]--; if(S.inv[o.want]<=0) delete S.inv[o.want];
  o.status='done';
  if(o.type==='buy'){
    S.money+=o.price;if(S.day$)S.day$.earned+=o.price;
    logTx('NPC mua '+ITEMS[o.want].n+' (+'+Math.round(o.bonus*100)+'% so với thị trường)',o.price);
    return {buy:true,price:o.price,gain:o.price-price(o.want)};
  }
  const isNew=giveItem(o.give),pl=price(o.give)-price(o.want);
  logTx('Đổi '+ITEMS[o.want].n+' lấy '+ITEMS[o.give].n+' ('+(pl>=0?'lãi ':'lỗ ')+fmt(Math.abs(pl))+')',0);
  return {id:o.give,isNew,pl};
}

/* --- đu đỉnh (cấp 50): cược item cực hiếm trở lên, giá 6 giây tới tăng hay giảm --- */
const DD_STEPS=24,DD_MS=6000,DD_MAX=5;
function ddStart(id){
  if(!isStoreOpen())return EVENT_CLOSED;
  if(S.dd||!(S.inv[id]>0)||ITEMS[id].r<2) return 'Không thể cược item này.';
  if(isLocked(id)) return LOCK_MSG;
  if((S.ddCount||0)>=DD_MAX) return 'Hôm nay bạn đã đu đỉnh đủ '+DD_MAX+' lần.';
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const p0=price(id);
  S.ddCount=(S.ddCount||0)+1;
  const win=Math.random()*100<(S.ddWin==null?50:S.ddWin);
  S.dd={id,p0,p:[p0],path:ddPath(p0,win),win,steps:0,start:Date.now(),deadline:Date.now()+DD_MS};
  S.ddLast=null;
  return '';
}
function ddPath(p0,win){
  const N=DD_STEPS,lw=[0];let w=0;
  for(let i=1;i<=N;i++){w+=(Math.random()-0.5)*0.014;lw.push(w);}
  const target=(win?1:-1)*(0.002+Math.random()*0.01);
  return lw.map((v,i)=>Math.max(10,p0*Math.exp(v+(target-lw[N])*(i/N))));
}
function ddStep(){
  const d=S.dd,cur=d.p[d.p.length-1];
  d.p.push(d.path&&d.path[d.p.length]!==undefined?d.path[d.p.length]:Math.max(10,cur*(1+(Math.random()-0.5)*0.014)));d.steps++;
}
function ddResolve(){
  const d=S.dd; while(d.steps<DD_STEPS) ddStep();
  const end=d.p[d.p.length-1],val=Math.round(d.p0/10)*10,up=end>d.p0,down=end<d.p0;
  if(!down) S.inv[d.id]=(S.inv[d.id]||0)+1;
  if(up){S.money+=val;S.day$.earned+=val;logTx('Đu đỉnh thắng: '+ITEMS[d.id].n,val);}
  else if(down) logTx('Đu đỉnh thua: mất '+ITEMS[d.id].n+' (giá trị '+fmt(val)+')',0);
  else logTx('Đu đỉnh hòa: giữ lại '+ITEMS[d.id].n,0);
  S.ddLast={id:d.id,val,up,down,p0:d.p0,end};
  S.dd=null;
}

/* --- ngân hàng (từ ngày 5) --- */
const LOANS=[{amt:500000,days:7},{amt:1000000,days:15}];
function rollRate(first){
  const fx=cf('rateFix');
  let r=fx!=null?fx:0.005+Math.random()*0.045;
  r=Math.round(clamp(r,0.005,0.05)*2000)/2000;
  S.rate=r;
  S.rateHist=(S.rateHist||[]).filter(x=>x.day!==S.day);
  S.rateHist.push({day:S.day,rate:r});
  while(S.rateHist.length>7) S.rateHist.shift();
}
const pp=r=>(r*100).toFixed(2).replace('.',',')+'%';
function loanCalc(t,rate){rate=rate==null?S.rate:rate;const total=Math.round(t.amt*(1+rate*t.days));return {total,daily:Math.ceil(total/t.days/100)*100};}
function takeLoan(k){
  if(S.lvl<CFG.BANK_LV) return 'Ngân hàng chưa mở.';
  if(S.loans.some(l=>l.tier===k)) return 'Bạn đang có khoản vay này.';
  const t=LOANS[k],c=loanCalc(t);
  S.loans.push({tier:k,rate:S.rate,principal:t.amt,term:t.days,total:c.total,daily:c.daily,remaining:c.total,left:t.days});
  S.money+=t.amt;
  logTx('Vay ngân hàng '+fmt(t.amt)+' ₫ ('+t.days+' ngày, lãi '+pp(S.rate)+'/ngày)',t.amt);
  return '';
}
function repayLoan(k){
  const i=S.loans.findIndex(l=>l.tier===k); if(i<0) return 'Không có khoản vay.';
  const L=S.loans[i]; if(S.money<L.remaining) return 'Không đủ tiền để trả hết nợ.';
  S.money-=L.remaining; logTx('Trả hết nợ ngân hàng',-L.remaining); S.loans.splice(i,1);
  return '';
}
function collect(need){
  const out={seized:[],credit:0};
  const c=Math.min(S.money,need);S.money-=c;need-=c;
  if(need>0){
    const units=[];
    for(const k in S.inv) for(let i=0;i<S.inv[k];i++) units.push({t:'i',id:+k,v:price(+k),lk:isLocked(+k)});
    (S.cert||[]).forEach(x=>units.push({t:'c',uid:x.uid,id:x.id,v:certPrice(x),lk:false}));
    for(const lockedPass of [false,true]){
      const pool=units.filter(u=>u.lk===lockedPass);
      while(need>0&&pool.length){
        pool.sort((a,b)=>a.v-b.v);
        let idx=pool.findIndex(u=>u.v>=need); if(idx<0) idx=pool.length-1;
        const u=pool.splice(idx,1)[0];
        if(u.t==='i'){S.inv[u.id]--;if(S.inv[u.id]<=0)delete S.inv[u.id];}
        else S.cert=S.cert.filter(x=>x.uid!==u.uid);
        out.seized.push(u.id); need-=u.v;
        if(need<0){S.money+=-need;out.credit+=-need;need=0;}
      }
    }
  }
  out.short=need;
  return out;
}
function settleLoans(){
  const res={paid:0,seized:[]};
  if(!S.loans||!S.loans.length) return res;
  for(const L of S.loans.slice()){
    const pay=L.left<=1?L.remaining:Math.min(L.daily,L.remaining);
    if(S.money<pay&&S.safe>0){S.money+=S.safe;S.safe=0;}
    const r=collect(pay);
    const applied=pay-r.short;
    L.remaining-=applied; L.left--; res.paid+=applied; res.seized.push(...r.seized);
    logTx('Trả nợ ngân hàng'+(r.seized.length?' (gán nợ '+r.seized.length+' item)':''),-applied);
    if(r.short>0){S.bankrupt=true;break;}
    if(L.remaining<=0||L.left<=0) S.loans.splice(S.loans.indexOf(L),1);
  }
  return res;
}

/* --- thẩm định (từ ngày 16): chỉ số hoàn hảo x/10đ --- */
const AP_FEE=30000,AP_SLOTS=3,AP_W=[45,30,17,8];   /* trọng số: 7,x | 8,x | 9,x | 10,0 */
const scoreTxt=s=>(+s).toFixed(1).replace('.',',');
const AP_MID={7:2.55,8:3.3,9:4.5,10:11.25};
function apMult(sc){
  if(sc>=10) return Math.round((7.5+Math.random()*7.5)*100)/100;
  const lo=Math.floor(sc),f=sc-lo,a=AP_MID[lo],b=AP_MID[lo+1];
  return Math.round((a+(b-a)*f)*(0.92+Math.random()*0.16)*100)/100;
}
const AP_BOOST=1.5;
const AP_M=[[1.05,1.25],[1.2,1.5],[1.5,1.9],[1.9,2.5],[2.5,3.5],[5,10]].map(r=>r.map(v=>Math.round(v*AP_BOOST*100)/100)); /* hệ số giá theo điểm 5..10, đã nhân AP_BOOST */
const certPrice=c=>Math.round(price(c.id)*c.mult/10)*10;
const apReady=a=>a.day<S.day;
const apUsed=()=>S.appr.filter(a=>a.day===S.day).length;
function apSubmit(id){
  if(S.lvl<CFG.APPRAISE_LV) return 'Thẩm định chưa mở.';
  if(apUsed()>=AP_SLOTS) return 'Hôm nay đã hết slot thẩm định.';
  if(!(S.inv[id]>0)||ITEMS[id].r<3) return 'Item không hợp lệ.';
  if(isLocked(id)) return LOCK_MSG;
  if(S.money<AP_FEE) return 'Không đủ tiền phí thẩm định.';
  S.money-=AP_FEE; S.day$.spent+=AP_FEE;
  S.inv[id]--; if(S.inv[id]<=0) delete S.inv[id];
  const aw=cf('apW'),bk=pickW(aw&&aw.length===4?aw:AP_W,7),score=bk>=10?10:Math.min(9.9,Math.round((bk+Math.random())*10)/10);
  const cst=(S.cost[id]!=null?S.cost[id]:price(id))+AP_FEE;
  S.appr.push({uid:S.uid++,id,day:S.day,score,boost:1,cost:cst,mult:apMult(score)});
  logTx('Gửi thẩm định '+ITEMS[id].n,-AP_FEE);
  return '';
}
function apCollect(uid,force){
  const i=S.appr.findIndex(a=>a.uid===uid);
  if(i<0||(!force&&!apReady(S.appr[i]))) return null;
  const a=S.appr.splice(i,1)[0];
  if(!a.boost) a.mult=Math.round(a.mult*AP_BOOST*100)/100;
  S.cert.push({uid:a.uid,id:a.id,score:a.score,mult:a.mult,cost:a.cost!=null?a.cost:price(a.id)});
  logTx('Nhận kết quả thẩm định '+ITEMS[a.id].n+': '+scoreTxt(a.score)+'/10đ',0);
  return S.cert[S.cert.length-1];
}

function startDay(n){
  const first=n===1;
  S.customers.people.forEach(restoreCustomerCart);
  S.customers.people=[];S.customers.next=S.customers.time+4;
  S.dayStarted=false;S.closed=false;
  S.day=n;rollRate(first);S.clock=CFG.DAY_START;S.overNote=false;
  if(!first){S.lp+=(baseLP()-S.lp)*0.2;fmNight();}
  snapOpen();
  S.day$={startWorth:netWorth(),spent:0,earned:0,bags:0,bestR:-1,bestId:null};
  S.ddCount=0;S.bm=null;S.au=null;S.trade=null;ensureEvents();
}
function endDay(){
  if(S.closed&&S.lastSum)return S.lastSum;
  S.customers.people.forEach(restoreCustomerCart);S.customers.people=[];
  if(S.dd)ddResolve();
  if(S.dayStarted)runHoursTo(CFG.DAY_END);
  const d=S.day$;
  const loan=settleLoans();
  const sum={day:S.day,spent:d.spent,earned:d.earned,pl:netWorth()-d.startWorth,bags:d.bags,bestId:d.bestId,bestR:d.bestR,money:S.money,loan};
  if(S.au&&S.au.list) S.au.list.forEach(a=>{if(a.status==='joined')a.status='lost';});
  if(S.trade&&Array.isArray(S.trade.offers)) S.trade.offers.forEach(o=>{if(o.status==='open')o.status='expired';});
  S.lastSum=sum;
  S.clock=CFG.DAY_END;S.dayStarted=false;S.closed=true;S.overNote=true;
  return sum;
}
function startNextDay(){
  startDay(S.day+1);S.closed=false;
  ui.tab='shop';ui.sub.shop='home';ui.adminOpen=false;ui.sig=marketSig();
  if(S.appr.some(apReady)) setTimeout(()=>toast('🔬 Có kết quả thẩm định đang chờ bạn!'),900);
}

function evActive(){

  return {
    bm:S.lvl>=CFG.BM_LV&&bmActive().length>0,

    tr:isStoreOpen()&&S.lvl>=CFG.TRADE_LV&&tradeOpenN()>0,

const MK_SUBS=['bm','au','dd'],CM_SUBS=['bank','ap'];
function viewMarket(){
  const ev=evActive(),inC=ui.tab==='community';
  const sub=inC?(ui.last.community||'bank'):(ui.last.market||'bm');
  ui.sub.market=sub;
  const head=inC?seg('market',[
    ['bank','Ngân hàng',S.lvl<CFG.BANK_LV?'Cấp '+CFG.BANK_LV:0],
    ['ap','Thẩm định',S.lvl<CFG.APPRAISE_LV?'Cấp '+CFG.APPRAISE_LV:0,ev.ap]]):seg('market',[
    ['bm','Chợ đen',S.lvl<CFG.TRADE_LV?'Cấp '+CFG.TRADE_LV:0,ev.bm||ev.tr],
    ['au','Đấu giá',S.lvl<CFG.AU_LV?'Cấp '+CFG.AU_LV:0,ev.au],
    ['dd','Đu đỉnh',S.lvl<CFG.DD_LV?'Cấp '+CFG.DD_LV:0,ev.dd]]);
  if(!inC&&!isStoreOpen())return head+'<div class="card empty"><b>'+(!S.dayStarted&&!isOver()?'Đang chuẩn bị mở cửa':'Cửa hàng đã hết giờ hoạt động')+'</b>'+(!S.dayStarted&&!isOver()?'Kiểm tra kho và đăng bán vật phẩm, rồi bấm BẮT ĐẦU NGÀY '+S.day+' để mở các sự kiện.':'Sự kiện hoạt động từ 08:00 đến 21:00. Bạn vẫn có thể quản lý kho, đăng bán và dùng các mục Cộng đồng.')+'</div>';
  if(sub==='au') return head+viewAU();
  if(sub==='dd') return head+viewDD();
  if(sub==='bank') return head+viewBank();
  if(sub==='ap') return head+viewAppraise();
  const inner=seg('bmx',[['tr','Giao dịch đen',S.lvl<CFG.TRADE_LV?'Cấp '+CFG.TRADE_LV:0,ev.tr],['bm','Chợ đen',S.lvl<CFG.BM_LV?'Cấp '+CFG.BM_LV:0,ev.bm]]);

}

function ddBox(){
  const d=S.dd,it=ITEMS[d.id],cur=d.p[d.p.length-1],ch=(cur/d.p0-1)*100;

  const mn=Math.min(...d.p,d.p0),mx=Math.max(...d.p,d.p0),rg=(mx-mn)||1;
  const pts=d.p.map((v,i)=>(i/DD_STEPS*300).toFixed(1)+','+(86-(v-mn)/rg*80).toFixed(1)).join(' ');
  const base=(86-(d.p0-mn)/rg*80).toFixed(1),col=cur>=d.p0?'var(--good)':'var(--bad)';
  return '<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · đang cược</div></div></div>'+

   '<p class="muted" style="margin:0">Cuối 6 giây, giá cao hơn lúc đặt cược thì bạn nhận tiền thưởng bằng giá trị item và giữ lại item. Giá thấp hơn thì mất item.</p>';
}

function viewBM(){
  if(S.lvl<CFG.BM_LV) return lockedCard('Chợ đen',CFG.BM_LV,'Hàng hiếm, giảm giá 10–30%, chỉ mở một lần mỗi ngày.');
  const intro='<div class="card"><h3>Chợ đen</h3><p class="muted" style="margin:0">Mở một lần mỗi ngày, từ '+fmtClock(CFG.BM_OPEN)+' đến '+fmtClock(CFG.BM_CLOSE)+'. Hàng từ hiếm trở lên xuất hiện ngẫu nhiên, giá thấp hơn thị trường và số lượng có hạn.</p></div>';
  if(S.clock<CFG.BM_OPEN) return intro+'<div class="card empty"><b>Chợ đen chưa mở</b>Mở lúc '+fmtClock(CFG.BM_OPEN)+' (còn <span data-cd="'+CFG.BM_OPEN+'">'+fmtDur(CFG.BM_OPEN-S.clock)+'</span>).</div>';
  if(S.clock>=CFG.BM_CLOSE) return intro+'<div class="card empty"><b>Chợ đen đã đóng</b>Hẹn bạn vào ngày mai.</div>';
  const act=bmActive();
  if(!act.length) return intro+'<div class="card empty"><b><span class="pulse"></span>Đang chờ hàng về</b>Món mới có thể xuất hiện bất cứ lúc nào. Chợ đóng sau <span data-cd="'+CFG.BM_CLOSE+'">'+fmtDur(CFG.BM_CLOSE-S.clock)+'</span>.</div>';
  return intro+act.map(o=>{
    const it=ITEMS[o.id],mk=price(o.id),d=Math.round((1-o.price/mk)*100),own=S.inv[o.id]||0;
    return '<div class="card offer"><button class="tile r'+it.r+'" data-a="item" data-id="'+o.id+'" style="pointer-events:none"><span class="t-e">'+it.e+'</span></button>'+
     '<div class="oi"><b style="font-family:var(--fd);font-size:17px">'+it.n+'</b><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+' · Đang có '+own+'</div>'+
     '<div style="margin-top:4px"><b>'+fmt(o.price)+' ₫</b> <small><s>'+fmt(mk)+'</s></small> <span class="delta '+(d>=0?'up':'dn')+'">'+(d>=0?'−':'+')+Math.abs(d)+'%</span></div>'+
     '<div class="muted">Còn '+o.qty+' · hết sau <span data-cd="'+o.end+'">'+fmtDur(o.end-S.clock)+'</span></div></div>'+
     '<button class="btn primary" data-a="bmAsk" data-o="'+o.oid+'">Săn</button></div>';
  }).join('');
}
function auCard(a,i){
  const it=ITEMS[a.id],mk=price(a.id);
  const item='<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+'</div><div class="muted">Giá thị trường: <b>'+fmt(mk)+' ₫</b></div></div></div>';
  const t='<h3>Phiên đấu giá '+(i+1)+'</h3>';
  if(a.status==='open') return '<div class="card">'+t+item+
    '<div class="kv"><span>Giá khởi điểm</span><b>'+fmt(a.start)+' ₫</b></div><div class="kv"><span>Bước nhảy</span><b>'+fmt(a.step)+' ₫</b></div><div class="kv"><span>Phí tham gia (theo cấp và tài sản)</span><b>'+fmt(a.fee)+' ₫</b></div>'+
    '<button class="btn primary block" style="margin-top:12px" data-a="auJoinAsk" data-i="'+i+'"'+(S.money<a.fee?' disabled':'')+'>Tham gia · '+fmt(a.fee)+' ₫</button></div>';
  if(a.status==='joined'){
    const holder=a.holder===null?'Chưa ai ra giá':a.holder==='you'?'Bạn đang dẫn đầu':a.bots[a.holder].n+' đang dẫn đầu';
    const n1=auNext(a),n3=n1+a.step*2;
    return '<div class="card">'+t+item+
     '<div class="kv"><span>Giá hiện tại</span><b>'+fmt(a.cur)+' ₫</b></div><div class="kv"><span>Tình hình</span><b>'+(a.busy?'<span class="spin"></span>Đối thủ đang cân nhắc…':holder)+'</b></div>'+
     '<div class="btnrow"><button class="btn primary" data-a="auBid" data-i="'+i+'" data-j="1"'+(a.busy||S.money<n1?' disabled':'')+'>Ra giá '+fmt(n1)+'</button><button class="btn" data-a="auBid" data-i="'+i+'" data-j="3"'+(a.busy||S.money<n3?' disabled':'')+'>Nhảy 3 bước '+fmt(n3)+'</button></div>'+
     '<button class="btn block" style="margin-top:8px" data-a="auLeaveAsk" data-i="'+i+'"'+(a.busy?' disabled':'')+'>Bỏ cuộc (mất phí '+fmt(a.fee)+' ₫)</button>'+
     (a.log.length?'<div style="margin-top:10px">'+a.log.slice(0,5).map(l=>'<div class="log"><span>'+l+'</span></div>').join('')+'</div>':'')+'</div>';
  }
  const msg=a.status==='won'?'Bạn đã thắng và nhận '+it.n+' với giá '+fmt(a.cur)+' ₫.':a.status==='lost'?'Bạn không giành được món này. Phí tham gia đã mất.':'Bạn đã bỏ lỡ phiên này.';
  return '<div class="card">'+t+item+'<p style="margin:0"><b>'+msg+'</b></p></div>';
}
function viewAU(){
  if(S.lvl<CFG.AU_LV) return lockedCard('Đấu giá',CFG.AU_LV,'Mỗi ngày có 3 phiên, đấu với các đối thủ ẩn danh.');
  const list=S.au&&S.au.list&&S.au.day===S.day?S.au.list:[];
  let h='<div class="card"><h3>Đấu giá</h3><p class="muted" style="margin:0">Mỗi ngày có 3 phiên xuất hiện ngẫu nhiên. Đóng phí để tham gia, ra giá để giành item. Bỏ cuộc hoặc thua thì mất phí. Các đối thủ là bot ẩn danh.</p></div>';
  const shown=list.map((a,i)=>({a,i})).filter(x=>x.a.status!=='wait');
  const waiting=list.filter(a=>a.status==='wait').length;
  h+=shown.map(x=>auCard(x.a,x.i)).join('');
  if(waiting&&!isOver()) h+='<div class="card empty"><b><span class="pulse"></span>Còn '+waiting+' phiên sắp xuất hiện</b>Các phiên mới sẽ xuất hiện ngẫu nhiên trong ngày.</div>';
  else if(!shown.length) h+='<div class="card empty"><b>Đấu giá đã ngưng</b>Hết giờ hoạt động hôm nay.</div>';
  return h;
}

const kfmt=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'tr':n>=1e3?Math.round(n/1e3)+'k':String(n);
function viewSell(kind){
  const list=kind?S.listings.filter(L=>kind==='bag'?L.kind==='bag':L.kind!=='bag'):S.listings;
  if(!list.length)return '<p class="muted">Quầy chưa có hàng. Chọn hàng trong '+(kind==='bag'?'Kho tồn':'Túi nhân vật')+' để đăng bán.</p>'+shoppingEmptyLinks()+(kind!=='bag'?'<button class="btn block" data-a="nav" data-k="char" data-sub="bag">🎒 Túi thẻ</button>':'');
  return '<p class="muted">Khách chọn hàng theo giá, tính cách và sức mua. Tiền được cộng khi thanh toán.</p><div class="slots">'+list.map(L=>{const it=listingProduct(L);return '<button class="slot lst r'+it.r+'" data-a="listOpen" data-uid="'+L.uid+'" aria-label="'+esc(it.n)+'"><span class="t-e">'+it.e+'</span><span class="lp">'+kfmt(L.ask)+'</span><span class="sq">'+(L.cert?scoreTxt(L.cert.score):'×'+L.qty)+'</span></button>';}).join('')+'</div>';
}
function showListing(uid){
  const bag=S.listings.find(L=>L.uid===uid&&L.kind==='bag');if(bag){showBagListingDetails(uid);return;}
  const L=S.listings.find(x=>x.uid===uid);if(!L){closeModal();return;}
  const it=ITEMS[L.id],cert=L.cert?{id:L.id,score:L.cert.score,mult:L.cert.mult}:null;
  const ref=cert?certPrice(cert):price(L.id),m=(L.ask/ref-1)*100,pr=fillProb(L.id,L.ask,L.cert);
  sheet('<div class="hero-item r'+it.r+'"><div class="big">'+it.e+'</div><div style="flex:1;min-width:0"><h2>'+it.n+'</h2><div class="muted"><span class="rtag r'+it.r+'">'+RAR[it.r]+'</span> · '+COLS[it.ci].name+(L.cert?' · '+scoreTxt(L.cert.score)+'/10đ':' · ×'+L.qty)+'</div></div></div>'+
   '<div class="kv"><span>Giá thị trường hiện tại</span><b>'+fmt(ref)+' ₫</b></div>'+
   '<div class="kv"><span>Giá bán / cái</span><b>'+fmt(L.ask)+' ₫ <span class="'+(m>=0?'up':'dn')+'">('+(m>=0?'+':'')+m.toFixed(0)+'%)</span></b></div>'+
   '<div class="kv"><span>Cơ hội bán</span><b>'+chanceTxt(pr)+'</b></div>'+
   '<div class="btnrow"><button class="btn" data-a="listDown" data-uid="'+L.uid+'">Hạ giá 5%</button><button class="btn" data-a="listEdit" data-uid="'+L.uid+'">Sửa giá</button><button class="btn" data-a="listCancel" data-uid="'+L.uid+'">Gỡ bán</button></div>'+
   '<button class="btn block" style="margin-top:8px" data-a="closeM">Đóng</button>');
}

   '<div class="kv" style="margin-top:8px"><span>Thẻ hiếm nhất hôm nay</span><b>'+(d.bestId!==null?ITEMS[d.bestId].e+' '+ITEMS[d.bestId].n:'Chưa có')+'</b></div>'+
   '<button class="btn block" style="margin-top:8px" data-a="endDayAsk">Kết thúc ngày</button></div>';

function viewBST(){
  if(ui.bstCol!==null){
    const c=COLS[ui.bstCol];
    const have=c.byR.reduce((n,a)=>n+a.filter(id=>S.disc[id]).length,0);
    let h='<button class="back" data-a="bstBack">‹ Tất cả bộ sưu tập</button><div class="card"><div class="row"><div><h3 style="margin:0">'+c.icon+' '+c.name+'</h3><small>Đã sưu tầm '+have+'/36</small></div></div><div class="bar" style="margin-top:8px"><i style="width:'+(have/36*100)+'%"></i></div></div>';
    for(let r=5;r>=0;r--){
      const arr=c.byR[r],n=arr.filter(id=>S.disc[id]).length;
      h+='<h4 class="rh r'+r+'">'+RAR[r]+' <small>'+n+'/'+arr.length+'</small></h4><div class="tiles">'+arr.map(id=>tile(id)).join('')+'</div>';
    }
    return h;
  }
  return COLS.map(c=>{
    if(!unlocked(c.id)){const can=c.fee&&S.lvl>=c.unlock;return '<div class="col-card'+(can?'':' lock')+'"><span class="col-ico">🔒</span><span style="flex:1"><b style="font-family:var(--fd);font-size:17px">'+c.name+'</b><br><small>'+(c.fee?'Cấp '+c.unlock+' + '+fmt(c.fee)+' ₫ để mở khóa':'Mở khóa ở cấp '+c.unlock)+'</small></span>'+(can?'<button class="btn primary" data-a="colBuy" data-c="'+c.id+'" style="flex:none">Mở khóa</button>':'')+'</div>';}
    const have=c.byR.reduce((n,a)=>n+a.filter(id=>S.disc[id]).length,0);
    return '<button class="col-card" data-a="bstOpen" data-c="'+c.id+'"><span class="col-ico">'+c.icon+'</span><span style="flex:1;min-width:0"><b style="font-family:var(--fd);font-size:17px">'+c.name+'</b><br><small>'+have+'/36 item</small><div class="bar"><i style="width:'+(have/36*100)+'%"></i></div></span></button>';
  }).join('');
}

function viewItems(){
  const owned=Object.keys(S.inv).map(Number).filter(id=>S.inv[id]>0&&(ui.irar<0||ITEMS[id].r===ui.irar)&&(ui.icol<0||ITEMS[id].ci===ui.icol));
  const sorts=[['col','Theo bộ'],['hi','Hiếm → thường'],['lo','Thường → hiếm']];
  const nb=Object.values(S.bags).reduce((s,n)=>s+n,0);
  let h='<div class="chips" style="margin-bottom:8px">'+sorts.map(([k,t])=>'<button class="chip'+(ui.isort===k?' on':'')+'" data-a="isort" data-v="'+k+'">'+t+'</button>').join('')+'</div>'+
   '<div class="chips" style="margin-bottom:8px"><button class="chip'+(ui.irar<0?' on':'')+'" data-a="irar" data-v="-1">Tất cả</button>'+RAR.map((t,r)=>'<button class="chip'+(ui.irar===r?' on':'')+'" data-a="irar" data-v="'+r+'">'+t+'</button>').join('')+'</div>'+
   '<div style="margin-bottom:12px"><select class="sel" data-a="icol" aria-label="Lọc theo bộ"><option value="-1">Tất cả bộ sưu tập</option>'+COLS.filter(c=>unlocked(c.id)).map(c=>'<option value="'+c.id+'"'+(ui.icol===c.id?' selected':'')+'>'+c.icon+' '+c.name+'</option>').join('')+'</select></div>';
  const certs=(S.cert||[]).filter(c=>(ui.irar<0||ITEMS[c.id].r===ui.irar)&&(ui.icol<0||ITEMS[c.id].ci===ui.icol));
  if(!owned.length&&!certs.length) return h+'<div class="card empty"><b>Chưa có vật phẩm</b>Xé túi mù để nhận item đầu tiên.</div>';
  if(certs.length) h+='<h4 class="rh" style="color:var(--ink)">🏅 Item đã thẩm định <small>'+certs.length+'</small></h4><div class="tiles">'+certs.map(certTile).join('')+'</div>';
  h+='<p class="muted" style="margin:0 0 6px">'+(ui.selMode?'Chạm để chọn hoặc bỏ chọn item.':'Nhấn giữ một item để chọn nhiều và bán hàng loạt.')+'</p>';
  ui.shown=owned.slice();
  if(ui.isort==='col'){
    COLS.forEach(c=>{
      const ids=owned.filter(id=>ITEMS[id].ci===c.id).sort((a,b)=>ITEMS[b].r-ITEMS[a].r||a-b);
      if(ids.length) h+='<h4 class="rh" style="color:var(--ink)">'+c.icon+' '+c.name+' <small>'+ids.length+' loại</small></h4><div class="tiles">'+ids.map(id=>tile(id,'inv')).join('')+'</div>';
    });
  }else{
    const dir=ui.isort==='hi'?-1:1;
    const ids=owned.sort((a,b)=>dir*(ITEMS[a].r-ITEMS[b].r)||price(b)-price(a));
    h+='<div class="tiles">'+ids.map(id=>tile(id,'inv')).join('')+'</div>';
  }
  if(ui.selMode){
    const L=Object.keys(ui.sel).map(Number).filter(id=>S.inv[id]>0&&!isLocked(id));
    let net=0,cst=0;L.forEach(id=>{const A2=askInfo(id,5);net+=A2.net*S.inv[id];cst+=A2.cost*S.inv[id];});
    const g=Math.round(net-cst);
    h+='<div class="selbar"><b>Đã chọn '+L.length+' loại</b><small>Đăng bán hết (+5%) dự kiến ≈ '+fmt(net)+' ₫ · <span class="'+(g>=0?'up':'dn')+'">'+(g>=0?'lãi ':'lỗ ')+fmt(Math.abs(g))+'</span></small>'+
     '<div class="btnrow"><button class="btn" data-a="selCancel">Hủy</button><button class="btn" data-a="selAll">Chọn tất cả</button><button class="btn primary" data-a="selSellAsk"'+(L.length?'':' disabled')+'>Đăng bán</button></div></div>';
  }
  return h;
}

  if(!list.length){closeModal();return;}
  const left=S.bags[ci]||0,cnt=[0,0,0,0,0,0],grp={};
